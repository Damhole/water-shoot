    // kužel ~7°): kapka letí s proudem a jen z něj vystřelí. Zvýšený je JEN
    // počet — základ 0,45 místo nuly, protože od chvíle, kdy proud končí
    // nárazem do dřeva, se uzly nedožijí stáří, na kterém původní vzorec stál.
    if(Math.random() < dt * 2.4 * (0.45 + 0.55*u.t/ZIVOT)) pustKapku(u);
  }

  // nový stisk = nová generace, která se se starou nikdy nespojí
  if(strikaJe && !strikaloMinule) generace++;
  strikaloMinule = strikaJe;

  // SPOTŘEBA VODY. Stříkání ubírá ze zásobníku; když dojde, tryska nezhasne
  // úplně, ale klesne na poslední kapky (SUCHO_SILA). Kdyby zhasla docela,
  // hráč bez vody by neměl jak vodu z lahví získat a hra by se zasekla —
  // tohle je jediné místo, kde se dá uváznout, tak ať nemá kudy vzniknout.
  if(strikaJe && voda > 0) nastavVodu(voda - SPOTREBA_VODY()*dt);

  // náběh/doběh. TLAK KLESÁ S DOCHÁZEJÍCÍ VODOU: pod hladinou TLAK_OD už
  // tryska nedává plný proud a čůrek se plynule zkracuje k nule. Je to
  // varování, které jde vidět bez koukání na ukazatel — a zároveň to hráči
  // dá pár vteřin, kdy ještě může trefit lahev a doplnit si.
  const rampT = Math.max(0.02, +document.getElementById('ramp').value);
  const tlak = Math.min(1, voda/TLAK_OD);
  const cilSily = strikaJe ? tlak : 0;
  sila += (cilSily - sila) * Math.min(1, dt/rampT);
  if(!strikaJe && sila < 0.02) sila = 0;

  if(strikaJe || sila > 0.02){
    emitAkumulator += EMIT_ZA_S*dt*sila;
    while(emitAkumulator >= 1){
      emitAkumulator -= 1;
      const v = rychlostNaCil(cil.x, cil.y, cil.z);
      // Síla musí ovlivnit RYCHLOST, ne jen tloušťku. Jinak proud od první
      // chvíle doletí přesně k zaměřovači a jen se ztenčí — což vypadá, jako
      // by tryska naskočila naráz. Se slabší rychlostí voda nedoletí a dostřik
      // se postupně prodlužuje, přesně jako ve 2D verzi. Totéž při puštění:
      // proud se zkracuje, ne že by daleko stříkal tenčeji.
      v.multiplyScalar(0.30 + 0.70*sila);
      // drobný rozptyl, ať proud není matematicky dokonalý
      v.x += (Math.random()-0.5)*40;
      v.y += (Math.random()-0.5)*40;
      uzly.push({ p: USTI.clone(), v, t: 0, gen: generace, s: sila });
    }
  }
}

// Pro každou generaci vlastní trubice. Meshe i GEOMETRIE se recyklují.
//
// PROČ TAK SLOŽITĚ: původně se každý snímek volalo new THREE.TubeGeometry()
// a stará se dispose(). To znamenalo 90,6 kB nově alokovaných a na GPU
// nahraných dat KAŽDÝ SNÍMEK, tedy 5,3 MB/s. Na Macu i iPhonu to projde,
// ale Android Chrome (Mali/Adreno) platí za realokaci bufferů víc a GC je tam
// citelnější — projevovalo se to jako občasné problikávání při stříkání.
//
// Nově se geometrie alokuje JEDNOU pro maximální velikost a každý snímek se
// jen přepisují hodnoty vrcholů; kreslí se jen tolik, kolik je právě potřeba.
const MAX_SEG = 96;
const jety = [];
const obrysy = [];

function novaTrubice(rad, material){
  const geo = new THREE.BufferGeometry();
  const vrcholu = (MAX_SEG+1)*(rad+1);
  const pos = new THREE.BufferAttribute(new Float32Array(vrcholu*3), 3);
  const nor = new THREE.BufferAttribute(new Float32Array(vrcholu*3), 3);
  const uv  = new THREE.BufferAttribute(new Float32Array(vrcholu*2), 2);
  pos.setUsage(THREE.DynamicDrawUsage);
  nor.setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('position', pos);
  geo.setAttribute('normal', nor);
  geo.setAttribute('uv', uv);
  uv.setUsage(THREE.DynamicDrawUsage);   // u závisí na délce proudu, viz naplnTrubici
  const idx = [];
  for(let i=0;i<MAX_SEG;i++)
    for(let j=0;j<rad;j++){
      const a = i*(rad+1)+j, b = (i+1)*(rad+1)+j, c = (i+1)*(rad+1)+j+1, d = i*(rad+1)+j+1;
      idx.push(a,b,d, b,c,d);
    }
  geo.setIndex(idx);
  const m = new THREE.Mesh(geo, material);
  m.frustumCulled = false;        // vrcholy měníme ručně, obal by nesouhlasil
  scene.add(m);
  return { m, geo, rad };
}

// Naplní předalokovanou trubici. Tvarování (vlnění, hadí pohyb, tříštění konce)
// je zabudované rovnou sem, aby se geometrie neprocházela dvakrát.
const _N = new THREE.Vector3(), _B = new THREE.Vector3();
function naplnTrubici(t, krivka, seg, tl, cas, sil){
  const rad = t.rad;
  const pos = t.geo.attributes.position, nor = t.geo.attributes.normal;
  const uv = t.geo.attributes.uv;
  // UV se MUSÍ počítat z aktuálního seg, ne z MAX_SEG. Napevno nastavené UV
  // přes maximum znamenalo, že se u krátkého proudu vešel na jeho délku jen
  // zlomek textury — a ten vyšel jako jednolitá modrá bez jediného pruhu.
  const frames = krivka.computeFrenetFrames(seg, false);
  for(let i=0;i<=seg;i++){
    const u = i/seg;
    const stred = krivka.getPointAt(u);
    _N.copy(frames.normals[i]); _B.copy(frames.binormals[i]);

    const vlna = 1
      + 0.20*Math.sin(u*15.0 - cas*11.0)
      + 0.11*Math.sin(u*26.3 - cas*7.4)
      + 0.07*Math.sin(u*41.7 - cas*17.1);
    const zuz   = 1 - 0.45*u*u;
    const konec = u > 0.78 ? Math.max(0, 1 - (u-0.78)/0.22) : 1;
    const trhani = u > 0.7 ? 1 + 0.35*Math.sin(u*70 - cas*23)*((u-0.7)/0.3) : 1;
    const si = sil[Math.min(sil.length-1, Math.round(u*(sil.length-1)))];
    const r = tl * zuz * vlna * konec * trhani * (0.25 + 0.75*si);

    const amp = 7*u;
    const w1 = Math.sin(u*9.0 - cas*8.5)*amp, w2 = Math.sin(u*11.7 - cas*6.2)*amp*0.6;
    const ox = _N.x*w1 + _B.x*w2, oy = _N.y*w1 + _B.y*w2, oz = _N.z*w1 + _B.z*w2;

    for(let j=0;j<=rad;j++){
      const a = j/rad*Math.PI*2, ca = Math.cos(a), sa = Math.sin(a);
      const nx = ca*_N.x + sa*_B.x, ny = ca*_N.y + sa*_B.y, nz = ca*_N.z + sa*_B.z;
      const k = i*(rad+1)+j;
      pos.setXYZ(k, stred.x + ox + nx*r, stred.y + oy + ny*r, stred.z + oz + nz*r);
      nor.setXYZ(k, nx, ny, nz);
      uv.setXY(k, u, j/rad);
    }
  }
  pos.needsUpdate = true; nor.needsUpdate = true; uv.needsUpdate = true;
  t.geo.setDrawRange(0, seg*rad*6);
  t.m.visible = true;
}

function postavJet(cas){
  const rad = +document.getElementById('rad').value;
  const tl  = +document.getElementById('tl').value;

  const skupiny = new Map(), sily_ = new Map();
  for(let i=uzly.length-1;i>=0;i--){
    const u = uzly[i];
    let g = skupiny.get(u.gen);
    if(!g){ g = []; skupiny.set(u.gen, g); sily_.set(u.gen, []); }
    g.push(u.p);
    sily_.get(u.gen).push(u.s === undefined ? 1 : u.s);
  }

  let k = 0;
  for(const [genId, body] of skupiny){
    if(body.length < 4) continue;
    const sil = sily_.get(genId);
    const krivka = new THREE.CatmullRomCurve3(body);
    // Segmentů VŽDY stejně, nezávisle na počtu uzlů. Dřív se odvozovaly od
    // délky proudu, jenže UV se počítá jako i/seg — každá změna počtu uzlů
    // tedy posunula texturu a ta viditelně skočila. Při nízkém FPS kolísá
    // počet uzlů víc, proto to bylo znát hlavně tam a vypadalo to, jako by
    // se snižovala kvalita vykreslování.
    // Geometrie je předalokovaná na MAX_SEG, takže to nic nestojí navíc.
    const seg = MAX_SEG;

    // změna počtu hran po obvodu = jiné indexy, takže trubici postavíme znovu
    if(!jety[k] || jety[k].rad !== rad){
      if(jety[k]){ jety[k].geo.dispose(); scene.remove(jety[k].m); }
      if(obrysy[k]){ obrysy[k].geo.dispose(); scene.remove(obrysy[k].m); }
      // POŘADÍ: obrys musí vzniknout dřív než voda a mít nižší renderOrder,
      // jinak neprůhledný obrys překreslí průhlednou vodu (ta má depthWrite
      // vypnutý, takže se sama nebrání) a z proudu zůstane tmavá trubka.
      obrysy[k] = novaTrubice(rad, matObrys);
      obrysy[k].m.renderOrder = -1;
      jety[k] = novaTrubice(rad, matVoda);
      jety[k].m.renderOrder = 0;
    }
    naplnTrubici(jety[k], krivka, seg, tl, cas, sil);
    naplnTrubici(obrysy[k], krivka, seg, tl*OBRYS_RUST, cas, sil);
    k++;
  }
  for(let i=k;i<jety.length;i++){
    if(jety[i]) jety[i].m.visible = false;
    if(obrysy[i]) obrysy[i].m.visible = false;
  }
}

// ---- kapky ---------------------------------------------------------------
// Jednotlivé kapky, které se od proudu odtrhnou. Nejsou to „částice" v tom
// smyslu, že by na nich stál proud — je jich řádově desítky a jsou jen ozdoba.
// Kreslí se jako JEDEN objekt Points, takže je to jeden draw call bez ohledu
// na jejich počet.
// 220 stačilo, dokud se kapky trhaly hlavně na doletu. S hustším odtrháváním
// po celé délce vychází při volném letu ~270 kapek za vteřinu při životnosti
// kolem 0,85 s, takže by se pool vyčerpal a odtržení by tiše přestalo fungovat.
const KAPEK_MAX = 340;
const kapkyPos = new Float32Array(KAPEK_MAX*3);
const kapkyBarva = new Float32Array(KAPEK_MAX*3);
const kapky = [];
for(let i=0;i<KAPEK_MAX;i++) kapky.push({ ziva:false, x:0, y:0, z:0, vx:0, vy:0, vz:0, t:0, zivot:0, r:1, g:1, b:1 });

// Půl na půl bílá pěna a kapky v barvě proudu. Samá bílá vypadá jako sníh,
// samá modrá splyne s trubicí — teprve když je vidět obojí, čte se to jako
// voda. Modrá je TÁŽ, jakou má podklad textury proudu (#4aa9dd), takže odtržená
// kapka vypadá jako kus toho, co letí vedle ní.
const BARVA_VODY = new THREE.Color(0x4aa9dd);
const BARVA_PENY = new THREE.Color(0xffffff);
const _barva = new THREE.Color();
function barvaKapky(){
  const t = Math.random() < 0.5 ? 0 : 0.45 + Math.random()*0.55;
  return _barva.copy(BARVA_PENY).lerp(BARVA_VODY, t);
}

// OSTRÝ bílý puntík, ne gradient do ztracena. Rozostřovaly to dvě věci naráz:
// textura sama byla radiální gradient (od 40 % poloměru už průhledněla) a k ní
// si GPU při zmenšení na pár pixelů brala mipmapy, které zbytek rozmazaly.
// Stejný recept jako u ostatních ostrých textur v ballon-beltu: vypnout
// mipmapy a nechat LinearFilter.
function texturaKapky(){
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff';
  g.beginPath(); g.arc(16, 16, 13, 0, Math.PI*2); g.fill();
  const t = new THREE.CanvasTexture(c);
  t.generateMipmaps = false;
  t.minFilter = THREE.LinearFilter;
  t.magFilter = THREE.LinearFilter;
  return t;
}

const kapkyGeo = new THREE.BufferGeometry();
kapkyGeo.setAttribute('position', new THREE.BufferAttribute(kapkyPos, 3));
// vertexColors = barva per kapka a pořád JEDEN draw call; PointsMaterial ji
// jen vynásobí s bílou texturou, takže puntík zůstane ostrý
kapkyGeo.setAttribute('color', new THREE.BufferAttribute(kapkyBarva, 3));
const texKapka = texturaKapky();
const kapkyMesh = new THREE.Points(kapkyGeo, new THREE.PointsMaterial({
  size: 16, map: texKapka, transparent: true, depthWrite: false,
  sizeAttenuation: true, opacity: 0.95, vertexColors: true,
}));
kapkyMesh.frustumCulled = false;
scene.add(kapkyMesh);

// DROBNÉ kapičky = rozstřik od pevné plochy. Náraz nemá vypadat jako výbuch,
// ale jako mlžný závoj, který se po ploše rozlije a zmizí.
//
// PROČ VLASTNÍ SHADER MÍSTO PointsMaterial: PointsMaterial umí jen jednu
// velikost a jedno krytí pro celý objekt. Kapičky pak všechny do posledního
// snímku svítí naplno a naráz zmiznou — což oko čte jako „zhaslo to", ne jako
// rozplynutí. Se dvěma atributy navíc (velikost, krytí) může každá kapička
// vlastním tempem slábnout a zmenšovat se, a pořád je to JEDEN draw call.
const DROBNYCH_MAX = 700;
const drobnePos   = new Float32Array(DROBNYCH_MAX*3);
const drobneVel   = new Float32Array(DROBNYCH_MAX);
const drobneKryti = new Float32Array(DROBNYCH_MAX);
const drobneBarva = new Float32Array(DROBNYCH_MAX*3);
const drobne = [];
for(let i=0;i<DROBNYCH_MAX;i++) drobne.push({ ziva:false, lezi:false, x:0,y:0,z:0, vx:0,vy:0,vz:0, t:0, zivot:0, vel:0, r:1, g:1, b:1 });
const drobneGeo = new THREE.BufferGeometry();
drobneGeo.setAttribute('position',  new THREE.BufferAttribute(drobnePos, 3));
drobneGeo.setAttribute('velikost',  new THREE.BufferAttribute(drobneVel, 1));
drobneGeo.setAttribute('kryti',     new THREE.BufferAttribute(drobneKryti, 1));
drobneGeo.setAttribute('barva',     new THREE.BufferAttribute(drobneBarva, 3));

// mer = totéž, co si three počítá pro sizeAttenuation: půlka výšky plátna
// KRÁT pixelRatio. Ten násobek se snadno vynechá (a taky jsem ho vynechal) —
// pak vyjdou body pod jeden pixel a rozstřik prostě není vidět, aniž by
// cokoli hlásilo chybu.
const matDrobne = new THREE.ShaderMaterial({
  uniforms: { mapa: { value: texKapka },
              mer: { value: innerHeight*0.5*Math.min(devicePixelRatio,2) } },
  transparent: true, depthWrite: false,
  vertexShader: `
    attribute float velikost;
    attribute float kryti;
    attribute vec3 barva;
    uniform float mer;
    varying float vKryti;
    varying vec3 vBarva;
    void main(){
      vKryti = kryti;
      vBarva = barva;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = velikost * (mer / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform sampler2D mapa;
    varying float vKryti;
    varying vec3 vBarva;
    void main(){
      vec4 t = texture2D(mapa, gl_PointCoord);
      if(t.a * vKryti < 0.01) discard;
      gl_FragColor = vec4(t.rgb * vBarva, t.a * vKryti);
    }`,
});
const drobneMesh = new THREE.Points(drobneGeo, matDrobne);
// Bounding sphere se počítá z výchozích (nulových) pozic v poolu, takže by
// three celý objekt ořízl, jakmile se počátek scény dostane mimo záběr.
drobneMesh.frustumCulled = false;
scene.add(drobneMesh);

function pustDrobnou(x, y, z, vx, vy, vz, vel, zivot){
  for(const k of drobne){
    if(k.ziva) continue;
    k.ziva = true; k.lezi = false; k.t = 0; k.zivot = zivot;
    k.x = x; k.y = y; k.z = z; k.vx = vx; k.vy = vy; k.vz = vz; k.vel = vel;
    // U DOPADU JE KAPIČKA MODRÁ a cestou bledne do pěny (dělá to krokDrobnych).
    // Souvislá hmota vody je modrá, protože je jí přes sebe hodně; jakmile se
    // rozpadne na kapky a nabere vzduch, rozptýlí světlo a bílá. Tady se
    // ukládá jen výchozí odstín, ať každá kapka nezačíná stejná.
    const c = _barva.copy(BARVA_VODY).lerp(BARVA_PENY, Math.random()*0.25);
    k.r = c.r; k.g = c.g; k.b = c.b;
    return;
  }
}

// ODPOR VZDUCHU je to, co dělá z pelet mlhu. Kapička o průměru pár milimetrů
// ztratí rychlost během desetin sekundy — bez toho letí po čisté parabole
// a rozstřik vypadá jako vystřelené broky. Exponenciální útlum drží stabilitu
// i při dlouhém snímku, kde by násobení (1 - k*dt) přeteklo do záporu.
const ODPOR = 2.8;
function krokDrobnych(dt){
  const tlum = Math.exp(-ODPOR*dt);
  let n = 0;
  for(const k of drobne){
    if(!k.ziva) continue;
    k.t += dt;
    if(k.lezi){
      // Kapička už leží na desce. Nehýbe se, jen dožívá — je z ní mokrý bod,
      // ne létající částice.
      if(k.t > k.zivot){ k.ziva = false; continue; }
    } else {
      k.vy -= G*dt;
      k.vx *= tlum; k.vy *= tlum; k.vz *= tlum;
      const predY = k.y;
      k.x += k.vx*dt; k.y += k.vy*dt; k.z += k.vz*dt;
      if(k.t > k.zivot || k.y < podlahaY + 2){ k.ziva = false; continue; }
      // DOPAD NA DESKU POLICE. Bez tohohle kapičky policemi propadávaly, což
      // je hlavně u rozstřiku od zadní stěny vidět — voda se rozbije o zeď
      // a měla by skončit na nejbližší desce pod sebou, ne propadnout celým
      // barem až na podlahu.
      // Testuje se PRŮCHOD horní rovinou (předchozí y nad, nové pod), ne jen
      // aktuální poloha: kapička urazí za snímek až 12 jednotek, kdežto deska
      // je 18 tenká, takže test na poloze by část průchodů propásl.
      if(k.vy < 0){
        for(const kv of DREVO){
          if(kv.max[1] - kv.min[1] > 40) continue;        // deska, ne stěna
          if(predY <= kv.max[1] || k.y > kv.max[1]) continue;
          if(k.x < kv.min[0] || k.x > kv.max[0]) continue;
          if(k.z < kv.min[2] || k.z > kv.max[2]) continue;
          k.y = kv.max[1] + 1;
          k.vx = k.vy = k.vz = 0;
          k.lezi = true;
          // ať se neválí dlouho: zbytek života se zkrátí na třetinu
          k.zivot = k.t + (k.zivot - k.t)*0.34;
          break;
        }
      }
    }
    const u = k.t/k.zivot;
    drobnePos[n*3] = k.x; drobnePos[n*3+1] = k.y; drobnePos[n*3+2] = k.z;
    // Kapička je plná bílá skoro celý život a teprve poslední čtvrtinu zhasne.
    // Plynulé slábnutí od začátku (dřív druhá mocnina) dělalo z puntíků mlhavé
    // šmouhy — právě to „rozostření na konci", které tam nemá být.
    drobneVel[n]   = k.vel * (1 - 0.20*u);
    drobneKryti[n] = u < 0.75 ? 1 : (1-u)*4;
    // BLEDNUTÍ ZA LETU: u dopadu modrá, dál v letu bílá. Bílá je hotová ve
    // dvou třetinách života, aby zbytek dráhy kapka doletěla jako pěna a
    // nezhasla dřív, než se přebarví.
    const w = Math.min(1, u*1.5);
    drobneBarva[n*3]   = k.r + (BARVA_PENY.r - k.r)*w;
    drobneBarva[n*3+1] = k.g + (BARVA_PENY.g - k.g)*w;
    drobneBarva[n*3+2] = k.b + (BARVA_PENY.b - k.b)*w;
    n++;
  }
  drobneGeo.setDrawRange(0, n);
  drobneGeo.attributes.position.needsUpdate = true;
  drobneGeo.attributes.velikost.needsUpdate = true;
  drobneGeo.attributes.kryti.needsUpdate = true;
  drobneGeo.attributes.barva.needsUpdate = true;
  return n;
}

// `ded` = kolik si kapka nese z rychlosti uzlu, `rozptyl` = jak moc uhne stranou.
// Obojí je parametr, protože obě místa, odkud se kapky pouštějí, chtějí něco
// jiného: u dopadu má kapka letět tam, kam ji odrazí plocha (malý rozptyl),
// kdežto kapka odtržená za letu musí PROUDU UHNOUT. S dědičností 0,85 a
// rozptylem 260 na rychlost 2200 je to kužel 7° — kapka letí uvnitř trubice,
// není ji vidět a doletí až k dopadu. Právě proto se zdálo, že podél proudu
// nic nestříká.
function pustKapku(u, rozptyl, ded){
  if(rozptyl === undefined) rozptyl = 260;
  if(ded === undefined) ded = 0.85;
  for(const k of kapky){
    if(k.ziva) continue;
    k.ziva = true; k.t = 0; k.zivot = 0.5 + Math.random()*0.7;
    k.x = u.p.x; k.y = u.p.y; k.z = u.p.z;
    const c = barvaKapky(); k.r = c.r; k.g = c.g; k.b = c.b;
    k.vx = u.v.x*ded + (Math.random()-0.5)*rozptyl;
    k.vy = u.v.y*ded + (Math.random()-0.5)*rozptyl*0.8;
    k.vz = u.v.z*ded + (Math.random()-0.5)*rozptyl;
    return;
  }
}

// ŽÁDNÝ odpor vzduchu na velké kapky — a je to schválně. Zkusil jsem ho sem
// dát (1,6) spolu se sebranou rychlostí, aby se kapky za proudem opozdily a
// byly vidět vedle něj. Vypadalo to špatně: kapky proudu vypadly, samostatně
// se snášely a působily jako nesouvisející nepořádek. Kapka má LETĚT S PROUDEM
// a jen se z něj vylupovat — o to jde. Mlha u dopadu odpor má, ta se naopak
// rozplynout smí.
function krokKapek(dt){
  let n = 0;
  for(const k of kapky){
    if(!k.ziva) continue;
    k.t += dt;
    k.vy -= G*dt;
    k.x += k.vx*dt; k.y += k.vy*dt; k.z += k.vz*dt;
    if(k.t > k.zivot || k.y < podlahaY + 2){ k.ziva = false; continue; }
    kapkyPos[n*3] = k.x; kapkyPos[n*3+1] = k.y; kapkyPos[n*3+2] = k.z;
    kapkyBarva[n*3] = k.r; kapkyBarva[n*3+1] = k.g; kapkyBarva[n*3+2] = k.b;
    n++;
  }
  kapkyGeo.setDrawRange(0, n);
  kapkyGeo.attributes.position.needsUpdate = true;
  kapkyGeo.attributes.color.needsUpdate = true;
  return n;
}

// ---- efekty dopadu -------------------------------------------------------
// Kroužek, který se rozbíhá po ploše zásahu — to je to, co ve 2D verzi dělá
// dopad čitelným. Kroužky jsou v poolu a leží v rovině plochy, do které proud
// narazil, takže fungují na podlaze i na stěně.
// Prstenec je TENČÍ než dřív (0,72 → 0,86). Tlustý kroužek se při plné síle
// čte jako nakreslené kolečko, a když jich proud vyrábí desítky za vteřinu,
// je z plochy komiks. Tenká čára projde jako vlnka po hladině.
const KROUZKU = 26;
const krouzky = [];
const geoKrouzek = new THREE.RingGeometry(0.86, 1.0, 26);
const matKrouzek = new THREE.MeshBasicMaterial({
  color: 0xdff2ff, transparent: true, side: THREE.DoubleSide, depthWrite: false,
});
for(let i=0;i<KROUZKU;i++){
  const m = new THREE.Mesh(geoKrouzek, matKrouzek.clone());
  m.visible = false;
  scene.add(m);
  krouzky.push({ m, t: 0, zivot: 0, max: 0 });
}

function krouzek(x, y, z, normala, velikost){
  for(const k of krouzky){
    if(k.zivot > 0) continue;
    k.t = 0; k.zivot = 0.45; k.max = velikost;
    k.m.position.set(x, y, z);
    // otočit do roviny plochy
    if(normala === 'up') k.m.rotation.set(-Math.PI/2, 0, 0);
    else k.m.rotation.set(0, 0, 0);
    k.m.visible = true;
    k.m.scale.setScalar(velikost*0.25);
    return;
  }
}

function krokKrouzku(dt){
  for(const k of krouzky){
    if(k.zivot <= 0) continue;
    k.t += dt;
    if(k.t >= k.zivot){ k.zivot = 0; k.m.visible = false; continue; }
    const u = k.t/k.zivot;
    k.m.scale.setScalar(k.max*(0.25 + u*0.95));
    k.m.material.opacity = 0.32*(1-u)*(1-u);   // jemnější, rychleji mizí
  }
}

// ---- korunka ---------------------------------------------------------------
// TOHLE dělá ze šplouchance 3D. Bodové kapičky i kroužek jsou cedulky natočené
// na kameru, takže náraz je plochý; korunka je skutečné těleso — rozevřený
// otevřený kužel, co v místě dopadu vyroste, roztáhne se a splaskne. V
// perspektivě se sama zkracuje a na polici stojí jinak než na stěně.
//
// Tři věci, bez kterých to nefunguje:
//
//   1. OSA SE DRŽÍ NORMÁLY: 0,65 normály + 0,35 svislice. Korunka je tím
//      u kachniček a zadní stěny natočená k divákovi a je vidět celá.
//      Zkusil jsem to obrátit (0,35 normály + 0,65 svislice), protože mi
//      první verze přišla jako šedivý kotouč — jenže za tu šeď mohlo KRYTÍ,
//      ne osa, a vyklopená korunka se pak na stěně ukazovala z profilu jako
//      placka. Uživatel to poznal hned. Zpátky na 0,65 a nesahat na to.
//   2. SPODEK MUSÍ SEDĚT NA PLOŠE. Kužel je centrovaný, takže se odsazuje o
//      půl své výšky po ose — jinak by při růstu do plochy zajel.
//   3. NEJDŘÍV VYROSTE, POTOM ZESLÁBNE. Rozšiřuje se celou dobu, ale krytí
//      klesá s druhou mocninou; kdyby mizela lineárně, čte se to jako
//      zhasnutí, ne jako rozpad vody.
//
// Geometrie je JEDNA sdílená a předalokovaná, materiál per kus kvůli krytí —
// stejný vzorec jako u kroužků. V herní smyčce se tedy nic nealokuje.
const KORUNEK = 10;
const korunky = [];
const geoKorunka = new THREE.CylinderGeometry(1, 0.42, 1, 16, 1, true);
// ZUBY NAHOŘE. Hladký kužel se čte jako stínítko lampy, ne jako voda —
// korunka má po obvodu cípy. Dělají se posunem horního věnce: kde je cíp,
// je poloměr větší A vrchol výš. Počítá se to z ÚHLU, ne z pořadí vrcholů,
// takže je jedno, jak si three geometrii poskládá.
// K tomu pěna nahoře a voda dole jako barva po vrcholech, ať to není placka.
{
  const p = geoKorunka.attributes.position;
  const barvy = new Float32Array(p.count*3);
  for(let i=0;i<p.count;i++){
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    if(y > 0){
      const cip = 0.5 + 0.5*Math.cos(Math.atan2(z, x)*8);   // 0 mezera, 1 cíp
      const f = 1 - 0.30*(1 - cip);
      p.setXYZ(i, x*f, y + 0.16*cip, z*f);
    }
    const u = p.getY(i) + 0.5;                       // 0 dole, 1 nahoře
    barvy[i*3]   = 0.52 + 0.48*u;
    barvy[i*3+1] = 0.84 + 0.16*u;
    barvy[i*3+2] = 0.97 + 0.03*u;
  }
  geoKorunka.setAttribute('color', new THREE.BufferAttribute(barvy, 3));
}
const matKorunka = new THREE.MeshBasicMaterial({
  vertexColors: true, transparent: true, side: THREE.DoubleSide, depthWrite: false,
});
for(let i=0;i<KORUNEK;i++){
  const m = new THREE.Mesh(geoKorunka, matKorunka.clone());
  m.visible = false;
  scene.add(m);
  korunky.push({ m, t: 0, zivot: 0, velikost: 0, sila: 1,
                 bx:0, by:0, bz:0, ox:0, oy:0, oz:0 });
}
const _kOsa = new THREE.Vector3(), _kUp = new THREE.Vector3(0,1,0);
const _kQ = new THREE.Quaternion();
// Odstup mezi korunkami. Bez něj by jich při plném proudu vznikalo přes sto za
// vteřinu, slily by se do jedné svítící hroudy a sežraly pool. S 0,055 s jich
// žije 4–5 naráz v různé fázi, což je přesně to, co čte jako živý šplouchanec.
const KORUNKA_ODSTUP = 0.055;
let korunkaOdpocet = 0;
// Měřítko z ⚙ panelu. 0 = korunky vypnuté, takže se dá rovnou porovnat se
// stavem před nimi, aniž by se sahalo do kódu.
let korunkaMer = 1;

function korunka(bod, normala, velikost){
  for(const k of korunky){
    if(k.zivot > 0) continue;
    _kOsa.copy(normala).multiplyScalar(0.65).addScaledVector(_kUp, 0.35).normalize();
    _kQ.setFromUnitVectors(_kUp, _kOsa);
    k.m.quaternion.copy(_kQ);
    k.t = 0; k.velikost = velikost;
    // Slabý ráz nesmí jen zmenšit korunku, musí ji i ZTLUMIT a ZKRÁTIT.
    // Samotné zmenšení vypadá jako táž věc z dálky; teprve když dostřik
    // sotva bliknul, čte se jako „už to jen doprsklo".
    k.sila = Math.max(0.30, Math.min(1, velikost/42));
    k.zivot = 0.15 + 0.13*k.sila;
    k.bx = bod.x; k.by = bod.y; k.bz = bod.z;
    k.ox = _kOsa.x; k.oy = _kOsa.y; k.oz = _kOsa.z;
    k.m.visible = true;
    return;
  }
}

function krokKorunek(dt){
  if(korunkaOdpocet > 0) korunkaOdpocet -= dt;
  for(const k of korunky){
    if(k.zivot <= 0) continue;
    k.t += dt;
    if(k.t >= k.zivot){ k.zivot = 0; k.m.visible = false; continue; }
    const u = k.t/k.zivot;
    const r = k.velikost*(0.30 + 0.80*u);
    const h = k.velikost*(0.50 + 0.95*u);
    k.m.scale.set(r, h, r);
    // spodek kužele na plochu = posun o půl výšky po ose
    k.m.position.set(k.bx + k.ox*h*0.5, k.by + k.oy*h*0.5, k.bz + k.oz*h*0.5);
    // Krytí drží vysoko a padá až v druhé půlce. S 0,62 na začátku prosvítalo
    // hnědé dřevo natolik, že z bílé vody byl šedivý flek.
    k.m.material.opacity = 0.95*k.sila*Math.min(1, 2.2*(1-u)*(1-u));
  }
}

// Rozprsk od PEVNÉHO POVRCHU. Voda se od plochy neodrazí dozadu jako míč —
// rozlije se PO NÍ a jen zlomek se vrací proti proudu. Tři věci, na kterých
// stojí, že to čte jako lehký rozstřik a ne jako výbuch:
//
//   1. Vějíř se drží PLOCHY. Složka podél normály je jen 0,10–0,32 tangenciální
//      (dřív 0,35–0,85), takže voda po stěně steče, místo aby od ní odletěla.
//   2. Rozstřik má SMĚR — dopadová rychlost promítnutá do plochy. Voda po
//      nárazu pokračuje tam, kam letěla: po stěně nahoru, po desce dopředu.
//      Bez toho je z toho souměrná hvězda, tedy výbuch na místě.
//   3. Dvě frakce. Většinu tvoří pomalá jemná mlha s krátkým životem, zbytek
//      jsou větší, rychlejší kapky. Jedna velikost pro všechno vypadá buď
//      jako mrholení, nebo jako broky, nikdy jako voda.
//
// Vektory jsou předem připravené — rozprsk se volá až desetkrát za snímek
// a v herní smyčce se nealokuje.
const _t1 = new THREE.Vector3(), _t2 = new THREE.Vector3();
const _pom = new THREE.Vector3(), _tok = new THREE.Vector3();

function rozprsk(bod, normala, dopadRychlost, kolik){
  // dvě osy kolmé na normálu = rovina, do které se voda rozlévá
  if(Math.abs(normala.y) > 0.9) _pom.set(1,0,0); else _pom.set(0,1,0);
  _t1.crossVectors(normala, _pom).normalize();
  _t2.crossVectors(normala, _t1).normalize();
  const v0 = dopadRychlost.length();
  _tok.copy(dopadRychlost).addScaledVector(normala, -dopadRychlost.dot(normala)).normalize();

  // Korunka patří ke KAŽDÉMU dopadu — na podlahu, dřevo, kachničky i lahve —
  // ale jen jedna za KORUNKA_ODSTUP, jinak by se slily.
  //
  // VELIKOST JDE ZA RÁZEM VODY, ne za tím, že dopad nastal. Dřív to bylo
  // 22 + min(18, v0*0,008), tedy pevný základ 22 a k němu špetka rychlosti:
  // proud na konci dostřiku (v0 kolem 400) dělal korunku 25, plný zásah
  // zblízka (v0 kolem 2600) korunku 40 — poměr 1,6, ačkoli ráz se liší
  // šestkrát. Vypadalo to, že dostřikující voda mlátí do police stejně jako
  // proud z metru. Nově je základ jen 6 a zbytek je úměrný rychlosti, takže
  // stejné dvojici vyjde 15 a 47, tedy poměr 3,1.
  if(korunkaMer > 0 && korunkaOdpocet <= 0){
    korunkaOdpocet = KORUNKA_ODSTUP;
    korunka(bod, normala, (6 + Math.min(44, v0*0.0165))*korunkaMer);
  }

  for(let i=0;i<kolik;i++){
    const jemna = Math.random() < 0.65;
    const a = Math.random()*Math.PI*2;
    const ca = Math.cos(a), sa = Math.sin(a);
    const s  = v0*(jemna ? 0.05 + Math.random()*0.11 : 0.11 + Math.random()*0.15);
    const sn = s*(0.10 + Math.random()*0.22);          // od plochy pryč
    const st = s*(0.25 + Math.random()*0.55);          // po směru dopadu
    // VZHŮRU. Bez téhle složky rozstřik jen stekl po ploše dolů: tažení po
    // směru dopadu (st) bylo dvakrát silnější než cokoli jiného, a proud
    // dopadá na sestupné části oblouku, takže „směr dopadu" míří dolů.
    // Gravitace je 1500, takže aby kapka viditelně stoupala aspoň 0,2 s,
    // potřebuje kolem 300 nahoru — proto je násobek takhle velký.
    const su = s*(0.55 + Math.random()*0.75);
    // origin rozhozený po ploše, ať rozstřik nevychází z jednoho bodu
    const j1 = (Math.random()-0.5)*7, j2 = (Math.random()-0.5)*7;
    pustDrobnou(
      bod.x + _t1.x*j1 + _t2.x*j2,
      bod.y + _t1.y*j1 + _t2.y*j2,
      bod.z + _t1.z*j1 + _t2.z*j2,
      _t1.x*ca*s + _t2.x*sa*s + normala.x*sn + _tok.x*st,
      _t1.y*ca*s + _t2.y*sa*s + normala.y*sn + _tok.y*st + su,
      _t1.z*ca*s + _t2.z*sa*s + normala.z*sn + _tok.z*st,
      // Velikosti jsou ve stejných jednotkách jako `size` u PointsMaterial,
      // tedy ve SVĚTĚ, ne v pixelech: ve vzdálenosti polic (~1160) vyjde
      // z jednotky 0,45 px na obrazovce. Prvně jsem sem dal 3–6 a kapičky
      // měly na obrazovce necelé dva pixely — v poolu jich žilo 310 a nebylo
      // vidět vůbec nic. Teď to dělá 4–6 px mlha a 7–12 px větší kapky.
      jemna ? 6 + Math.random()*4 : 11 + Math.random()*6,
      // Delší život než dřív (0,20–0,40 a 0,34–0,62). Kapka musí přežít celý
      // oblouk — vystoupat a spadnout; s krátkým životem zmizela ve vrcholu
      // a z rozstřiku zbylo jen vyfouknutí do stran.
      jemna ? 0.30 + Math.random()*0.26 : 0.46 + Math.random()*0.36);
  }
}

// Dopad uzlu na podlahu: kroužek + rozstřik do stran. Uzel tím končí, protože
// voda po dopadu pokračovat nemá — dřív proud podlahou prolétl skrz.
function dopadNaZem(u){
  if(Math.random() < 0.18) krouzek(u.p.x, 1.5, u.p.z, 'up', 30 + Math.random()*22);
  // Podlaha je místo, kde proud končí nejčastěji, takže lehký rozstřik patří
  // hlavně sem. Velké kapky pod ním zůstávají — samotná mlha je málo.
  _nor.set(0,1,0);
  _bod.set(u.p.x, 3, u.p.z);
  rozprsk(_bod, _nor, u.v, 3 + (Math.random()*3|0));
  const n = 3 + (Math.random()*4|0);
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const r = 120 + Math.random()*280;
    pustKapku({ p: new THREE.Vector3(u.p.x, 6, u.p.z),
                v: new THREE.Vector3(Math.cos(a)*r, 150 + Math.random()*280, Math.sin(a)*r) });
  }
}

// ---- míření ---------------------------------------------------------------
let cil = { x: 0, y: 260 + STANOVISTE, z: -700 };
const _paprsek = new THREE.Vector3();

// Cíl se počítá PROMÍTNUTÍM PRSTU DO SCÉNY, ne přepočtem přes pevná rozpětí.
//
// Dřív to bylo `cil.y = … - ny*380` a `cil.x = nx*900`, tedy dvě čísla vycucaná
// z prstu. Jenže kolik světa je vidět, závisí na zorném úhlu, poměru stran okna
// a vzdálenosti cíle — a s těmi to nemělo nic společného:
//   • SVISLE bylo rozpětí 760 jednotek proti ~1250, které jsou v hloubce polic
//     na výšku vidět. Zaměřovač se tedy hýbal jen 0,6× rychlostí prstu a na
//     horní okraj scény se šlo dostat, až když prst dojel úplně nahoru.
//     Přesně tohle je to „jako by se to s pohybem nahoru zpomalovalo".
//   • VODOROVNĚ to bylo obráceně: ±900 proti ~±290 viditelným na svislém
//     displeji telefonu, takže do stran byl zaměřovač naopak přecitlivělý.
// Průsečík paprsku od kamery s rovinou cílové hloubky drží zaměřovač přesně
// pod prstem při jakémkoli poměru stran, a tím pádem i na mobilu.
// Poslední poloha prstu. Míření se musí přepočítat KAŽDÝ SNÍMEK, ne jen při
// pohybu prstu: kamera pod ním jezdí paralaxou, a kdyby se cíl nepřepočítal,
// zaměřovač by se prstu vysmekl vždycky, když se kamera rozjede.
let mirSX = null, mirSY = null;
// Zaškrtávátko se čte i tady, takže se musí získat DŘÍV než ho začne používat
// míření. `typeof` by nepomohlo — na const v dočasné mrtvé zóně vyhodí chybu.
const cbAuto = document.getElementById('autoStrik');
function mir(sx, sy){
  // V automatickém stříkání si scénu řídí ladicí režim sám — myš ani prst
  // do míření nesmí, jinak by se s ním praly a nešlo by nic v klidu doladit.
  if(cbAuto.checked) return;
  mirSX = sx; mirSY = sy;
  const nx = (sx/innerWidth)*2 - 1, ny = (sy/innerHeight)*2 - 1;
  // paralaxa se řídí polohou PRSTU, ne cílem ve světě — cíl závisí na kameře
  // a kamera na paralaxe, což by se navzájem hnalo dokola
  paralaxCil.set(nx*PARALAX_X, -ny*PARALAX_Y, 0);
  // Hloubka cíle = rovina kachniček. Dřív se odvozovala od vodorovné výchylky
  // (−420 až −840), jenže terče stojí v jedné hloubce: zaměřovač pak seděl na
  // kachničce jen opticky a proud jí prolétl před nosem. Do čeho hráč míří,
  // to musí trefit.
  cil.z = KACH_Z;
  // Paprsek skládám ze zorného úhlu ručně. `unproject` tu selhalo: pro NDC
  // z = 0,5 vrací bod jen pár jednotek před kamerou, takže parametr průsečíku
  // vyšel skoro nulový a cíl zůstal viset ve výšce kamery — zaměřovač se pak
  // po celé výšce displeje pohnul o 19 px.
  const tg = Math.tan(camera.fov*Math.PI/360);
  _paprsek.set(nx*tg*camera.aspect, -ny*tg, -1).applyQuaternion(camera.quaternion);
  const t = (cil.z - camera.position.z) / _paprsek.z;
  cil.x = camera.position.x + _paprsek.x*t;
  cil.y = camera.position.y + _paprsek.y*t;
}
// Dojíždění je exponenciální, ne lineární: kamera se rozjede hned, ale
// doklouže měkce, a hlavně je to stabilní i při dlouhém snímku.
// Ladicí míření: proud stojí VODOROVNĚ NA STŘEDU a jen pomalu přejíždí
// nahoru a dolů, takže je vidět celý rozsah dostřiku i tvar oblouku, aniž by
// do toho někdo sahal. Paralaxa se drží na nule — jinak by se scéna při
// každém přejezdu naklápěla a ladění barvy by bylo k ničemu.
const AUTO_PERIODA = 5.2;              // vteřin na jeden cyklus nahoru a dolů
let autoT = 0;
function krokAutoMireni(dt){
  autoT += dt;
  const u = 0.5 - 0.5*Math.cos(autoT*Math.PI*2/AUTO_PERIODA);   // 0..1 a zpět
  cil.z = KACH_Z;
  cil.x = 0;
  cil.y = -120 + u*900;
  paralaxCil.set(0, 0, 0);
}

function krokKamery(dt){
  paralax.lerp(paralaxCil, 1 - Math.exp(-PARALAX_TUHOST*dt));
  // Dobrzdění po přejezdu: tlumená sinusovka na výšce kamery. Kamera se za
  // barem „rozjela" a teď se musí vzpamatovat.
  let otres = 0;
  if(otresT >= 0){
    otresT += dt;
    otres = OTRES_A * Math.exp(-OTRES_TLUM*otresT) * Math.sin(OTRES_W*otresT);
    if(otresT > 0.9){ otresT = -1; otres = 0; }
  }
  otresY = otres;
  camera.position.set(KAM_ZAKLAD.x + paralax.x, KAM_ZAKLAD.y + paralax.y + otres, KAM_ZAKLAD.z);
  camera.lookAt(KAM_MIRI.x + paralax.x, KAM_MIRI.y + paralax.y + otres, KAM_MIRI.z);
  // Ústí jede s PARALAXOU, ale ne s otřesem: otřes má být vidět jako pohyb
  // celého obrazu včetně proudu, kdežto paralaxa má proud nechat na místě.
  USTI.set(USTI_ZAKLAD.x + paralax.x, USTI_ZAKLAD.y + paralax.y, USTI_ZAKLAD.z);
  // cíl se přepočítá až po posunu kamery, ať zaměřovač zůstane pod prstem
  if(cbAuto.checked) krokAutoMireni(dt);
  else if(mirSX !== null) mir(mirSX, mirSY);
}

// MÍŘENÍ NA DOTYKU JE RELATIVNÍ, jako trackpad. Prst netahá zaměřovač pod
// sebou, jen udává směr a rychlost — zaměřovač se posouvá NÁSOBKEM toho, co
// prst ujede. Bez toho musí hráč přejíždět palcem přes celý displej, i když
// chce jen z levého terče na pravý. Myš zůstává absolutní: kurzor JE zaměřovač
// a nic nezakrývá.
//
// Čísla jsou převzatá z 2D verze (`aimRel` v js/game.js): základ 1,8 a
// akcelerace, která přidá až 2,5×. Pomalý tah tedy jemně dolaďuje, švih
// přejede scénu. Bez akcelerace si člověk vybere jedno, ale nikdy obojí.
const DOTYK_ODSAZENI = 0.11;    // kam se zaměřovač postaví při doteku (nad prst)
const DOTYK_ZISK = 1.8;
function jeDotyk(e){ return e.pointerType === 'touch' || e.pointerType === 'pen'; }

let prstX = 0, prstY = 0, prstT = 0;
function zacniDotyk(e){
  prstX = e.clientX; prstY = e.clientY; prstT = performance.now();
  // při položení prstu se zaměřovač postaví NAD něj, aby ho palec nezakrýval
  mir(e.clientX, Math.max(innerHeight*0.04, e.clientY - innerHeight*DOTYK_ODSAZENI));
}
function tahniDotykem(e){
  const ted = performance.now();
  const dt = Math.max(4, ted - prstT)/1000;
  const dx = e.clientX - prstX, dy = e.clientY - prstY;
  prstX = e.clientX; prstY = e.clientY; prstT = ted;
  const rychlost = Math.hypot(dx, dy)/dt;
  const zisk = DOTYK_ZISK * (1 + 1.5*Math.pow(Math.min(rychlost/2500, 1), 1.5));
  const x = Math.min(innerWidth - 8,  Math.max(8, (mirSX ?? innerWidth/2)  + dx*zisk));
  const y = Math.min(innerHeight*0.92, Math.max(innerHeight*0.04, (mirSY ?? innerHeight/2) + dy*zisk));
  mir(x, y);
}
function mirZUdalosti(e){
  if(konec) return;          // po konci se už nemíří, kříž stejně mizí
  if(jeDotyk(e)) tahniDotykem(e); else mir(e.clientX, e.clientY);
}

let strika = false;            // start bez proudu; drž = stříká, pusť = proud se odtrhne a doletí
addEventListener('pointermove', mirZUdalosti);
// Při položení prstu se NESMÍ táhnout: `tahniDotykem` by počítalo rozdíl proti
// místu, kde prst ležel minule, a zaměřovač by po každém doteku uskočil.
addEventListener('pointerdown', e => {
  if(jeDotyk(e)) zacniDotyk(e); else mir(e.clientX, e.clientY);
  strika = true;
});
addEventListener('pointerup',   () => { strika = false; });
addEventListener('keydown', e => { if(e.code === 'Space') strika = !strika; });

// ---- panel nastavení: sbalovací a s pamětí -------------------------------
// Stejně jako ⚙ HUD v samotné hře: panel zavazí, takže je schovaný, a hodnoty
// přežijí reload, aby se doladěné nastavení neztrácelo.
const ULOZ_KLIC = 'ws_jet3d_tune';
const POSUVNIKY = ['fov','syt','svx','svy','stinS','vodaB','vodaA','vodaS','obrT','obrB','rad','tl','sp','sila','ramp','imp','kor','spot3'];

function uloz(){
  const o = {};
  for(const id of POSUVNIKY) o[id] = document.getElementById(id).value;
  o._stiny = document.getElementById('stiny').checked;
  o._auto = document.getElementById('autoStrik').checked;
  o._panel = !document.getElementById('hud').hidden;
  try{ localStorage.setItem(ULOZ_KLIC, JSON.stringify(o)); }catch(e){}
}
function nacti(){
  try{
    const o = JSON.parse(localStorage.getItem(ULOZ_KLIC) || 'null');
    if(!o) return false;
    for(const id of POSUVNIKY) if(o[id] !== undefined) document.getElementById(id).value = o[id];
    if(o._stiny !== undefined) document.getElementById('stiny').checked = o._stiny;
    if(o._auto !== undefined) document.getElementById('autoStrik').checked = o._auto;
    document.getElementById('hud').hidden = !o._panel;
    return true;
  }catch(e){ return false; }
}

const cog = document.getElementById('cog');
const hud = document.getElementById('hud');
cog.addEventListener('click', e => { e.stopPropagation(); hud.hidden = !hud.hidden; uloz(); });
// klik do panelu nesmí propadnout do míření pod ním
hud.addEventListener('pointerdown', e => e.stopPropagation());
hud.addEventListener('pointermove', e => e.stopPropagation());

// Vypínač stínů. Stín stojí celý průchod navíc, a i když na Macu drží 60 FPS,
// na mobilní GPU to je první podezřelý — ať jde odstavit bez zásahu do kódu.
const cbStiny = document.getElementById('stiny');
function nastavStiny(){
  renderer.shadowMap.enabled = cbStiny.checked;
  slunce.castShadow = cbStiny.checked;
  // materiály se musí přeložit, jinak zůstane starý shader i po vypnutí
  scene.traverse(o => { if(o.material) (Array.isArray(o.material)?o.material:[o.material])
    .forEach(m => m.needsUpdate = true); });
}
cbStiny.addEventListener('change', ()=>{ nastavStiny(); uloz(); });
// Automatické stříkání je JEN NA LADĚNÍ: proud teče pořád a míří si sám
// (viz krokAutoMireni), takže se dá hýbat posuvníky a hned vidět, co to
// udělalo, aniž by člověk musel držet tlačítko a mířit zároveň.
cbAuto.addEventListener('change', uloz);

// Posuvník života je čistě na ladění a ZÁMĚRNĚ se neukládá — hra musí po
// reloadu vždycky začít s plným životem, jinak by se uložená čtvrtina tvářila
// jako stav hry. Proto není v POSUVNIKY.
const ziv = document.getElementById('ziv'), vod = document.getElementById('vod');
ziv.addEventListener('input', ()=>{
  nastavZivot(+ziv.value/100);
  vZiv.textContent = ziv.value + ' %';
});
vod.addEventListener('input', ()=>{
  nastavVodu(+vod.value/100);
  vVod.textContent = vod.value + ' %';
});
vZiv.textContent = ziv.value + ' %';
vVod.textContent = vod.value + ' %';

document.getElementById('reset').addEventListener('click', ()=>{
  // VÝCHOZÍ HODNOTY = to, co si uživatel doladil na telefonu (10. 8. 2026).
  // Proti mému původnímu odhadu se změnily čtyři: zorný úhel 48 → 53, poloměr
  // proudu 9 → 8, rychlost toku 5 → 3,75 a síla proudu 2600 → 1700 (nižší síla
  // = vyklenutější oblouk). Barva vody, obrys ani svítivost se neměnily, ty
  // seděly hned napoprvé.
  const vych = { fov:53, syt:135, svx:-70, svy:110, stinS:75,
                 vodaB:'#4aa9dd', vodaA:94, vodaS:75, obrT:122, obrB:'#123a52',
                 rad:8, tl:8, sp:3.75, sila:1700, ramp:0.45, imp:34, kor:100, spot3:3.3 };
  for(const id of POSUVNIKY) document.getElementById(id).value = vych[id];
  obnovPopisky(); uloz();
});

for(const id of POSUVNIKY){
  document.getElementById(id).addEventListener('input', ()=>{ obnovPopisky(); uloz(); });
}
if(nacti()) console.log('[jet3d] nastavení obnoveno');
function obnovPopisky(){
  // zorný úhel se propisuje rovnou do kamery — míření i pás kachniček si ho
  // čtou z camera.fov, takže se přizpůsobí samy
  vFov.textContent = fov.value + '°';
  camera.fov = +fov.value; camera.updateProjectionMatrix();
  vSyt.textContent = syt.value + ' %';
  nastavSytost(+syt.value/100);
  // Světlo: vodorovně a na výšku z posuvníků, do hloubky pevně vepředu (1700).
  // Frontální složka se needituje schválně — je to to, co dělá stín „zepředu",
  // a kdyby šla dolů, vrátily by se dlouhé šmouhy přes celou stěnu.
  vSvX.textContent = svx.value; vSvY.textContent = svy.value;
  slunce.position.set(+svx.value*10, +svy.value*10, 1700);
  // Síla stínu: three od r165 umí shadow.intensity (0 = žádný, 1 = plný).
  // Bez ní by se dalo ztmavení řešit jen zesílením ambientu, což ale zesvětlí
  // i všechno ostatní.
  vStin.textContent = stinS.value + ' %';
  if('intensity' in slunce.shadow) slunce.shadow.intensity = +stinS.value/100;
  // VODA. Barva se překresluje do textury, ne přebarvuje materiálem:
  // materiál barvu s texturou NÁSOBÍ, takže by z modré nikdy nešla světlejší
  // ani jiný odstín — jen tmavší. Emisní barva se odvodí z téže barvy, aby
  // světlé pruhy svítily v tónu vody a ne natvrdo domodra.
  vVodaA.textContent = vodaA.value + ' %';
  vVodaS.textContent = vodaS.value + ' %';
  kresliVodu(vodaB.value);
  texVoda.needsUpdate = true;
  matVoda.opacity = +vodaA.value/100;
  matVoda.emissiveIntensity = +vodaS.value/100;
  matVoda.emissive.set(vodaB.value).multiplyScalar(0.55);
  // Obrys proudu je druhá trubice kreslená zevnitř (BackSide) o kus tlustší.
  // Tloušťka je NÁSOBEK poloměru, ne pevný přídavek — jinak by u tenkého
  // proudu obrys převládl a u tlustého zmizel.
  vObrT.textContent = obrT.value + ' %';
  OBRYS_RUST = +obrT.value/100;
  matObrys.color.set(obrB.value);
  vRad.textContent = rad.value;
  vTl.textContent = tl.value;  vSp.textContent = sp.value;
  vSila.textContent = sila.value; vRamp.textContent = (+ramp.value).toFixed(2);
  vImp.textContent = imp.value;
  vSpot.textContent = spot3.value + ' %/s';
  korunkaMer = +kor.value/100;
  vKor.textContent = kor.value + ' %';
}
obnovPopisky();
nastavStiny();

// ---- kachničky ------------------------------------------------------------
// Automatické terče jako na pouťové střelnici: kachnička se objeví, chvíli
// vydrží a zase zmizí. Kachničky jsou BANDITI z westernu — `img/bandit_ducks.png`,
// tentýž soubor, jaký používá js/western.js. Pozadí má průhledné (ověřeno:
// 61 % pixelů má alfu 0), takže jde rovnou na plane.
//
// Čtyři varianty v mřížce 2×2 se neřeší čtyřmi kopiemi textury (to by byly
// čtyři nahrání 1024² na GPU), ale ČTYŘMI GEOMETRIEMI s posunutými UV nad
// JEDNOU sdílenou texturou. Varianta = výměna geometrie, nic se nekopíruje.
const texBandita = new THREE.TextureLoader().load('./img/bandit_ducks.png');
texBandita.anisotropy = 4;
const BANDITU = 4;
const GEO_BANDITA = [];
for(let i=0;i<BANDITU;i++){
  const g = new THREE.PlaneGeometry(1, 1);
  const gx = i % 2, gy = (i/2)|0;          // gy 0 = HORNÍ řada obrázku, tedy v v <0,5; 1>
  const uv = g.attributes.uv;
  for(let k=0;k<uv.count;k++) uv.setXY(k, (uv.getX(k) + gx)*0.5, (uv.getY(k) + (1-gy))*0.5);
  uv.needsUpdate = true;
  GEO_BANDITA.push(g);
}
// Kachnička vyplňuje jen část buňky (western si na to drží BANDIT_ZOOM 1,16),
// takže se plane kreslí o kus větší, ať terč není opticky menší, než má být.
const BANDIT_ZOOM = 1.22;

// Hodnota podle patra. Na kachničce se NEUKAZUJE — hráč ji uvidí až v „+N"
// po sestřelu; na těle je místo ní pouťový terčík.
const HODNOTY = [10, 20, 30];

// Červenobílý terčík. Tmavý obrys je nutný, jinak bílé mezikruží splyne se
// žlutým tělem kachničky a z terče zbude jen pár červených fleků.
function texturaTercik(){
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const kruh = (r, barva)=>{ g.fillStyle = barva; g.beginPath(); g.arc(64,64,r,0,Math.PI*2); g.fill(); };
  kruh(60, '#f4f4f4');
  kruh(46, '#e0362a');
  kruh(31, '#f4f4f4');
  kruh(16, '#e0362a');
  g.strokeStyle = 'rgba(18,18,24,0.9)'; g.lineWidth = 5;
  g.beginPath(); g.arc(64,64,60,0,Math.PI*2); g.stroke();
  const t = new THREE.CanvasTexture(c);
  t.generateMipmaps = false; t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter;
  return t;
}
const texTercik = texturaTercik();

// Prstenec plnění. Výseč se řeže v shaderu podle uniformu, takže se nemusí
// každý snímek přestavovat geometrie — to je přesně ta realokace v herní
// smyčce, která na Androidu stála nejvíc (viz proud ve v129).
function novyPrstenec(){
  return new THREE.ShaderMaterial({
    uniforms: { postup: { value: 0 }, barva: { value: new THREE.Color(0x5ad1ff) } },
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      uniform float postup; uniform vec3 barva; varying vec2 vUv;
      void main(){
        vec2 p = vUv*2.0 - 1.0;
        float r = length(p);
        if(r > 1.0 || r < 0.74) discard;
        float a = atan(p.x, p.y);            // 0 nahoře, po směru hodinových ručiček
        if(a < 0.0) a += 6.2831853;
        if(a > postup*6.2831853) discard;
        gl_FragColor = vec4(barva, 0.95);
      }`,
  });
}

const KACHEN_MAX = 5;
const KACH_R = 62;                  // poloměr těla ve světě (lahev má 118 na výšku)
const KACH_TERC = 0.34;             // podíl poloměru, který se počítá jako střed terče
const NAJEZD = 0.30, ODJEZD = 0.28, UMIRANI = 0.34;
// posun terče proti středu kachničky — používá ho kresba i test zásahu,
// takže je to jedno místo, ne dvě čísla, která se rozejdou
const TERC_X = KACH_R*0.26, TERC_Y = -KACH_R*0.16;
// PIVOT SKUPINY JE U PATY TĚLA, ne uprostřed. Squash se pak hroutí dolů do
// sebe a kachnička zůstane stát na desce; se středovým pivotem se plácala na
// obě strany a vypadala, že visí ve vzduchu. Ze stejného důvodu i naskočení
// vyroste z police a cukání před odchodem se kýve kolem nohou.
// KACH_STRED = jak vysoko nad patou leží optický střed kachničky.
const KACH_STRED = KACH_R*0.92;
// tloušťka „překližky": pět vrstev po 3,5 jednotky = 14 hloubky
const KACH_VRSTEV = 5, KACH_VRSTVA = 3.5;
// Tloušťka terče. Tři vrstvy stačí — je menší než tělo a pátá by se ztratila.
const TERC_VRSTEV = 3, TERC_VRSTVA = 2.6;
// Jak velký kus zhynutí zabere smrsknutí terče, než se pustí kachnička.
const TERC_MIZI = 0.34;
// o kolik je kachnička vytočená kolem svislé osy (radiány, náhodně na obě strany)
const KACH_VYTOCENI = 0.30;
// CHVĚNÍ POD PROUDEM. Drobné, ale rychlé — 44 rad/s je sedm kmitů za vteřinu,
// což se čte jako drnčení, kdežto řád dýchání (3 rad/s) jako pohupování.
// Výchylky jsou schválně malinké: 3,5 % v měřítku, 1,8° náklonu a 2 px stranou.
const ZASAH_CHVENI_S = 0.035, ZASAH_CHVENI_R = 0.032, ZASAH_CHVENI_X = 2.0;
const ZASAH_CHVENI_W = 44, ZASAH_UTLUM = 14;   // útlum: po odtržení proudu utichne za ~0,2 s
// Zhynutí: kolik z animace zabere natažení vzhůru, než kachnička plácne
// do široka. Tohle je to pravé squash and stretch — u zásahu nemá co dělat.
const UMIRANI_NATAH = 0.30, UMIRANI_VYSKA = 22;
// Zhynutí je nově dvoufázové (terč, pak kachnička), takže celek musí být delší
// než původních 0,34 s — jinak by na kachničku zbylo 0,22 s a squash by se
// stihl jen mihnout.
const UMIRANI_CELEK = 0.52;
// POSAZENÍ NA POLICI. Kachnička nevyplňuje svou buňku ve spritu celou a každá
// varianta jinak — naměřeno z alfa kanálu bandit_ducks.png, kolik prázdna
// zbývá pod ní: 16,0 / 11,5 / 24,2 / 24,4 %. Se společnou výškou proto dvě
// z nich levitovaly o skoro čtvrtinu své výšky nad deskou.
// Pro každou variantu se počítá vlastní výška středu tak, aby NEJNIŽŠÍ
// neprůhledný pixel seděl přesně na desce (y = 0).
const KACH_PRAZDNO_DOLE = [0.1602, 0.1152, 0.2422, 0.2441];
const KACH_VYSKA = KACH_R*2*BANDIT_ZOOM;
const KACH_POSAZENI = KACH_PRAZDNO_DOLE.map(p => KACH_VYSKA*(0.5 - p));
const geoPlane = new THREE.PlaneGeometry(1, 1);
// podklad terče musí být KRUH jako ve 2D (drawDuckBadge kreslí arc);
// čtvercový plane pod kachničkou vypadal jako přilepená cedulka
const geoDisk = new THREE.CircleGeometry(0.5, 28);
const kachny = [];
for(let i=0;i<KACHEN_MAX;i++){
  const skup = new THREE.Group();
  // HLOUBKA Z VRSTEV. Kachnička je pořád plochý sprite, ale je jich na sobě
  // pět s odstupem — jako vyřezaná překližka, což je přesně to, co na pouťové
  // střelnici stojí. Zadní vrstvy jsou tmavší, takže z boku vypadají jako
  // stín tloušťky. Skutečný 3D model by v cel-shadingu vedle lahví působil
  // cize a stejně ho nemáme.
  //
  // Vrstvy dávají smysl teprve dohromady s VYTOČENÍM: zepředu jsou schované
  // za sebou, po natočení o pár stupňů se z nich stane bok.
  const vrstvy = [];
  for(let v=0; v<KACH_VRSTEV; v++){
    const jas = 1 - v*(0.58/(KACH_VRSTEV-1));      // dopředu světlé, dozadu tmavé
    const m = new THREE.Mesh(GEO_BANDITA[0], new THREE.MeshBasicMaterial({
      map: texBandita, transparent: true, alphaTest: 0.35, side: THREE.DoubleSide,
      color: new THREE.Color(jas, jas, jas) }));
    m.scale.set(KACH_R*2*BANDIT_ZOOM, KACH_R*2*BANDIT_ZOOM, 1);
    m.position.set(0, KACH_STRED, -v*KACH_VRSTVA); // skupina má počátek u paty
    if(v === 0) m.castShadow = true;   // stín vrhá jen přední vrstva z pěti
    skup.add(m);
    vrstvy.push(m);
  }
  const telo = vrstvy[0];
  // terč sedí na TĚLE, ne na hlavě — bandita se dívá doleva, tělo je vpravo dole
  const TX = TERC_X, TY = KACH_STRED + TERC_Y;
  // TERČ JE SAMOSTATNÝ OBJEKT NALEPENÝ NA KACHNIČCE, ne kresba na těle —
  // proto má vlastní skupinu. Ta se dá zmenšovat nezávisle na kachničce, což
  // je potřeba při zhynutí (nejdřív se smrskne terč, teprve pak kachnička).
  //
  // Odstup terčíku od těla musí přebít VYTOČENÍ. Terčík sedí 16 jednotek od
  // osy, takže ho natočení o 17° posune v hloubce o 16·sin17° ≈ 4,7 — se
  // starými 3 jednotkami se u vytočených kachniček zanořil za tělo a zmizel.
  // 14 je s rezervou nad tím a zároveň to čte jako terč přišroubovaný na tělo.
  const tercSkup = new THREE.Group();
  tercSkup.position.set(TX, TY, 0);
  // Vlastní tloušťka, stejným receptem jako tělo kachničky: kopie za sebou,
  // dozadu tmavší. Bez ní byl terč papírový, zatímco kachnička pod ním měla
  // pět vrstev — a to je právě vidět, když se kachnička natočí.
  const tercVrstvy = [];
  for(let v=0; v<TERC_VRSTEV; v++){
    const jas = 1 - v*(0.55/(TERC_VRSTEV - 1));
    const m = new THREE.Mesh(geoDisk, new THREE.MeshBasicMaterial({
      map: texTercik, transparent: true, depthWrite: false, side: THREE.DoubleSide,
      color: new THREE.Color(jas, jas, jas) }));
    m.scale.set(KACH_R*0.80, KACH_R*0.80, 1);
    m.position.z = 14 - v*TERC_VRSTVA;
    tercSkup.add(m);
    tercVrstvy.push(m);
  }
  const tercik = tercVrstvy[0];
  // prstenec plnění obíhá TĚSNĚ KOLEM terčíku, ať mu nepřekrývá kruhy
  const matPrst = novyPrstenec();
  const prstenec = new THREE.Mesh(geoPlane, matPrst);
  prstenec.scale.set(KACH_R*1.04, KACH_R*1.04, 1);
  prstenec.position.set(0, 0, 15.5);
  tercSkup.add(prstenec);
  skup.add(tercSkup);
  skup.visible = false;
  scene.add(skup);
  kachny.push({ skup, telo, vrstvy, tercik, tercSkup, tercVrstvy, prstenec, matPrst, stred: KACH_STRED,
                stav:'volna', t:0, ttl:0,
                naplneno:0, potreba:1, hodnota:10, patro:0, odZasahu:9, vytoceni:0,
                zaklX:0, zaklY:0, mince:0 });
}

// ---- rytmus střelnice -----------------------------------------------------
// Původně: nová každých 0,7–1,8 s, život 2,8–4,6 s pro všechny stejně. Bylo
// to moc rychlé a hlavně nespravedlivé — kachnička za 30 spolkne trojnásobek
// vody než ta za 10, ale času měla stejně. Čtyři pravidla, která to řeší:
//
//   1. ŽIVOT PODLE CENY. Dražší terč musí mít čas, který si zaslouží.
//   2. ODPOČET SE ZASTAVÍ, KDYŽ DO NÍ TEČE. Ztratit kachničku na 90 % naplnění
//      jen proto, že vypršel čas, je frustrace, ne obtížnost. Kdo ji drží,
//      ten ji dostane.
//   3. ODCHOD SE OHLÁSÍ. Poslední 0,9 s kachnička viditelně cuká — nic nesmí
//      zmizet dřív, než na to hráč stihne zareagovat.
//   4. VŽDYCKY JE NA CO STŘÍLET. Pod dva terče na scéně se dosypává hned,
//      nad čtyři se nespawnuje vůbec.
const ZIVOT_KACHNY = [3.8, 5.0, 6.4];    // podle patra, tedy podle hodnoty 10/20/30
const VAROVANI = 0.9;                    // jak dlouho předem se ohlásí odchod
const PAUZA_PO_ZASAHU = 0.6;             // do téhle doby od zásahu odpočet stojí
const KACHEN_MIN = 2, KACHEN_NA_SCENE = 4;

// Kachničky se rodí jen v pásu, který se vejde na TELEFON. Police jsou široké
// ±620, jenže na svislém displeji je v hloubce terčů vidět jen zlomek — na
// širokém monitoru by se kachničky rodily i tam, kde je hráč na mobilu nikdy
// neuvidí. Pás se počítá ze zorného úhlu a poměru stran telefonu, ne z pevného
// čísla, aby seděl i po případné změně kamery.
// 0,45 = 20:9, tedy ten NEJUŽŠÍ z běžných telefonů. Musí se brát nejužší, ne
// průměrný: staré 9:16 (0,5625) je nejširší a při něm by na 20:9 kachnička
// u kraje vyčuhovala o 6 jednotek (naměřeno). Kdo má širší displej, uvidí
// kachničky jen blíž ke středu, a to nevadí.
const TELEFON_POMER = 0.45;
function pasKachen(){
  const hloubka = camera.position.z - KACH_Z;
  const svisle = Math.tan(camera.fov*Math.PI/360) * hloubka;
  return Math.max(140, svisle*TELEFON_POMER - KACH_R*BANDIT_ZOOM);
}

// ---- postup barem ---------------------------------------------------------
// Vyčistíš patro → bar sjede o sekci dolů a nad tebou se odkryje další část
// s jinak rozestavěnými lahvemi. Sekce, která zajela pod podlahu, se rovnou
// přestaví a čeká nahoře; tím je bar nekonečný ze dvou kusů.
// Patro má PEVNÝ POČET kachniček a je hotové, teprve když padnou všechny.
// `zbyva` klesá JEN sestřelem — kachnička, které vypršel čas, se zasune a
// vrátí se jinde, protože pořád patří do téhle várky.
//
// Na scéně nesmí být víc kachniček, než kolik jich zbývá. Bez toho by se dalo
// patro „dočistit" sestřelem jedné ze tří zobrazených a zbylé dvě by zmizely
// samy — to je matoucí i nespravedlivé.
const KVOTA_ZAKLAD = 4;
// Přejezd byl 1,4 s a působil jako výtah. Zkrácený na 0,55 s a s OSTŘEJŠÍM
// easingem: smootherstep u³(6u²−15u+10) místo smoothstepu. Má pořád nulovou
// rychlost i zrychlení na obou koncích (žádné trhnutí), ale uprostřed je
// špička 1,875 místo 1,5 — dohromady s kratším časem je vrchol rychlosti
// 2,1 krát vyšší než dřív.
const PRECHOD_T = 0.62;
// KVINTICKÝ easing. Čím vyšší mocnina, tím DÉLE se drží u kraje (natažený
// rozjezd i dojezd) a tím ostřejší je střed. Šli jsme smoothstep (1,5) →
// smootherstep (1,875) → kvartický (4) → teď kvintický, špička 5.
// Prodloužení na 0,62 s je záměrné: delší čas jde celý do konců, protože
// střed je s vyšší mocninou rychlejší, ne pomalejší.
const easing = u => u < 0.5 ? 16*u**5 : 1 - 16*(1-u)**5;
const EASING_VRCHOL = 5;
const HLASKA_T = 1.2;                // jak dlouho svítí „Floor cleared!"
const BLUR_MAX = 22;                 // svislá odchylka rozmazání při plné rychlosti
const rozmazG = document.getElementById('rozmazG');
// Otřes po dojezdu: kamera přejezd „dobrzdí" a chvíli se uklidňuje. Tlumená
// sinusovka — amplituda, kmitočet a útlum. Záměrně malé, má to být detail,
// který si člověk uvědomí, až když ho vypneš.
const OTRES_A = 13, OTRES_W = 24, OTRES_TLUM = 8;
let otresT = -1;                     // < 0 = neběží
let otresY = 0;                      // aktuální výchylka, čte ji rozmazání

// ROZMAZÁNÍ SE ŘÍDÍ SKUTEČNOU RYCHLOSTÍ OBRAZU, ne vzorcem easingu. Dřív se
// počítalo z derivace, což platí jen pro přejezd; teď se bere, o kolik se
// scéna svisle pohnula za snímek — takže „rychleji = víc rozmazané" platí
// doslova a chytne to i dobrzdění kamery, které se tím lehce rozmaže samo.
const REF_RYCHLOST = SEKCE_V*EASING_VRCHOL/PRECHOD_T;   // rychlost ve vrcholu přejezdu
let vertMinuly = 0;
function krokRozmazani(dt){
  // posun scény dolů i posun kamery nahoru dělají na obrazovce totéž
  const vert = posun - otresY;
  const v = dt > 0 ? Math.abs(vert - vertMinuly)/dt : 0;
  vertMinuly = vert;
  const sd = BLUR_MAX * Math.min(1, v/REF_RYCHLOST);
  const cil = sd < 0.15 ? 'none' : 'url(#rozmaz)';
  if(sd >= 0.15) rozmazG.setAttribute('stdDeviation', '0 ' + sd.toFixed(2));
  // filtr se odpojuje úplně — i „nulový" SVG filtr stojí průchod GPU
  if(renderer.domElement.style.filter !== cil) renderer.domElement.style.filter = cil;
}
let patro = 1, zbyva = 0, prechod = 0, posun = 0, posunMinuly = 0, hlaska = 0;
const patroEl = document.getElementById('patroRoh');
const hlaskaEl = document.getElementById('hlaska');
function hraciSekce(){ return sekce.find(s => s.slot === 0); }
function kvota(){ return KVOTA_ZAKLAD + Math.min(4, patro - 1); }
function ukazPatro(){
  // anglicky, ať to ladí s „Floor cleared!"
  if(patroEl) nastavTitulek(patroEl, 'floor ' + patro + ' · ' + zbyva + ' left');
}
zbyva = kvota(); ukazPatro(); nastavPodlahu();

// Vyčištěno → nejdřív hláška, teprve po ní se bar hne. Posunout se ve stejném
// snímku, ve kterém padla poslední kachnička, znamená, že hráč nestihne
// zaregistrovat, že něco dokázal.
function patroVycisteno(){
  hlaska = HLASKA_T;
  if(hlaskaEl){ nastavTitulek(hlaskaEl, 'Floor cleared!'); hlaskaEl.classList.add('vidno'); }
}

function spustPrechod(){
  prechod = PRECHOD_T; posunMinuly = 0;
  if(hlaskaEl) hlaskaEl.classList.remove('vidno');
  // pojistka: se stropem podle `zbyva` už tu nikdo stát nemá, ale kdyby ano,
  // ať neodjede na polici pryč ze scény
  for(const k of kachny) if(k.stav === 'zije' || k.stav === 'najizdi'){ k.stav = 'mizi'; k.t = 0; }
  // Fleky se tu ZÁMĚRNĚ NEMAŽOU. Sjedou dolů spolu s barem (viz krokPostupu)
  // a setřou se až na konci přejezdu, kdy se sekce přeřadí a nové patro má
  // být čisté. Mazání na začátku vypadalo tak, že mokro zmizí vteřinu předtím,
  // než se scéna vůbec hne.
}

function krokPostupu(dt){
  // fáze 1: hláška. Bar zatím stojí, hráč si stihne přečíst, že je hotovo.
  if(hlaska > 0){
    hlaska -= dt;
    if(hlaska <= 0){ hlaska = 0; spustPrechod(); }
    return;
  }
  if(prechod <= 0) return;
  prechod -= dt;
  const u = Math.min(1, 1 - prechod/PRECHOD_T);
  posun = -SEKCE_V * easing(u);
  for(const s of sekce) nastavSekci(s, s.slot*SEKCE_V + posun);
  nastavSekci(podpatri, posun);          // police pod hrací sekcí jedou taky
  // Podlaha odjíždí spolu s barem, ne že by zmizela skokem. Týká se to jen
  // prvního stoupání — od druhého patra už žádná není.
  if(maPodlahu) posunPodlahu(posun);
  // Lahve jedou SE SVOU SEKCÍ. Posouvám je o rozdíl, ne na pevnou pozici —
  // tím si zachovají i to, jak zrovna leží nebo se kutálejí.
  const dY = posun - posunMinuly;
  posunMinuly = posun;
  for(const L of lahve){
    if(L.mrtva > 0) continue;
    L.telo.position.y += dY;
    L.telo.velocity.setZero(); L.telo.angularVelocity.setZero();
  }
  // Mokré fleky i odkapávající police jedou s nábytkem. Jsou na něm nalepené,
  // takže se musí posouvat úplně stejně jako on — jinak by po nich scéna
  // „projela".
  for(const f of fleky) if(f.ziva) f.y += dY;
  for(const k of kapace) if(k.ziva) k.y += dY;
  if(prechod <= 0){
    prechod = 0; posun = 0;
    // `posun` se vrací z −620 na 0, ale scéna se nepohnula — sekce se jen
    // přeřadily. Bez tohohle vidí výpočet rychlosti skok o celou sekci
    // a na jeden snímek vystřelí rozmazání na maximum (naměřeno 25 726/s).
    vertMinuly = posun - otresY;
    // Sekce se posunou o jeden slot dolů a ta, co byla dole, obchází nahoru
    // na konec fronty. Se třemi sekcemi to musí být cyklus, ne prohození.
    const dole = hraciSekce();
    for(const s of sekce) s.slot = (s.slot + sekce.length - 1) % sekce.length;
    for(const s of sekce) nastavSekci(s, s.slot*SEKCE_V);
    nastavSekci(podpatri, 0);            // podpatří zpátky pod novou hrací sekci
    prestavLahve(dole);                  // odjetá sekce se přestaví a čeká nahoře
    patro++; zbyva = kvota(); ukazPatro();
    otresT = 0;                                  // kamera teď dobrzdí
    nastavPodlahu();                             // nad přízemím už podlaha není
    // Setřít PODRUHÉ, na konci přejezdu. Smazání na začátku samo nestačí:
    // hráč drží proud i během jízdy, takže mezitím vzniknou nové fleky —
    // a protože leží v pevných světových souřadnicích, zatímco bar pod nimi
    // sjede o celou sekci, vynoří se v novém patře jako „ty staré".
    smazFleky();
    for(const k of kapace) k.ziva = false;   // odkapávání patří k odjetému patru
  }
}

let kachTimer = 1.0;
function zivych(){
  let n = 0;
  for(const k of kachny) if(k.stav === 'najizdi' || k.stav === 'zije') n++;
  return n;
}
// ---- aby kachnička nezmizela za lahvemi -------------------------------------
// Kachničky stojí O 40 DÁL než lahve (KACH_Z = POLICE_Z - 40), takže je lahve
// zakrývají. Jedna lahev je proti kachničce úzká (poloměr 25 proti 62), jenže
// lahve stojí ve skupinkách po dvou třech a taková skupinka schová celou
// kachničku i s hlavou. Být ZA sklem je v pořádku a vypadá to dobře — zmizet
// za ním celá ne.
//
// Silueta se musí počítat v PERSPEKTIVĚ, ne porovnáním x: lahev je blíž ke
// kameře, takže na obrazovce zabírá víc a je posunutá dál od středu, než jaké
// má x. Přepočet je podíl vzdáleností od kamery — lahev se tím promítne do
// roviny kachniček a od té chvíle se dá měřit obyčejným rozdílem.
const LAHVI_MAX = 48;
const _lahvX = new Float32Array(LAHVI_MAX);
const _lahvR = new Float32Array(LAHVI_MAX);
let _lahvN = 0;
// Kolik kachničky musí zůstat souvisle nezakryté. 0,55 poloměru = 34 jednotek,
// což je zhruba hlava s kloboukem nebo napřažená pistole.
const VYKUK_MIN = KACH_R*0.55;

function siluetyLahvi(patroK){
  _lahvN = 0;
  const sek = hraciSekce();
  const dKach = KAM_ZAKLAD.z - KACH_Z;
  const podlazi = sek.zaklY + POLICE_Y[patroK];
  // Zakrývá jen to, co dosáhne KE HLAVĚ. Sklenice je vysoká 52 proti
  // kachniččiným 151, takže jí zakryje břicho a hlava kouká přes ni — to je
  // v pořádku a je to přesně ten pohled, o který jde. Kdyby se počítala jako
  // překážka, vytlačila by kachničku z okna, ve kterém stojí.
  const hlavaY = podlazi + KACH_VYSKA*0.52;
  for(const L of sek.lahve){
    if(L.police !== patroK || L.mrtva > 0 || _lahvN >= LAHVI_MAX) continue;
    if(podlazi + L.typ.h < hlavaY) continue;
    const p = L.telo.position;
    // Ležící a spadlá lahev nezakrývá — leží pod úrovní, kde má kachnička tělo.
    if(p.y < podlazi + L.typ.h*0.35) continue;
    const d = KAM_ZAKLAD.z - p.z;
    if(d <= 1) continue;
    const mer = dKach/d;
    _lahvX[_lahvN] = p.x*mer;
    _lahvR[_lahvN] = L.typ.w*mer;
    _lahvN++;
  }
}

// Největší SOUVISLÝ nezakrytý pruh siluety kachničky. Souvislý je tu podstatné:
// dva pruhy po pěti jednotkách vlevo a vpravo dají dohromady stejné číslo jako
// jeden desetijednotkový, ale vypadají jako kachnička rozřezaná na plátky.
// Počítá se navzorkováním, ne slučováním intervalů — 24 vzorků krát pár lahví
// je pár set porovnání, zato bez řazení a bez alokace.
function vykukKachny(x){
  const R = KACH_R*0.9, KROK = R*2/24;
  let nej = 0, bezi = 0;
  for(let i=0;i<24;i++){
    const px = x - R + KROK*(i + 0.5);
    let kryto = false;
    for(let j=0;j<_lahvN;j++){
      if(Math.abs(px - _lahvX[j]) < _lahvR[j]){ kryto = true; break; }
    }
    if(kryto) bezi = 0;
    else { bezi += KROK; if(bezi > nej) nej = bezi; }
  }
  return nej;
}

// Předalokovaný seznam vyhovujících míst — losuje se z něj až nakonec.
const _vhodne = new Float32Array(32);
let vhodnychN = 0;

// Nesmí vzniknout přes jinou kachničku — hráč pak neví, do které stříká.
function volnoOdKachen(x, patro){
  for(const k of kachny){
    if(k.stav === 'volna' || k.patro !== patro) continue;
    if(Math.abs(k.skup.position.x - x) < KACH_R*2.3) return false;
  }
  return true;
}

function najdiMisto(patro){
  const pas = pasKachen();
  siluetyLahvi(patro);
  // PROČ NE NÁHODNÉ POKUSY. Dřív se losovalo čtrnáct x a bral se první volný.
  // Jenže mezera mezi skupinkami lahví je proti celému pásu úzká, takže se do
  // ní čtrnáct losů netrefilo a kachnička skončila za sklem i tam, kde vedle
  // bylo prázdno — naměřeno 74 % míst pod prahem výkuku na plné polici.
  // Místa se proto PROJEDOU po řadě a teprve mezi vyhovujícími se losuje, aby
  // se kachničky pořád neobjevovaly na stejném místě.
  const KROKU = 32;
  let nejX = null, nejVykuk = -1;
  vhodnychN = 0;
  for(let i=0;i<KROKU;i++){
    const x = -pas + (2*pas)*(i + 0.5)/KROKU + rand(-6, 6);
    if(!volnoOdKachen(x, patro)) continue;
    const v = vykukKachny(x);
    if(v >= VYKUK_MIN){ if(vhodnychN < KROKU) _vhodne[vhodnychN++] = x; }
    else if(v > nejVykuk){ nejVykuk = v; nejX = x; }
  }
  // Když nevyhovuje ani jedno místo, pořád je lepší postavit kachničku tam,
  // kde je z ní vidět nejvíc, než ji nepostavit vůbec (dřív se vracelo null).
  if(vhodnychN > 0) return _vhodne[(Math.random()*vhodnychN)|0];
  return nejX;
}

function pustKachnu(){
  const k = kachny.find(k => k.stav === 'volna');
  if(!k) return;
  // Patro s nejmenším počtem kachniček — jinak se jich pár sesype do jednoho
  // a zbytek střelnice zeje prázdnotou.
  const obsazeno = POLICE_Y.map(() => 0);
  for(const j of kachny) if(j.stav === 'najizdi' || j.stav === 'zije') obsazeno[j.patro]++;
  const min = Math.min(...obsazeno);
  const volna = obsazeno.map((n,i)=>[n,i]).filter(p=>p[0]===min).map(p=>p[1]);
  // `patroK` = police v sekci (0–2). Nezaměňovat s `patro`, což je pořadí
  // patra baru, ve kterém se hraje.
  const patroK = volna[(Math.random()*volna.length)|0];
  const x = najdiMisto(patroK);
  if(x === null) return;
  k.patro = patroK;
  k.hodnota = HODNOTY[patroK];
  // Kolik vody kachnička spolkne, roste s hodnotou — dražší terč stojí víc
  // času, stejně jako ve 2D (duckHpNeeded). Násobek šel z 12 přes 9 na 6:
  // do kachničky se muselo vypálit tolik vody, že to přestalo být střílení
  // a začalo být polévání.
  k.potreba = k.hodnota * 6;
  // MINCE V KACHNIČCE. Jen některá je má, jinak by z toho byl stálý proud
  // mincí a doletu by si nikdo nevšiml. Kolik jich nese, roste s patrem,
  // takže dražší kachnička je i bohatší.
  k.mince = Math.random() < 0.4 ? 1 + ((Math.random()*(patroK + 2))|0) : 0;
  k.naplneno = 0;
  k.odZasahu = 9;
  k.stav = 'najizdi'; k.t = 0; k.ttl = ZIVOT_KACHNY[patroK] * rand(0.9, 1.15);
  // jeden ze čtyř banditů — všechny vrstvy musí dostat tutéž variantu
  const vi = (Math.random()*BANDITU)|0;
  const geo = GEO_BANDITA[vi];
  // …a spolu s ní i vlastní výšku, aby kachnička stála na desce a nelevitovala
  k.stred = KACH_POSAZENI[vi];
  for(const v of k.vrstvy){ v.geometry = geo; v.material.opacity = 1; v.position.y = k.stred; }
  // terč sedí na těle, takže se veze s výškou posazení dané varianty
  k.tercSkup.position.y = k.stred + TERC_Y;
  k.tercSkup.scale.setScalar(1);
  // vytočení na náhodnou stranu: teprve tím je vrstvení vidět
  k.vytoceni = (Math.random() < 0.5 ? -1 : 1) * KACH_VYTOCENI * rand(0.55, 1);
  k.matPrst.uniforms.postup.value = 0;
  k.matPrst.uniforms.barva.value.setHex(0x5ad1ff);
  // Počátek skupiny = pata kachničky, tedy přesně horní plocha desky police
  // TÉ SEKCE, ve které se zrovna hraje.
  // zaklX/zaklY = místo, na kterém kachnička stojí. Drží se stranou, protože
  // chvění pod proudem hýbe `position.x` a zhynutí `position.y` — obojí se
  // musí mít kam vrátit.
  k.zaklX = x;
  k.zaklY = hraciSekce().zaklY + POLICE_Y[patroK];
  k.skup.position.set(k.zaklX, k.zaklY, KACH_Z);
  smazFlekyUKachny(k.zaklX, k.zaklY + k.stred);   // nesmí stát v mokrém fleku
  k.skup.rotation.set(0, k.vytoceni, 0);
  k.skup.scale.set(0.01, 0.01, 1);
  k.skup.visible = true;
}

// CITOSLOVCE. Zvuk hra nemá, takže tohle je jediné, čím kachnička promluví.
// Šance je nízká schválně: při šesti kachničkách na patro by z každé druhé
// hlášky byl rámus a přestala by být vtipná.
const CITOSLOVCE_SANCE = 0.35;
// Anglicky, ať to ladí s „Floor cleared!" a „floor 1 · 3 left", a
// westernovým slangem — bandita v klobouku má mluvit jako bandita.
// Krátce: jedno až dvě slova. Delší hláška se v půl vteřině nepřečte
// a musela by se zmenšit natolik, že by zanikla.
const KVAKY = ['Quack!', 'Tarnation!', 'Dagnabbit!', 'Hot dang!',
               'Aw, shoot!', 'Yee-ouch!', 'Much obliged!'];
const SMICH = ['Yeehaw!', 'Too slow!', 'Nice try!', 'Adios!',
               'So long!', 'Haw haw!', 'Ha ha ha!'];

function krokKachen(dt){
  const n = zivych();
  kachTimer -= dt;
  // Během hlášky ani přejezdu se nespawnuje — kachnička by vyjela na polici,
  // která se zrovna sune pryč.
  //
  // STROP JE `zbyva`: na scéně nikdy není víc kachniček, než kolik jich do
  // vyčištění patra chybí. Když zbývá poslední, svítí právě jedna a její
  // sestřel patro opravdu uzavře.
  if(prechod <= 0 && hlaska <= 0){
    const strop = Math.min(KACHEN_NA_SCENE, zbyva);
    // pod minimem se dosypává skoro hned, nad strop se nespawnuje vůbec
    if(kachTimer <= 0 && n < strop){
      pustKachnu();
      kachTimer = rand(1.2, 2.4);
    }
    if(n < Math.min(KACHEN_MIN, strop) && kachTimer > 0.35) kachTimer = 0.35;
  }

  for(const k of kachny){
    if(k.stav === 'volna') continue;
    k.t += dt;
    k.odZasahu += dt;
    const s = k.skup.scale;
    if(k.stav === 'najizdi'){
      // stretch: vyskočí přes cíl a zase se srovná
      const u = Math.min(1, k.t/NAJEZD);
      const p = 1 + 0.22*Math.sin(u*Math.PI);
      s.set(1/p, p, 1);
      if(u >= 1){ s.set(1,1,1); k.stav = 'zije'; k.t = 0; }
    } else if(k.stav === 'zije'){
      // Odpočet stojí, dokud do kachničky teče. Kdo ji drží, ten ji dostane.
      if(k.odZasahu > PAUZA_PO_ZASAHU) k.ttl -= dt;
      k.matPrst.uniforms.postup.value = k.naplneno/k.potreba;
      if(k.ttl <= VAROVANI){
        // ohlášený odchod: rychlé cukání, aby si toho hráč všiml
        const c = 1 + 0.09*Math.sin(k.t*26);
        s.set(1/c, c, 1);
        k.skup.rotation.z = 0.06*Math.sin(k.t*22);
      } else {
        // dýchání, ať terč nestojí jako přibitý
        const d = 1 + 0.02*Math.sin(k.t*3.1);
        s.set(1/d, d, 1);
        k.skup.rotation.z = 0;
      }
      // CHVĚNÍ POD PROUDEM. Žádné natahování ani poskakování — to patří až
      // ke zhynutí. Tryska do kachničky tluče, takže se jen rozdrncá: rychlý
      // kmit v měřítku, náklonu i do stran, všechno v řádu jednotek procent
      // a pixelů. Amplituda se drží podle času OD POSLEDNÍHO ZÁSAHU, takže
      // chvění trvá, dokud proud drží, a po odtržení do dvou desetin utichne.
      const w = Math.exp(-k.odZasahu*ZASAH_UTLUM);
      if(w > 0.01){
        const f = k.t*ZASAH_CHVENI_W;
        const c = 1 + ZASAH_CHVENI_S*w*Math.sin(f);
        s.set(s.x/c, s.y*c, 1);
        // náklon se PŘIČÍTÁ, ať se nepere s cukáním ohlášeného odchodu
        k.skup.rotation.z += ZASAH_CHVENI_R*w*Math.sin(f*0.83);
        k.skup.position.x = k.zaklX + ZASAH_CHVENI_X*w*Math.sin(f*1.17);
      } else if(k.skup.position.x !== k.zaklX){
        k.skup.position.x = k.zaklX;
      }
      if(k.ttl <= 0){
        k.stav = 'mizi'; k.t = 0; k.skup.rotation.z = 0;
        // Kachnička, která hráči utekla, se mu ještě vysměje. Jen občas —
        // kdyby to udělala pokaždé, je z toho tik, ne vtip.
        if(Math.random() < CITOSLOVCE_SANCE)
          pustNapis(k.skup.position.x, k.skup.position.y + k.stred + KACH_R*0.9,
                    k.skup.position.z, SMICH[(Math.random()*SMICH.length)|0], 'komiks');
      }
    } else if(k.stav === 'mizi'){
      // netrefená kachnička se jen scvrkne a zmizí — bez peří a bez bodů
      k.skup.position.set(k.zaklX, k.zaklY, KACH_Z);   // srovnat po chvění
      const u = Math.min(1, k.t/ODJEZD);
      s.set(1 - u, 1 - u, 1);
      if(u >= 1){ k.stav = 'volna'; k.skup.visible = false; }
    } else if(k.stav === 'umira'){
      // SQUASH AND STRETCH. Nejdřív se kachnička lekne a vytáhne vzhůru
      // i s povyskočením, teprve pak plácne do široka a zmizí. Samotné
      // plácnutí bylo jen půlka pohybu a působilo, že splaskla — nádech
      // před ním je to, co z toho dělá ránu.
      k.skup.position.x = k.zaklX;      // srovnat po chvění pod proudem
      // NEJDŘÍV SE SMRSKNE TERČ, teprve pak kachnička. Terč je samostatný
      // objekt nalepený na kachničce, takže má vlastní měřítko a může zmizet
      // dřív — čte se to jako „sestřelen terč, a proto padá kachnička",
      // kdežto když mizelo obojí naráz, byla to jedna beztvará šmouha.
      const uc = Math.min(1, k.t/UMIRANI_CELEK);
      const tc = Math.min(1, uc/TERC_MIZI);
      k.tercSkup.scale.setScalar(Math.max(0.001, 1 - tc*tc));
      // dokud mizí terč, kachnička jen stojí a čeká
      if(uc < TERC_MIZI){ k.skup.position.y = k.zaklY; continue; }
      const u = (uc - TERC_MIZI)/(1 - TERC_MIZI);
      const SY = 1.42, SX = 1/SY;       // vrchol natažení
      if(u < UMIRANI_NATAH){
        const a = Math.sin((u/UMIRANI_NATAH)*Math.PI*0.5);   // rychle nahoru, měkce doraz
        s.set(1 + (SX - 1)*a, 1 + (SY - 1)*a, 1);
        k.skup.position.y = k.zaklY + UMIRANI_VYSKA*a;
      } else {
        // Navazuje se PŘESNĚ na hodnoty z vrcholu natažení, ne od jedničky —
        // jinak by měřítko v půlce animace poskočilo.
        const a = (u - UMIRANI_NATAH)/(1 - UMIRANI_NATAH);
        s.set(SX + (2.1 - SX)*a, Math.max(0.02, SY + (0.02 - SY)*a), 1);
        k.skup.position.y = k.zaklY + UMIRANI_VYSKA*(1 - a)*(1 - a);
      }
      for(const v of k.vrstvy) v.material.opacity = 1 - u;   // mizí celá tloušťka
      if(uc >= 1){
        k.stav = 'volna'; k.skup.visible = false;
        for(const v of k.vrstvy) v.material.opacity = 1;
        k.tercSkup.scale.setScalar(1);      // připravit pro další nasazení
      }
    }
  }
}

// Zásah uzlem proudu. Střed terče plní rychleji než tělo — přesně to je důvod,
// proč terč na těle je: odměnit míření, ne polévání.
function zasahKachny(k, u){
  // vytočená kachnička má terč blíž ke středu — o kosinus natočení
  const dx = u.p.x - (k.skup.position.x + TERC_X*Math.cos(k.vytoceni));
  const dy = u.p.y - (k.skup.position.y + k.stred + TERC_Y);
  const stred = Math.hypot(dx, dy) < KACH_R*KACH_TERC;
  k.naplneno += stred ? 2.5 : 1;
  k.odZasahu = 0;                  // dokud teče, odpočet do odchodu stojí
  _nor.set(0, 0, 1);
  _bod.set(u.p.x, u.p.y, k.skup.position.z + 6);
  rozprsk(_bod, _nor, u.v, stred ? 4 : 2);
  // Bar zůstává MODRÝ i po trefě do středu. Přebarvoval se na zlatooranžovou
  // (převzato z 2D badge), jenže tady je to ukazatel NAVODĚNÉ VODY — a voda
  // je modrá. Oranžová k ní neseděla a pletla se s terčíkem.
  if(stred) k.matPrst.uniforms.barva.value.setHex(0x9fe6ff);   // jen světlejší odstín
  if(k.naplneno >= k.potreba && k.stav === 'zije'){
    k.stav = 'umira'; k.t = 0;
    k.matPrst.uniforms.postup.value = 1;
    pripisSkore(k.hodnota);
    letMinci(k.mince, k.skup.position.x, k.skup.position.y + k.stred, k.skup.position.z);
    pustPeri(k.skup.position.x, k.skup.position.y + k.stred, k.skup.position.z, 18);
    pustPopup(k.skup.position.x, k.skup.position.y + k.stred + KACH_R*0.9,
              k.skup.position.z, k.hodnota);
    // Kváknutí letí VEDLE „+N", ne přes něj — jinak se dva nápisy překrývají
    // a nepřečte se ani jeden.
    if(Math.random() < CITOSLOVCE_SANCE)
      pustNapis(k.skup.position.x + (Math.random() < 0.5 ? -1 : 1)*KACH_R*1.15,
                k.skup.position.y + k.stred + KACH_R*0.35,
                k.skup.position.z, KVAKY[(Math.random()*KVAKY.length)|0], 'komiks');
    // `zbyva` klesá JEN sestřelem; zasunutá kachnička se vrátí jinde
    zbyva = Math.max(0, zbyva - 1);
    ukazPatro();
    if(zbyva === 0 && prechod <= 0 && hlaska <= 0) patroVycisteno();
  }
}

function narazDoKachny(p){
  for(const k of kachny){
    if(k.stav !== 'zije' && k.stav !== 'najizdi') continue;
    if(Math.abs(p.z - k.skup.position.z) > 40) continue;
    const dx = p.x - k.skup.position.x;
    const dy = p.y - (k.skup.position.y + k.stred);      // počátek je u paty
    if(dx*dx + dy*dy < KACH_R*KACH_R*0.62) return k;
  }
  return null;
}

// ---- peří -----------------------------------------------------------------
// Jeden Points s vlastním shaderem, protože pírko se musí OTÁČET — a to
// PointsMaterial neumí. Rotace se dělá v fragmentu otočením gl_PointCoord,
// takže je to pořád jeden draw call.
function texturaPirka(){
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const g = c.getContext('2d');
  g.fillStyle = '#fff';
  g.beginPath(); g.ellipse(16, 16, 5.5, 13, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = 'rgba(0,0,0,0.18)';
  g.fillRect(15, 4, 2, 24);
  const t = new THREE.CanvasTexture(c);
  t.generateMipmaps = false; t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter;
  return t;
}
const texPirko = texturaPirka();
const PERI_MAX = 140;
const periPos = new Float32Array(PERI_MAX*3);
const periVel = new Float32Array(PERI_MAX);
const periUhel = new Float32Array(PERI_MAX);
const periBarva = new Float32Array(PERI_MAX*3);
const periKryti = new Float32Array(PERI_MAX);
const peri = [];
for(let i=0;i<PERI_MAX;i++) peri.push({ ziva:false, x:0,y:0,z:0, vx:0,vy:0,vz:0,
                                        uhel:0, uhelV:0, t:0, zivot:0, vel:0, r:1,g:1,b:1, seed:0 });
const periGeo = new THREE.BufferGeometry();
periGeo.setAttribute('position', new THREE.BufferAttribute(periPos, 3));
periGeo.setAttribute('velikost', new THREE.BufferAttribute(periVel, 1));
periGeo.setAttribute('uhel',     new THREE.BufferAttribute(periUhel, 1));
periGeo.setAttribute('barva',    new THREE.BufferAttribute(periBarva, 3));
periGeo.setAttribute('kryti',    new THREE.BufferAttribute(periKryti, 1));
const matPeri = new THREE.ShaderMaterial({
  uniforms: { mapa: { value: texPirko },
              mer: { value: innerHeight*0.5*Math.min(devicePixelRatio,2) } },
  transparent: true, depthWrite: false,
  vertexShader: `
    attribute float velikost; attribute float uhel; attribute vec3 barva; attribute float kryti;
    uniform float mer;
    varying float vUhel; varying vec3 vBarva; varying float vKryti;
    void main(){
      vUhel = uhel; vBarva = barva; vKryti = kryti;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = velikost * (mer / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform sampler2D mapa;
    varying float vUhel; varying vec3 vBarva; varying float vKryti;
    void main(){
      vec2 c = gl_PointCoord - 0.5;
      float s = sin(vUhel), co = cos(vUhel);
      vec2 r = vec2(c.x*co - c.y*s, c.x*s + c.y*co) + 0.5;
      vec4 t = texture2D(mapa, r);
      if(t.a * vKryti < 0.02) discard;
      gl_FragColor = vec4(t.rgb * vBarva, t.a * vKryti);
    }`,
});
const periMesh = new THREE.Points(periGeo, matPeri);
periMesh.frustumCulled = false;
scene.add(periMesh);

// tři tóny jako ve 2D: žlutá, oranžová, bílá
const TONY_PERI = [new THREE.Color(0xffd21f), new THREE.Color(0xff9c1a), new THREE.Color(0xfff6d5)];
