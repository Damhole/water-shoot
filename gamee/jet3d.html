function pustPeri(x, y, z, kolik){
  let dano = 0;
  for(const f of peri){
    if(dano >= kolik) break;
    if(f.ziva) continue;
    const a = rand(0, Math.PI*2), sp = rand(120, 380);
    f.ziva = true; f.t = 0; f.zivot = rand(1.1, 2.0);
    f.x = x + rand(-24,24); f.y = y + rand(-24,24); f.z = z + rand(-20,20);
    f.vx = Math.cos(a)*sp;
    f.vy = Math.abs(Math.sin(a))*sp*rand(0.6,1.4) + 180;   // nahoru
    f.vz = rand(-70,70);
    f.uhel = rand(0, Math.PI*2); f.uhelV = rand(-7, 7);
    f.vel = rand(26, 44);
    const t = TONY_PERI[(Math.random()*3)|0];
    f.r = t.r; f.g = t.g; f.b = t.b;
    f.seed = rand(0, Math.PI*2);
    dano++;
  }
}

function krokPeri(dt, cas){
  let n = 0;
  for(const f of peri){
    if(!f.ziva) continue;
    f.t += dt;
    if(f.t > f.zivot || f.y < podlahaY + 2){ f.ziva = false; continue; }
    // pírko padá pomalu a třepotá se — proto zlomek gravitace a silný odpor
    f.vy -= G*0.16*dt;
    const tlum = Math.exp(-2.2*dt);
    f.vx *= tlum; f.vz *= tlum; f.vy *= Math.exp(-1.1*dt);
    f.x += (f.vx + Math.sin(cas*7 + f.seed)*110)*dt;
    f.y += f.vy*dt; f.z += f.vz*dt;
    f.uhel += f.uhelV*dt;
    const u = f.t/f.zivot;
    periPos[n*3] = f.x; periPos[n*3+1] = f.y; periPos[n*3+2] = f.z;
    periVel[n] = f.vel; periUhel[n] = f.uhel;
    periBarva[n*3] = f.r; periBarva[n*3+1] = f.g; periBarva[n*3+2] = f.b;
    periKryti[n] = u < 0.7 ? 1 : (1-u)/0.3;
    n++;
  }
  periGeo.setDrawRange(0, n);
  for(const a of ['position','velikost','uhel','barva','kryti']) periGeo.attributes[a].needsUpdate = true;
  return n;
}

// ---- „+N" nad sestřelenou kachničkou --------------------------------------
const POPUPU = 5;
const popupy = [];
// Plátno 256×128 na sprite 150×75 světových jednotek: na telefonu vyjde
// popupek kolem 150 px, takže menší plátno by text změkčilo.
const POPUP_W = 256, POPUP_H = 128;
// Odměna má TOTÉŽ písmo i tutéž hloubku jako skóre — jinak by to byly dva
// různé fonty na jedné obrazovce. Canvas ale nezná CSS proměnné, takže se
// hodnoty opakují tady.
const POPUP_FONT = '400 76px "Lilita One", "Arial Rounded MT Bold", Arial, sans-serif';
const POPUP_HLOUBKA = 6;
// Font se musí načíst DŘÍV, než se první popupek nakreslí — canvas na
// document.fonts nečeká a tiše by vzal náhradní písmo.
if(document.fonts && document.fonts.load) document.fonts.load(POPUP_FONT.replace('400 ',''));

// DVA STYLY NA JEDNOM POOLU. Odměna „+N" je krémová s tmavou hloubkou jako
// skóre, kdežto citoslovce je komiksové: ČERNÉ písmo v bílém obrysu, nakřivo
// a lehce se viklá. Bublina k tomu není potřeba — bílý obrys ji nahradí
// a nezakryje kachničku pod sebou.
const STYLY = {
  skore:  { px:76, barva:'#fbf1dc', obrys:'#2c1a0d', obrysSir:9,  hloubka:6, mer:[130,65],
            stoupa:90, doba:1.1, kriv:0 },
  // Poloviční „+1" za trefenou lahev. Zmenšuje se MĚŘÍTKO SPRITU, ne písmo na
  // plátně: text se dál kreslí v 76 px a jen se zobrazí na polovině, takže je
  // po zmenšení ostřejší. Kdyby se místo toho zmenšilo písmo, plátno by
  // zůstalo velké a text by se na něm vykreslil hrubší.
  // Kratší let a menší stoupání k tomu patří — drobná odměna nemá plout přes
  // půlku obrazovky jako sestřel kachničky.
  skoreMale: { px:76, barva:'#fbf1dc', obrys:'#2c1a0d', obrysSir:9, hloubka:6, mer:[65,33],
            stoupa:45, doba:0.85, kriv:0 },
  komiks: { px:60, barva:'#000000', obrys:'#ffffff', obrysSir:9, hloubka:0, mer:[168,84],
            stoupa:52, doba:0.80, kriv:0.20 },
};
for(let i=0;i<POPUPU;i++){
  const c = document.createElement('canvas');
  c.width = POPUP_W; c.height = POPUP_H;
  const tex = new THREE.CanvasTexture(c);
  tex.generateMipmaps = false; tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sp.scale.set(130, 65, 1); sp.visible = false;
  scene.add(sp);
  popupy.push({ sp, c, tex, t: 0, ziva: false, y0: 0, x0: 0, s: null, kriv: 0, faze: 0 });
}

function pustNapis(x, y, z, text, stylJm){
  const s = STYLY[stylJm];
  for(const p of popupy){
    if(p.ziva) continue;
    const g = p.c.getContext('2d');
    const sx = POPUP_W/2, sy = POPUP_H/2 - 6;
    g.clearRect(0, 0, POPUP_W, POPUP_H);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineJoin = 'round';                       // bez toho trčí z rohů písmen ostny
    // „Ha ha ha!" je proti „+30" třikrát delší, takže se písmo musí zmenšit,
    // aby text nevyjel z plátna. Zjišťuje se to měřením, ne odhadem z počtu
    // znaků — Lilita One má hodně rozdílné šířky.
    let px = s.px;
    g.font = POPUP_FONT.replace('76px', px + 'px');
    const max = POPUP_W - 4*s.obrysSir;
    const w = g.measureText(text).width;
    if(w > max){ px = Math.max(28, Math.floor(px*max/w)); g.font = POPUP_FONT.replace('76px', px + 'px'); }
    if(s.hloubka){
      // tělo: tmavé a o kus tlustší, posunuté dolů — stejný recept jako v HUD
      g.lineWidth = s.obrysSir*1.8; g.strokeStyle = s.obrys;
      g.strokeText(text, sx, sy + s.hloubka);
      g.fillStyle = s.obrys;
      g.fillText(text, sx, sy + s.hloubka);
    }
    g.lineWidth = s.obrysSir; g.strokeStyle = s.obrys;
    g.strokeText(text, sx, sy);
    g.fillStyle = s.barva;
    g.fillText(text, sx, sy);
    p.tex.needsUpdate = true;
    p.sp.scale.set(s.mer[0], s.mer[1], 1);
    p.sp.position.set(x, y, z); p.y0 = y; p.x0 = x;
    p.s = s;
    // Náhodné naklonění a náhodná fáze viklání, ať dvě citoslovce vedle sebe
    // nekmitají svorně jako metronom.
    p.kriv = s.kriv ? (Math.random() < 0.5 ? -1 : 1)*s.kriv*rand(0.6, 1) : 0;
    p.faze = Math.random()*6.28;
    p.sp.material.rotation = p.kriv;
    p.sp.visible = true; p.ziva = true; p.t = 0;
    return;
  }
}
function pustPopup(x, y, z, body, styl){ pustNapis(x, y, z, '+' + body, styl || 'skore'); }

function krokPopupu(dt){
  for(const p of popupy){
    if(!p.ziva) continue;
    p.t += dt;
    const s = p.s;
    const u = p.t/s.doba;
    if(u >= 1){ p.ziva = false; p.sp.visible = false; continue; }
    p.sp.position.y = p.y0 + s.stoupa*u;
    p.sp.material.opacity = u < 0.6 ? 1 : (1-u)/0.4;
    // VIKLÁNÍ jen u komiksu. Kolébá se kolem svého náklonu a zároveň se
    // sotva znatelně houpe do stran — samotná rotace působí jako přilepený
    // obrázek, teprve s posunem to čte jako vykřiknuté slovo.
    // Rychleji a s menší výchylkou: s 13 rad/s a ±0,075 to bylo rozplizlé
    // kolébání, ne kmit. S 26 rad/s a ±0,038 stihne za kratší život dvakrát
    // tolik kmitů, a protože je výchylka poloviční, čte se to jako chvění,
    // ne jako houpačka.
    if(s.kriv){
      const f = p.faze + p.t*26;
      p.sp.material.rotation = p.kriv + Math.sin(f)*0.038;
      p.sp.position.x = p.x0 + Math.sin(f*0.8)*2.6;
    }
  }
}

// ---- smyčka ---------------------------------------------------------------
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
  // vlastní shader kapiček si měřítko pro sizeAttenuation nedopočítá sám
  matDrobne.uniforms.mer.value = h*0.5*Math.min(devicePixelRatio, 2);
  matFlek.uniforms.mer.value   = h*0.5*Math.min(devicePixelRatio, 2);
  matPeri.uniforms.mer.value  = h*0.5*Math.min(devicePixelRatio, 2);
}
addEventListener('resize', resize); resize();

let t0 = performance.now(), snimku = 0, fpsT = 0;
function smycka(now){
  requestAnimationFrame(smycka);
  const dt = Math.min((now - t0)/1000, 0.05); t0 = now;

  hlidejKonec();
  hlidejMaloVody();
  krokTmy(dt);
  krokKamery(dt);
  // Po konci hry scéna DOŽÍVÁ: voda dolétne, kapky dopadnou, kachničky
  // dostojí. Zamrznutý obraz působí jako pád hry, kdežto dozvuk jako konec.
  // Nepřibývá ale nic nového — patro se neposouvá, kachničky se nenasazují
  // a tryska nestříká.
  if(!konec){
    krokPostupu(dt);
    krokKachen(dt);
  }
  krokRozmazani(dt);
  krokProudu(dt, cil, !konec && (strika || cbAuto.checked));
  const kapekZivych = krokKapek(dt) + krokDrobnych(dt);
  krokPeri(dt, now/1000);
  krokPopupu(dt);
  krokKrouzku(dt);
  krokFleku(dt);
  krokKapacu(dt);
  krokKorunek(dt);
  krokLetMinci(dt);
  postavJet(now/1000);
  // Tok = posouvání textury po délce. Tohle je celý „pohyb vody".
  // U TubeGeometry jde 'u' PODÉL trubice a 'v' po obvodu. Vzor musí být tedy
  // opakovaný a posouvaný v ose U — pruh při konstantním u je kružnice kolem
  // obvodu, tedy prstenec kolmý na tok. Původně to bylo obráceně a pruhy běžely
  // podélně, což vypadalo jako pruhovaná hadice, ne jako tekoucí voda.
  // PULZ: v textuře je JEDEN výrazný bílý shluk a opakuje se jen 1,4× na délku
  // proudu, takže projde celou délkou a chvíli není — voda tím „pulzuje" v rytmu
  // místo aby po ní jelo souvislé pruhování. Rychlost je vztažená k délce
  // proudu, ne k času, aby rytmus zůstal stejný při krátkém i dlouhém doletu.
  texVoda.offset.x -= dt * (+document.getElementById('sp').value) * 0.30;
  texVoda.repeat.set(1.4, 1);

  zasahyLahvi(dt);

  // zaměřovač na skutečném cíli, ne pod prstem — prst je na mobilu jinde
  {
    const v = new THREE.Vector3(cil.x, cil.y, cil.z).project(camera);
    const kx = (v.x*0.5 + 0.5)*innerWidth, ky = (-v.y*0.5 + 0.5)*innerHeight;
    kriz.style.transform = 'translate(' + kx.toFixed(1) + 'px,' + ky.toFixed(1) + 'px)';
  }

  renderer.render(scene, camera);

  snimku++; fpsT += dt;
  if(fpsT >= 0.5){
    const f = Math.round(snimku/fpsT);
    document.getElementById('fps').textContent = f;
    document.getElementById('fpsRoh').textContent = f + ' FPS';
    document.getElementById('tris').textContent = renderer.info.render.triangles;
    document.getElementById('calls').textContent = renderer.info.render.calls;
    document.getElementById('uzlu').textContent = uzly.length;
    document.getElementById('gen').textContent = new Set(uzly.map(u=>u.gen)).size;
    document.getElementById('kap').textContent = kapekZivych;
    document.getElementById('skore').textContent = skore;
    snimku = 0; fpsT = 0;
  }
}
requestAnimationFrame(smycka);
</script>
