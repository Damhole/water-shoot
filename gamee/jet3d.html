<!DOCTYPE html>
<html lang="cs">
<head>
<meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
<title>Golden Ducks — prototyp 3D trysky</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
  /* touch-action NEPATŘÍ na body. Prohlížeč ho skládá z prvku i ze všech
     jeho předků, takže `none` na body zabije posouvání i uvnitř nastavení —
     panel pak na mobilu nešlo rolovat. Zákaz gest patří jen na plátno, kde
     se míří; body si nechá `manipulation`, což vypne jen dvojklik-zoom. */
  html,body{margin:0;height:100%;background:#0d1520;overflow:hidden;
    font:13px/1.4 -apple-system,system-ui,Arial,sans-serif;color:#cfe0f5;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;overscroll-behavior:none}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #tma{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:#080b12;opacity:0}
  /* Tlačítko nastavení je DOLE V ROHU: nahoře přebíjelo pruh života a hráč
     má nahoře koukat na stav, ne na ozubené kolo. */
  #cog{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom, 0px));
    width:38px;height:38px;border:0;
    border-radius:50%;background:rgba(8,14,24,.8);color:#cfe0f5;font-size:19px;
    cursor:pointer;z-index:3;-webkit-tap-highlight-color:transparent}
  #cog:active{transform:translateY(1px)}
  /* Panel vyjíždí od tlačítka, tedy ODE DNA nahoru. */
  #hud{position:fixed;left:10px;
    bottom:calc(56px + env(safe-area-inset-bottom, 0px));background:rgba(8,14,24,.86);
    padding:10px 12px;border-radius:9px;min-width:210px;
    /* border-box je tu nutný: max-height se jinak počítá na OBSAHOVOU
       krabici a padding se k ní přičte — panel pak přetekl přesně o těch
       24 px odsazení. */
    box-sizing:border-box;
    /* nad VŠÍM — skóre má 4, hláška 5; dřív panel s 2 mizel pod nimi */
    z-index:50;overflow-y:auto;
    /* VÝŠKA PANELU: 100vh je na mobilu výška BEZ prohlížečových lišt, takže
       panel sahal pod spodní lištu a na jeho konec se nedalo dorolovat.
       100svh je „malý" viewport, tedy stav, kdy jsou lišty vidět — panel se
       pak vejde vždycky. K tomu bezpečná zóna kvůli iPhonu s home indikátorem.
       První řádek je záloha pro prohlížeče, které svh neumí. */
    max-height:calc(100vh - 70px);
    max-height:calc(100svh - 66px - env(safe-area-inset-bottom, 0px));
    padding-bottom:14px;
    /* svislé posouvání uvnitř panelu povolené, vodorovné ne — jinak by tah
       do strany po posuvníku ujel celým panelem */
    touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  #hud[hidden]{display:none}
  #hud .btn{margin-top:9px;width:100%;padding:7px;border-radius:7px;
    background:rgba(255,255,255,.12);color:#cfe0f5;border:1px solid rgba(207,224,255,.3);
    font:inherit;font-size:12px;cursor:pointer}
  #hud b{color:#8fd0ff}
  #hud label{display:block;margin:7px 0 2px;color:#9fb4cc;font-size:11px}
  /* posuvník si bere gesta sám: bez tohohle by prohlížeč šikmý tah po
     posuvníku v půlce překlopil do rolování panelu */
  #hud input[type=range]{width:100%;touch-action:none}
  .row{display:flex;gap:10px;justify-content:space-between}
  #fpsRoh{position:fixed;right:8px;top:6px;font-size:11px;color:#8fd0ff;
    background:rgba(8,14,24,.55);padding:2px 7px;border-radius:6px;z-index:4;
    pointer-events:none;font-variant-numeric:tabular-nums}
  /* TYPOGRAFIE PODLE PŘEDLOHY.
     Tři věci dělají ten vzhled: krémová (ne zlatá) barva, TMAVÝ OBRYS kolem
     písmen a měkký stín pod ním. Obrys je zásadní — text pak drží čitelnost
     na světlé i tmavé části scény, což posunutý stín neumí; na hnědé stěně
     se dosavadní zlatá s šedým stínem ztrácela.
     Obrys se skládá z osmi text-shadow do kříže a diagonál. Vypadá to jako
     hloupost proti -webkit-text-stroke, jenže ten kreslí obrys DOVNITŘ glyfu
     a tenká písma tím ukrojí; tohle obepíná zvenčí.
     Písmo je zaoblený grotesk, ne Arial Black — Arial Rounded je na iOS
     i macOS, Android spadne na svůj těžký systémový řez.
     Tabulární číslice: bez nich se text při každé změně cifer posouvá. */
  /* Lilita One, staženo z Google Fonts do gamee/fonts/ (OFL, 12 kB celkem).
     Vlastní kopie, ne <link> na CDN — hra musí jet i bez internetu a v Gamee
     zipu. Dva podsety: „latin" (10,4 kB) stačí na skóre i anglické popisky,
     „latin-ext" (1,4 kB) je kvůli české diakritice, kdyby se sem někdy dostal
     český text. font-display: swap = než se font načte, kreslí se náhradní
     písmo místo neviditelného textu. */
  @font-face{ font-family:'Lilita One'; font-style:normal; font-weight:400;
    font-display:swap; src:url(./fonts/lilitaone-latin.woff2) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,
      U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,
      U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face{ font-family:'Lilita One'; font-style:normal; font-weight:400;
    font-display:swap; src:url(./fonts/lilitaone-latin-ext.woff2) format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,
      U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,
      U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  :root{ --krem:#fbf1dc; --obrys:#2c1a0d; }
  /* Lilita One má jediný řez (400) a je sama o sobě těžká — proto se u ní
     NESMÍ nastavovat font-weight na 800, prohlížeč by ji uměle ztučnil
     a rozmazal obrysy. Váha je proto 400 a tučnost dělá samo písmo. */
  .titulek{ font-family:'Lilita One',"Arial Rounded MT Bold","Helvetica Rounded",
      "Trebuchet MS","Arial Black",Arial,sans-serif; font-weight:400;
    color:var(--krem); font-variant-numeric:tabular-nums;
    text-shadow:
      calc(var(--o))   calc(var(--o))   0 var(--obrys),
      calc(-1*var(--o)) calc(var(--o))  0 var(--obrys),
      calc(var(--o))   calc(-1*var(--o)) 0 var(--obrys),
      calc(-1*var(--o)) calc(-1*var(--o)) 0 var(--obrys),
      var(--o) 0 0 var(--obrys), calc(-1*var(--o)) 0 0 var(--obrys),
      0 var(--o) 0 var(--obrys), 0 calc(-1*var(--o)) 0 var(--obrys); }
  /* HLOUBKA: pod textem leží JEHO KOPIE, celá tmavá a s vlastním, o kus
     tlustším obrysem, posunutá o pár pixelů dolů. Přední text pak neplave na
     ploše, ale sedí na vlastním těle — to je ten dojem plnosti.
     Proč kopie a ne jen řada stínů pod sebou: stín má tvar GLYFU, kdežto
     kopie má i svůj obrys, takže tělo je o kousek širší než přední písmo
     a kolem vznikne tmavý lem. Se samotnými stíny tělo lícuje s písmem
     a vypadá to ploše.
     Text kopie bere z data-text, takže se musí při každé změně přepsat —
     dělá to `nastavTitulek()`. */
  .titulek::after{
    content:attr(data-text);
    position:absolute; left:0; right:0; top:var(--hloubka); z-index:-1;
    color:var(--obrys);
    text-shadow:
      calc(var(--o2))   calc(var(--o2))   0 var(--obrys),
      calc(-1*var(--o2)) calc(var(--o2))  0 var(--obrys),
      calc(var(--o2))   calc(-1*var(--o2)) 0 var(--obrys),
      calc(-1*var(--o2)) calc(-1*var(--o2)) 0 var(--obrys),
      var(--o2) 0 0 var(--obrys), calc(-1*var(--o2)) 0 0 var(--obrys),
      0 var(--o2) 0 var(--obrys), 0 calc(-1*var(--o2)) 0 var(--obrys),
      0 0.5vh 0.55vh rgba(0,0,0,.4); }
  #skoreRoh{position:fixed;left:50%;top:calc(21.5vh - 50px);transform:translate(-50%,-50%);z-index:4;
    pointer-events:none;font-size:6.2vh;line-height:1;--o:0.20vh;--o2:0.28vh;--hloubka:0.40vh}
  /* patro a postup ke kvótě — pod skóre, drobněji, ať to nekřičí */
  #patroRoh{position:fixed;left:50%;top:calc(27.4vh - 50px);transform:translate(-50%,-50%);z-index:4;
    pointer-events:none;font-size:2.4vh;line-height:1;--o:0.11vh;--o2:0.16vh;--hloubka:0.17vh;
    letter-spacing:.02em}
  /* ŽIVOT — srdce a pruh vlevo, v pásu MEZI ⚙ a skóre.
     Proč ne přímo ve výšce skóre: skóre je vycentrované a roste do stran, takže
     od pětimístného (a to padne zhruba po pátém patře, lahev je za 100) by si
     s pruhem vlezly do sebe — naměřeno 9,6 px překryv při 12500 a 23,5 px při
     šestimístném. V pásu nad ním je volno přes celou šířku.
     Výška: střed přesně mezi spodkem ⚙ (48 px) a horní hranou skóre
     (21,5vh − 50px − 3,1vh) → (18,4vh − 2px)/2.
     Šířka je v `vh` stejně jako písmo skóre, takže spolu drží poměr na každém
     displeji; kdyby byla ve `vw`, na širokém telefonu by pruh vyrostl proti
     zbytku HUD. Rozměr je odvozený od jediné proměnné --vys, ať jde velikost
     měnit na jednom místě. Srdce leží PŘES levý konec pruhu (jako v předloze),
     proto je absolutně a pruh má o půl srdce větší odsazení. */
  /* Oba ukazatele sdílejí VŠECHNO až na barvy a stranu — proto společný
     předpis a v něm jen dva rozdíly: kde stojí a čím jsou vyplněné.
     Voda je zrcadlově vpravo, aby dvojice rámovala skóre. */
  #zivotRoh,#vodaRoh,#minceRoh{position:fixed;top:calc(9.2vh - 1px);
    transform:translateY(-50%);z-index:4;pointer-events:none;
    --vys:2.7vh; --ikona:4.7vh;
    /* obrys je tu ČERNÝ, ne hnědá --obrys od písma — na předloze je černá
       a proti sytě červené drží ostřeji než hnědá */
    --zobrys:#000;
    /* HLOUBKA: o kolik je vysunutá tmavá kopie pod tvarem. Totéž, co dělá
       .titulek::after u písma — bez ní pruh plave na ploše. */
    --hloub:.34vh}
  #zivotRoh{left:max(10px,3vw)}
  #vodaRoh{right:max(10px,3vw)}
  #zivotRoh .pruh,#vodaRoh .pruh{width:9.5vh;height:var(--vys);
    box-sizing:border-box;overflow:hidden;position:relative;display:flex;
    border:calc(var(--vys)*.15) solid var(--zobrys);
    border-radius:calc(var(--vys)*.5);
    /* Vysunutá kopie je PLNÝ stín s nulovým rozostřením: kopíruje tvar
       i zaoblení sám od sebe, takže se nemusí kreslit druhý prvek (ten by
       se navíc musel klonovat i pro ikonu). Měkký stín jde až pod ni, jinak
       by se tmavá kopie v jeho šedi ztratila. */
    box-shadow:0 var(--hloub) 0 var(--zobrys),
               0 calc(var(--hloub) + .25vh) .45vh rgba(0,0,0,.35)}
  /* PRÁZDNÁ ČÁST JE U OBOU TMAVÁ, i když v předloze jen vybledne. Vybledlá
     verze totiž neobstála periferním viděním: hráč se dívá na terče a stav
     musí přečíst koutkem oka, kde se rozlišuje hlavně JAS, ne barva —
     a světle červená proti sytě červené (stejně jako světle modrá proti
     modré) se jasem skoro neliší. Proti tmavému podkladu je hranice
     jednoznačná i mimo pohled. */
  #zivotRoh .pruh{margin-left:calc(var(--ikona)*.46);
    background:linear-gradient(#3b1418,#1c080b)}
  /* Kapka je u LEVÉHO konce jako srdce a voda ubývá stejným směrem, tedy
     doprava. Zrcadlení se neosvědčilo: pruh je sice vpravo, ale ubývat měl
     opačně než život a oko to muselo číst dvakrát. */
  #vodaRoh .pruh{margin-left:calc(var(--ikona)*.46);
    background:linear-gradient(#16303f,#0b1c27)}
  /* Výplň je samostatný prvek, aby se dala měnit jen šířka — animovat
     gradient na pozadí by znamenalo překreslovat celý pruh. */
  #zivotRoh .vypln,#vodaRoh .vypln{display:block;height:100%;width:100%;
    transition:width .25s ease}
  #zivotRoh .vypln{background:linear-gradient(#f2453f 0%,#dd2026 52%,#a91218 100%)}
  #vodaRoh .vypln{background:linear-gradient(#7ddcff 0%,#2f9fe0 52%,#12689f 100%)}
  /* NÁBOJNICE. Leží PŘES výplň, takže dělení platí i pro plnou i pro
     prázdnou část a tekutina je vidět „uvnitř" nich.
     Válec se čte ze tří věcí: tmavá spára mezi náboji, světlý pruh blízko
     levé hrany (odlesk) a ztmavení u pravé (odvrácená strana). K tomu
     vodorovný proužek u dna = obruba nábojnice. Všechno průsvitné, ať to
     jen stínuje modrou pod sebou a nepřebarvuje ji. */
  #vodaRoh .naboje{position:absolute;inset:0;--cela:calc(var(--vys)*.46);
    background:
      linear-gradient(rgba(0,0,0,0) 0 62%, rgba(0,0,0,.30) 62% 76%, rgba(0,0,0,0) 76%),
      repeating-linear-gradient(90deg,
        rgba(0,0,0,.55) 0 calc(var(--cela)*.12),
        rgba(255,255,255,.30) calc(var(--cela)*.12) calc(var(--cela)*.32),
        rgba(255,255,255,0) calc(var(--cela)*.32) calc(var(--cela)*.66),
        rgba(0,0,0,.22) calc(var(--cela)*.66) var(--cela))}
  /* U ikon dělá totéž drop-shadow s nulovým rozostřením — box-shadow by
     obkreslil čtverec kolem SVG, drop-shadow jde po tvaru glyfu. */
  #zivotRoh .srdce,#vodaRoh .kapka,#minceRoh .mince{position:absolute;top:50%;
    width:var(--ikona);height:var(--ikona);transform:translateY(-50%);
    filter:drop-shadow(0 var(--hloub) 0 var(--zobrys))
           drop-shadow(0 .28vh .38vh rgba(0,0,0,.4))}
  #zivotRoh .srdce{left:0}
  #vodaRoh .kapka{left:0}
  /* MINCE — mezi oběma pruhy. Stejná stavba jako oni (ikona přes levý konec,
     týž obrys i vysunutá kopie), jen je pruh černý a místo výplně je v něm
     číslo. Šířka je na obsahu, ne pevná: čtyřmístný počet mincí by se do
     pevného pruhu nevešel a rozsypal by se ven. */
  #minceRoh{left:50%;transform:translate(-50%,-50%)}
  #minceRoh .pruh{margin-left:calc(var(--ikona)*.46);height:var(--vys);
    min-width:7vh;box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;
    padding:0 .7vh 0 calc(var(--ikona)*.30);
    border:calc(var(--vys)*.15) solid var(--zobrys);
    border-radius:calc(var(--vys)*.5);
    background:linear-gradient(#23262e,#0d0f13);
    box-shadow:0 var(--hloub) 0 var(--zobrys),
               0 calc(var(--hloub) + .25vh) .45vh rgba(0,0,0,.35)}
  #minceRoh .pocet{font-family:'Lilita One',"Arial Rounded MT Bold",Arial,sans-serif;
    font-weight:400;font-size:calc(var(--vys)*.78);line-height:1;color:var(--krem);
    font-variant-numeric:tabular-nums;letter-spacing:.02em}
  #minceRoh .mince{position:absolute;left:0}
  /* MINCE ZE SESTŘELENÉ KACHNIČKY. Nejdřív se poskládají pod skóre, pak
     přeletí do pruhu. Je to HUD, ne scéna: kdyby letěly ve 3D, musely by se
     promítat do rohu obrazovky a v perspektivě by se u cíle scvrkly na nic.
     Let dělá jedna transformace, aby se to na mobilu zvládlo na GPU. */
  /* Vodní kapka z lahve letí do zásobníku touž dráhou jako mince, jen se
     cestou protahuje po směru letu (dělá to krokLetMinci v transformaci). */
  .letMince, .letVoda{position:fixed;left:0;top:0;z-index:6;pointer-events:none;
    width:3.6vh;height:3.6vh;
    filter:drop-shadow(0 .3vh .4vh rgba(0,0,0,.45))}
  /* „Floor cleared!" — přes celou šířku, uprostřed výšky terčů. Naskočí
     s krátkým přiblížením, ať to má úder; bez animace by to jen bliklo. */
  #hlaska{position:fixed;left:0;right:0;top:45vh;z-index:5;text-align:center;
    pointer-events:none;font-size:3.4vh;line-height:1;--o:0.15vh;--o2:0.21vh;--hloubka:0.25vh;
    letter-spacing:.04em;
    opacity:0;transform:scale(.75);transition:opacity .16s ease, transform .16s ease}
  #hlaska.vidno{opacity:1;transform:scale(1)}
  /* Konec hry sedí na výšce terčů jako „Floor cleared!", jen výš a ve dvou
     řádcích. Přes celou šířku, takže se dlouhý text nemusí zmenšovat. */
  /* VAROVÁNÍ „Low water!". Naskočí jednou při poklesu pod práh a zase
     zmizí; trvalý stav ukazuje pulzující pruh, ne blikající text — ten by
     po pár vteřinách přestal být varováním a začal být otravou. */
  #vodaMalo{position:fixed;right:max(10px,3vw);top:calc(9.2vh + 2.6vh);
    z-index:5;pointer-events:none;font-size:2.1vh;line-height:1;
    --o:0.10vh;--o2:0.14vh;--hloubka:0.15vh;letter-spacing:.02em;
    opacity:0;transform:translateY(-4px);
    transition:opacity .18s ease, transform .18s ease}
  #vodaMalo.vidno{opacity:1;transform:translateY(0)}
  /* PULZUJE OBOJÍ: velikost i obrys do červena, ve stejném rytmu 0,8 s.
     Samotná barva se totiž koutkem oka skoro ztratí — pohyb je to, co
     periferie zachytí první, a barva až řekne, o co jde.
     Červená je schválně TLUMENÁ (#a3372c, ne sytá #ff2f21): obrys je tenký
     a syté červené na černém podkladu na něm bliká jako alarm, kdežto
     tlumená čte jako varování.
     Pulz velikosti MUSÍ zachovat translateY(-50%), jinak pruh při každém
     kmitu poskočí o půl své výšky. */
  #vodaRoh.malo{animation:pulzVoda .8s ease-in-out infinite}
  #vodaRoh.malo .pruh{animation:pulzObrys .8s ease-in-out infinite}
  #vodaRoh.malo .kapka path{animation:pulzObrysKapka .8s ease-in-out infinite}
  @keyframes pulzVoda{
    0%,100%{transform:translateY(-50%) scale(1)}
    50%{transform:translateY(-50%) scale(1.06)}}
  @keyframes pulzObrys{
    0%,100%{border-color:#000}
    50%{border-color:#a3372c}}
  @keyframes pulzObrysKapka{
    0%,100%{stroke:#000}
    50%{stroke:#a3372c}}
  #konecRoh{position:fixed;left:0;right:0;top:38vh;z-index:7;text-align:center;
    pointer-events:none}
  #konecRoh[hidden]{display:none}
  /* POSITION:RELATIVE JE TU POVINNÉ. Hloubková kopie (.titulek::after) je
     absolutně polohovaná, takže se řídí nejbližším POLOHOVANÝM předkem —
     u ostatních nadpisů je to prvek sám (mají position:fixed). Tyhle dva
     řádky jsou obyčejné divy uvnitř #konecRoh, takže se jim kopie odstěhovala
     k hornímu okraji kontejneru a překryla nadpis cizím textem. */
  #konecNadpis{position:relative;font-size:5.2vh;line-height:1.1;
    --o:0.22vh;--o2:0.30vh;--hloubka:0.42vh}
  #konecVyzva{position:relative;margin-top:1.6vh;font-size:2.4vh;line-height:1;
    --o:0.11vh;--o2:0.16vh;--hloubka:0.17vh;letter-spacing:.03em;opacity:.9}
  /* Zaměřovač po konci hry ZMIZÍ. Zvažoval jsem nechat ho zamrznout pod
     přehozem, ale kříž visící nad mrtvou scénou svádí k míření a odvádí oko
     od hlášky — přitom jediné, co má hráč udělat, je klepnout kamkoli.
     Během ztráty tlaku naopak zůstává plně vidět: tam ho hráč potřebuje
     nejvíc, proto je nad přehozem (z-index 3 proti 2). */
  #kriz{position:fixed;left:0;top:0;width:54px;height:54px;margin:-27px 0 0 -27px;
    transition:opacity .35s ease;
    pointer-events:none;z-index:3}
  #kriz.pryc{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- Ztmavení hrací plochy při ztrátě tlaku. Leží NAD plátnem, ale POD
     zaměřovačem a HUD (z-index 2 proti 3 a 4), takže scéna potemní, kdežto
     ukazatele a kříž zůstanou čitelné — jinak by hráč přestal vidět zrovna
     to, podle čeho se má v tísni rozhodovat. -->
<div id="tma"></div>
<!-- Směrové rozmazání. CSS filter: blur() umí jen kruhové rozostření, což
     vypadá jako rozostřená kamera. feGaussianBlur bere stdDeviation zvlášť
     pro X a Y, takže se dá rozmazat JEN VE SMĚRU POHYBU a scéna se pak maže
     jako při rychlém přejezdu. Filtr je pořád připojený, jen se mu každý
     snímek přepisuje odchylka; při nule nic nedělá. -->
<svg width="0" height="0" style="position:absolute;pointer-events:none">
  <filter id="rozmaz" x="0" y="-25%" width="100%" height="150%"
          color-interpolation-filters="sRGB">
    <feGaussianBlur id="rozmazG" in="SourceGraphic" stdDeviation="0 0"/>
  </filter>
</svg>

<!-- Ukazatel života. Srdce je SVG, ne emoji — emoji vykreslí každý systém
     jinak (a na Androidu bez obrysu), takže by se s pruhem nesešlo barvou.
     Obrys je táž tmavá jako u písma a zaměřovače, aby to patřilo k sobě. -->
<div id="zivotRoh" aria-hidden="true">
  <div class="pruh"><i class="vypln"></i></div>
  <svg class="srdce" viewBox="0 0 64 64">
    <defs><linearGradient id="gSrdce" x1="0" y1="0" x2="0" y2="1">

    </linearGradient></defs>
    <path d="M32 57C11 42 4 30 8.5 19.5 12.5 10 25 8.5 32 18c7-9.5 19.5-8 23.5 1.5C60 30 53 42 32 57Z"
          fill="url(#gSrdce)" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="22" cy="22" rx="7" ry="4.6" fill="#ff9f9b" opacity=".85"
             transform="rotate(-38 22 22)"/>

</div>
<!-- Zásoba vody. Zrcadlový dvojník života: kapka místo srdce, modrá místo
     červené a pruh ubývá od kapky doleva. Uvnitř leží vrstva `naboje`,
     která pruh rozdělí na nábojnice — kresba je jen stínování, tekutina
     pod ní zůstává vidět. -->
<div id="vodaRoh" aria-hidden="true">

  <svg class="kapka" viewBox="0 0 64 64">
    <defs><linearGradient id="gKapka" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ddcff"/><stop offset="1" stop-color="#12689f"/>
    </linearGradient></defs>
    <path d="M32 5c8 15 20 25 20 35a20 20 0 0 1-40 0c0-10 12-20 20-35Z"
          fill="url(#gKapka)" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="23" cy="41" rx="5.6" ry="8" fill="#c9f2ff" opacity=".8"
             transform="rotate(-20 23 41)"/>
  </svg>
</div>
<!-- Mince mezi oběma pruhy. Zatím se počítá jedna za sestřelenou kachničku
     a jedna za rozbitou lahev; s tím, na co se bude utrácet, se to doladí. -->
<div id="minceRoh">
  <div class="pruh"><span class="pocet" id="minceCislo">0</span></div>
  <svg class="mince" viewBox="0 0 64 64">
    <defs><linearGradient id="gMince" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffe07a"/><stop offset="1" stop-color="#d08b1c"/>
    </linearGradient></defs>
    <circle cx="32" cy="32" r="26" fill="url(#gMince)" stroke="#000" stroke-width="5"/>
    <circle cx="32" cy="32" r="19.5" fill="none" stroke="#a86a12" stroke-width="2.6" opacity=".6"/>
    <!-- Ražba: KORUNKA. Kachnička z profilu se v malém četla jako hrouda —
         má moc detailů (zobák, ocas, oko), které na 37 px splynou. Korunka
         drží tvar i v malém, protože je to pár rovných hran a tři špičky.
         Plná silueta v tmavém zlatě, ne obrys: z linek by zbyla šedá kaše. -->
    <!-- Zmenšeno na 80 % kolem středu mince: v plné velikosti se korunka
         dotýkala vnitřního kroužku a mince působila přecpaně. Zmenšuje se
         transformací, ne přepsáním souřadnic — tvar tím zůstane ten samý
         a dá se velikost kdykoli doladit jedním číslem. -->
    <g fill="#9c6210" opacity=".95" transform="translate(32 32) scale(.8) translate(-32 -32)">
      <path d="M20 41.5 17.4 24l7.1 6.2L32 19.6l7.5 10.6 7.1-6.2L44 41.5z"/>
      <rect x="19" y="41.5" width="26" height="4.6" rx="2"/>
      <circle cx="17.4" cy="22" r="2.5"/><circle cx="32" cy="17.6" r="2.7"/>
      <circle cx="46.6" cy="22" r="2.5"/>
    </g>
    <ellipse cx="21" cy="21" rx="5.4" ry="3.2" fill="#fff6d0" opacity=".7"
             transform="rotate(-38 21 21)"/>
  </svg>
</div>
<div id="hlaska" class="titulek"></div>

<!-- Zaměřovač podle předlohy: silnější a v týchž barvách jako text, tedy

<button id="cog" aria-label="nastavení">⚙</button>
<div id="hud" hidden>

  <div class="row"><span>draw calls</span><b id="calls">–</b></div>

  <!-- ID SE MĚNÍ S KAŽDOU ZMĚNOU VÝCHOZÍ HODNOTY (spot → spotr → spot3).
       Posuvníky se ukládají do localStorage podle id, takže na zařízení, kde

<!-- Popis ovládání odsud zmizel: byl to text pro první seznámení s prototypem
     a v hratelné verzi jen ukrajoval spodní třetinu obrazu. -->

<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js", "cannon": "./lib/cannon-es.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon';

// Prototyp nemá pomocné funkce z game.js, takže si je nese sám.
const rand = (a, b) => a + Math.random()*(b - a);

// ---------------------------------------------------------------------------
// Prototyp 3D trysky. Cíl: ověřit, že proud vody NEMUSÍ stát na částicích.
// Místo tisíců bodů je to jedna trubice vygenerovaná podél balistické dráhy;
// dojem tekoucí vody dělá posouvání textury po jejím povrchu.
//
// Balistika je schválně stejná jako ve hře (viz game.js): vodorovná rychlost
// je konstantní, svislá se mění gravitací. Díky tomu je porovnání férové.
// ---------------------------------------------------------------------------

const kriz = document.getElementById('kriz');
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color('#101c2b');
scene.fog = new THREE.Fog('#101c2b', 900, 2600);

// ZORNÝ ÚHEL 48° místo původních 55°. Řeším tím „na telefonu vidím víc, než
// bych chtěl": užší úhel přiblíží police, aniž by se hnula kamera. To je
// podstatné — kdyby kamera popojela, změní se jí vztah k ústí trysky a musela
// by se přeladit balistika i dostřik. Takhle zůstává všechno na svém místě
// a mění se jen výřez. Míření i pás, ve kterém vznikají kachničky, si
// `camera.fov` čtou, takže se přizpůsobí samy.
// Je to na posuvníku v ⚙ panelu, protože správná hodnota se pozná až na
// telefonu v ruce, ne na monitoru.
const camera = new THREE.PerspectiveCamera(48, 1, 1, 5000);
// Kamera zůstává tam, kde byla u koulí — v téhle poloze se tryska chová
// nejlíp (dostřik i oblouk sedí). Zátiší se místo toho posadilo níž, viz
// POLICE_Y, aby padlo do jejího záběru.
//
// STANOVISTE zvedá celé stanoviště hráče naráz: kameru, ústí trysky (USTI)
// i mapování kurzoru na cíl (mir). Musí se posunout všechno pohromadě —
// samotná kamera by nechala proud vycházet od podlahy a samotné ústí by
// rozešlo zaměřovač s kurzorem.
const STANOVISTE = 150;
camera.position.set(0, 210 + STANOVISTE, 560);
camera.lookAt(0, 150 + STANOVISTE, -400);

// ---- paralaxa -------------------------------------------------------------
// Kamera se lehce naklání za mířením. Je to POSUN, ne otočení: kamera i bod,
// na který se dívá, jedou o totéž, takže se scéna nezkosí a vzniká skutečná
// paralaxa — police (blíž) se posunou víc než zadní stěna (dál).
//
// Ústí trysky se musí posunout SPOLU S KAMEROU. Kdyby zůstalo stát, začne
// proud vyjíždět z jiného místa obrazovky; hlaveň se ve 2D verzi kreslí na
// pevném místě a tohle je totéž pravidlo.
const KAM_ZAKLAD = camera.position.clone();
const KAM_MIRI = new THREE.Vector3(0, 150 + STANOVISTE, -400);
const PARALAX_X = 40, PARALAX_Y = 26;   // maximální posun kamery na kraj obrazovky
const PARALAX_TUHOST = 5.5;             // jak rychle kamera dojíždí (1/s)
const paralax = new THREE.Vector3();    // aktuální posun
const paralaxCil = new THREE.Vector3(); // kam se dojíždí

// Součet obou světel byl 0,9 + 1,15 = 2,05. Osvětlená plocha se tím dostala
// vysoko nad 1 a v lineárním prostoru to znamená, že se barva táhne k bílé —
// tedy přesně to vyblednutí. Součet je nově 1,76: dost na to, aby scéna
// nebyla tmavá (zkoušel jsem 1,45 a bylo to potemnělé), ale o 14 % míň tlaku
// k bílé. K tomu je ambient méně modrý, aby scéně nešedivěl hnědou.
scene.add(new THREE.AmbientLight(0x8fa8c4, 0.74));
const slunce = new THREE.DirectionalLight(0xffffff, 1.02);
// Světlo svítí PŘEDEVŠÍM ZEPŘEDU, jen lehce zleva a shora. Dřív bylo vysoko
// vlevo a stíny se táhly daleko doprava dolů; frontální světlo je posadí
// těsně za předmět, což je u police s lahvemi čitelnější.
// Vodorovná i svislá poloha jsou na posuvnících v ⚙ panelu — směr světla je
// věc vkusu a hádat ho za uživatele nemá smysl.
slunce.position.set(-700, 1100, 1700);
scene.add(slunce);

// ---- stíny ----------------------------------------------------------------
// Kamera se dívá skoro vodorovně, takže stín ležící na desce police by byl
// vidět z boku a prakticky by zanikl. Užitečný je tu stín na ZADNÍ STĚNĚ.
//
// Vrhají lahve, kachničky (jen PŘEDNÍ vrstva z pěti) a DESKY POLIC. Desky
// jsou tam podstatné: dokud stín nevrhaly, prosvítalo světlo skrz ně a stín
// lahve pokračoval na stěnu i pod policí, na kterou lahev vůbec nedosáhne.
// Obrysové meshe vrhat nesmí — jsou o 7 % větší a stín by z nich vyšel jako
// rozmazaná silueta vedle.
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
slunce.castShadow = true;
slunce.shadow.mapSize.set(2048, 2048);
{
  // Rozsah kamery stínu = ostrost. Mapa 1024 rozprostřená přes 2000×2200
  // dávala 2 jednotky na texel a stíny byly rozmazané šmouhy; 820×900 je
  // ~0,85 jednotky na texel, tedy dvakrát ostřejší, a pořád obsáhne celou
  // hrací sekci i kus nad ní.
  const sc = slunce.shadow.camera;
  sc.left = -820; sc.right = 820; sc.top = 900; sc.bottom = -900;
  sc.near = 200; sc.far = 3600;
  sc.updateProjectionMatrix();
}
// Proti „shadow acne", tedy diagonálnímu pruhování na vlastním povrchu.
// Hlavní práci dělá normalBias (odsazení ve SVĚTOVÝCH jednotkách po normále),
// ne depth bias — ten při velkém rozsahu scény jen odlepí stín od předmětu.
slunce.shadow.bias = -0.0003;
slunce.shadow.normalBias = 5;

// ---- barvy ----------------------------------------------------------------
// Three od r152 barvy spravuje: hex se bere jako sRGB, převede se do lineárního
// prostoru, tam se svítí a na výstupu se vrací zpátky do sRGB. Ověřeno, co tu
// běží: r170, ColorManagement zapnutý, výstup „srgb", tone mapping žádný.
//
// Je to fyzikálně správně, ale u kreslené scény to vede k vypraným barvám ze
// dvou důvodů: součet dvou světel (0,9 + 1,15 = až 2,05) tlačí střední tóny
// k bílé, a MeshToonMaterial to pak zaokrouhlí na tři pásma.
//
// Správu barev NERUŠÍM — rozhodila by textury (sprite banditů, textura vody).
// Místo toho zvedám každé barvě SYTOST v HSL na jednom místě. Materiály se
// registrují i s původní barvou, takže jde sytost přepočítat kdykoli — a je
// proto na posuvníku v ⚙ panelu.
const barevne = [];
const _hsl = { h:0, s:0, l:0 };
function barevny(mat, hex){ barevne.push({ mat, zaklad: new THREE.Color(hex) }); return mat; }
function nastavSytost(k){
  for(const b of barevne){
    // HSL se čte i zapisuje v sRGB — v lineárním prostoru „sytost" neodpovídá
    // tomu, co člověk vidí
    b.zaklad.getHSL(_hsl, THREE.SRGBColorSpace);
    b.mat.color.setHSL(_hsl.h, Math.min(1, _hsl.s*k), _hsl.l, THREE.SRGBColorSpace);
  }
}

// Toon gradient musí vzniknout DŘÍV než cokoli, co ho používá — podlaha ho
// nově potřebuje taky a `const` nemá výtah, takže by to spadlo na TDZ.
const toonGrad = new THREE.DataTexture(new Uint8Array([120, 200, 255]), 3, 1, THREE.RedFormat);
toonGrad.minFilter = THREE.NearestFilter;
toonGrad.magFilter = THREE.NearestFilter;
toonGrad.generateMipmaps = false;
toonGrad.needsUpdate = true;

// Podlaha a zadní stěna, ať je vidět hloubka a kam proud dopadá.
// Podlaha je DŘEVĚNÁ jako zbytek baru, jen tmavší — modrá tam byla z doby,
// kdy scéna ještě nebyla bar. Materiál je toon jako police, aby na ni stín
// dopadal stejným způsobem.
const podlaha = new THREE.Mesh(
  new THREE.PlaneGeometry(3000, 3000),
  barevny(new THREE.MeshLambertMaterial({ color:0x4a3119 }), 0x4a3119));
podlaha.rotation.x = -Math.PI/2;
podlaha.receiveShadow = true;
scene.add(podlaha);

const stena = new THREE.Mesh(
  new THREE.PlaneGeometry(3000, 1200),
  barevny(new THREE.MeshLambertMaterial({ color:0x24405c }), 0x24405c));
stena.position.set(0, 600, -1200);
scene.add(stena);

// ---- zátiší: barové police s lahvemi --------------------------------------
// Stejná scéna jako western mód, jen ve 3D. Lahve jsou rotační tělesa
// (LatheGeometry) ze stejného profilu, jaký používá 2D verze — díky tomu je
// srovnání férové a případný přechod by nevyžadoval nové modely.
const POLIC = 3;
// Rozteč MUSÍ počítat s tloušťkou desky: volná výška nad policí je rozteč
// minus 18. Při rozteči 130 zbývalo 112, ale nejvyšší lahev měří 126 — lahve
// se o desku nad sebou zaklínily. (Přesně stejná chyba jako ve westernu ve
// v111, kde volnou výšku určovala rozteč mínus tloušťka police.)
// Rozteč 185 dává 167 volných proti nejvyšší lahvi 126, tedy 41 rezervy
// i na naklonění při převracení.
const POLICE_Y = [50, 235, 420];
const POLICE_Z = -560;
const POLICE_HW = 620;
// Hloubka desky. Musí ZAJET DO STĚNY, ne k ní jen dosáhnout: se 150 končila
// deska v z −635, kdežto čelo stěny je v −620, takže mezi nimi zůstávalo
// 15 jednotek díry. Tou prosvítalo světlo (světlý proužek pod policí, police
// vypadala, že na stěnu nedoléhá) a procházel jí i stín lahve pod polici.
// 180 zajede 30 jednotek do stěny a díra zmizí.
const POLICE_HL = 180, POLICE_HL2 = POLICE_HL/2;
// Rovina, ve které stojí kachničky: O VRSTVU ZA LAHVEMI. Lahve stojí v
// POLICE_Z ±16, zadní stěna je v −620, takže −600 je mezi nimi — kachnička
// je za lahvemi a před stěnou. Stojí na desce police (její horní plocha je
// POLICE_Y), takže jí deska nepřekáží; blokovat může police NAD ní, a to je
// v pořádku, na horní patro se prostě musí střílet plošeji. Míří se do téhle
// roviny, viz mir().
const KACH_Z = POLICE_Z - 40;
// Šest místo sedmi: se třetí sekcí by při sedmi bylo 63 lahví a každá stojí
// dva draw cally (tělo + obrys). Takhle je jich 54, tedy jen o 12 víc než
// dřív při dvou sekcích.
const LAHVI_NA_POLICI = 6;

// profil v jednotkách 0..1 (poloměr, výška) — převzatý z js/western.js
const PROFIL_LAHEV = [
  [0.00,0.00],[0.98,0.02],[1.00,0.10],[1.00,0.52],
  [0.72,0.63],[0.34,0.72],[0.30,0.90],[0.36,0.96],[0.00,1.00],
];
const PROFIL_SKLENICE = [
  [0.00,0.00],[0.86,0.03],[0.90,0.10],[1.00,0.92],[0.98,1.00],[0.00,1.00],
];
function lathe(profil, segmentu){
  const body = profil.map(pr => new THREE.Vector2(pr[0], pr[1]));
  return new THREE.LatheGeometry(body, segmentu);
}
const GEO_LAHEV    = lathe(PROFIL_LAHEV, 14);
const GEO_SKLENICE = lathe(PROFIL_SKLENICE, 14);

const SKLA = [
  { geo:GEO_LAHEV,    barva:0x4d7a3f, w:26, h:118 },
  // Hnědá 0x8a5f2c splývala se stěnou (0x8a5c33) — je to prakticky tatáž
  // barva. Posunuto do oranžova a zesvětleno, ať se lahev od pozadí odlepí.
  { geo:GEO_LAHEV,    barva:0xc9762a, w:27, h:126 },
  { geo:GEO_LAHEV,    barva:0x3f5d7a, w:25, h:104 },
  { geo:GEO_SKLENICE, barva:0xa8ccdd, w:26, h:52  },
];

// dřevo polic a zadní stěna baru
const matDrevo = barevny(new THREE.MeshToonMaterial({ color: 0x7b5330, gradientMap: toonGrad }), 0x7b5330);
const matStena = barevny(new THREE.MeshToonMaterial({ color: 0x8a5c33, gradientMap: toonGrad }), 0x8a5c33);
const matObrysTelo = new THREE.MeshBasicMaterial({ color: 0x14161c, side: THREE.BackSide, fog: false });
// Vlastní, tmavší obrys pro dřevo. Sdílet ho s lahvemi nejde — ty ho mají
// dobře a ztmavením by zčernaly.
const matObrysDrevo = new THREE.MeshBasicMaterial({ color: 0x080a0e, side: THREE.BackSide, fog: false });

// LEM POLICE. Obrys desky se nesmí škálovat rovnoměrně: deska je 1240 × 18 × 150,
// takže 2 % dají 12 jednotek do stran, ale jen 0,18 nahoru — a nahoru a dolů
// je právě to, kde je obrys vidět. Proto se ke KAŽDÉ ose přičítá stejný lem
// a měřítko se z toho dopočítá.
const LEM_POLICE = 1.7;
function lemDesky(w, h, d){
  return [ (w + LEM_POLICE*2)/w, (h + LEM_POLICE*2)/h, (d + LEM_POLICE*2)/d ];
}

// Dřevo je pro vodu pevné. Kvádry se registrují PŘÍMO při stavbě baru, aby
// kolizní tvar vycházel z týchž rozměrů jako kreslená deska — dvě sady čísel
// vedle sebe by se rozešly při první úpravě polic.
const DREVO = [];
// `lokY` = výška kvádru VŮČI ZÁKLADNĚ SEKCE. Sekce baru jezdí nahoru a dolů,
// takže kolizní kvádry musí umět jet s ní; bez lokální souřadnice by se po
// prvním posunu rozešly s kresbou.
function pridejDrevo(x, y, z, hx, hy, hz){
  const kv = { min:[x-hx, y-hy, z-hz], max:[x+hx, y+hy, z+hz], lokY:[y-hy, y+hy] };
  DREVO.push(kv);
  return kv;
}

// ---- sekce baru -----------------------------------------------------------
// Bar je NEKONEČNÝ SMĚREM NAHORU a skládá se ze dvou stejných sekcí, které se
// recyklují: co sjede pod podlahu, vyjede nahoru s novým rozestavením lahví.
//
// Klíčové rozhodnutí: NEJEDE KAMERA, JEDE BAR DOLŮ. Na obrazovce je to totéž
// (stoupám barem), ale všechno ostatní — ústí trysky, balistika, podlaha,
// dopady kapek, míření — zůstává ve stejných souřadnicích jako dosud. Kdyby
// stoupala kamera, musela by se s ní posunout celá ta soustava a každé číslo,
// které jsme týden ladili, by se muselo přepočítat.
//
// Sekce jsou tři — proč, viz komentář u jejich vzniku.
const SEKCE_V = 620;                 // výška jedné části baru
const sekce = [];                    // slot 0 = ta, ve které se hraje

// ---- 3D fyzika (cannon-es) ------------------------------------------------
// Lahve jsou skutečná tělesa: stojí na deskách, opírají se o sebe, dají se
// převrhnout a spadnout z pultu do hloubky — což 2D Box2D ve westernu neumí,
// protože osa dopředu tam neexistuje.
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -1400, 0) });
world.allowSleep = true;                    // stojící lahve usnou a nestojí výkon
world.defaultContactMaterial.friction = 0.4;
world.defaultContactMaterial.restitution = 0.05;

// podlaha
const teloPodlahy = new CANNON.Body({ type: CANNON.Body.STATIC,
  shape: new CANNON.Plane() , quaternion: new CANNON.Quaternion().setFromEuler(-Math.PI/2, 0, 0) });
world.addBody(teloPodlahy);

// PODLAHA JE JEN V PŘÍZEMÍ. Od druhého patra už hráč stojí nad ní, takže
// ji nesmí vidět a padající lahev musí propadnout z obrazu dolů, ne se
// rozbít o neviditelnou rovinu ve vzduchu.
//
// `podlahaY` je jediná hranice, pod kterou všechno končí: voda, kapky, mlha,
// peří i lahve. Nad přízemím leží pod spodní hranou záběru (−430), takže se
// pád dokoná mimo obraz.
let podlahaY = 0, maPodlahu = true;
// Posun podlahy na danou výšku. Musí se hýbat KRESBA, FYZIKÁLNÍ ROVINA
// i `podlahaY` naráz — jinak by voda končila ve vzduchu tam, kde podlaha
// bývala, nebo by lahve propadaly skrz tu, která je vidět.
function posunPodlahu(y){
  podlahaY = y;
  podlaha.position.y = y;
  teloPodlahy.position.y = y;
  teloPodlahy.aabbNeedsUpdate = true;
}
function nastavPodlahu(){
  maPodlahu = (patro === 1);
  podlaha.visible = maPodlahu;
  posunPodlahu(maPodlahu ? 0 : -430);
}

const lahve = [];
const HP_LAHVE = 14;
const SILA_ZASAHU = () => +document.getElementById('imp').value;

// ---- kompozice police -----------------------------------------------------
// Rovnoměrné dělení šířky vypadá jako regál v obchodě. Skutečný bar má lahve
// ve SKUPINKÁCH s mezerami mezi nimi — pár kusů u sebe, pak volno.
//
// Vrací x-souřadnice pro `n` kusů: rozdělí je do dvou nebo tří skupinek,
// uvnitř skupinky stojí těsně u sebe a zbylé místo se rozdá jako mezery
// (včetně krajů) v náhodném poměru. Díky tomu není žádné dvě police stejné.
const ROZESTUP_VE_SKUPINE = 62;      // nejširší lahev má 27, sklenice 26
const MEZERA_MIN = 80;               // aby skupinky nesplynuly v řadu
// OKNO PRO KACHNIČKU. Kachnička se smí objevit jen v úzkém pásu kolem středu
// (pasKachen(), naměřeno 157 jednotek na telefonním poměru), kdežto police je
// široká 1066. Když do toho pásu padla celá skupinka lahví, nebylo kam
// kachničku postavit a stála za sklem celá — naměřeno 85 až 100 % míst pod
// prahem výkuku.
//
// Zkusil jsem to nejdřív POSUNEM hotové kompozice tak, aby jí do pásu najela
// mezera. Nefunguje to: kompozice je široká 1066 a deska 1240, takže je kam
// posouvat jen o ±47, kdežto potřeba jsou stovky. Police se proto skládá
// rovnou KOLEM OKNA — okno se vybere první a lahve se rozdělí do dvou oblastí
// vedle něj.
//
// Okno je schválně jen o málo širší než kachnička, ne co nejširší: v široké
// mezeře stála volně a zmizel dojem, že je zastrčená mezi lahvemi (naměřeno
// 98 ze 112 jednotek siluety nezakrytých, tedy prakticky celá). Takhle z ní
// z boků kus zapadne za sklo a kouká hlava s pistolí.
const OKNO_PAS = 75;                        // kam až smí střed okna od středu
const OKNO_MIN = 105, OKNO_MAX = 165;       // šířka okna (kachnička má 112)
const KRAJ_MIN = 30;                        // aby lahev nestála přesně na hraně

// Rozloží `k` lahví do oblasti <a, b> jako jednu nebo dvě skupinky.
function rozlozOblast(a, b, k, xs){
  if(k <= 0) return;
  const sirka = b - a;
  const skupin = (k >= 4 && sirka > 520) ? 2 : 1;
  const vel = new Array(skupin).fill(1);
  for(let z = k - skupin; z > 0; z--) vel[(Math.random()*skupin)|0]++;

  const sirkaKusu = vel.reduce((s,v)=>s + (v-1)*ROZESTUP_VE_SKUPINE, 0);
  let volno = sirka - sirkaKusu - MEZERA_MIN*(skupin-1) - 2*KRAJ_MIN;
  if(volno < 0) volno = 0;
  // náhodné rozdělení volna mezi mezery (kraje + mezi skupinkami), takže
  // kompozice jednou sedí u okna, jindy u kraje police
  const vahy = Array.from({length: skupin+1}, ()=> 0.35 + Math.random());
  const suma = vahy.reduce((p,q)=>p+q, 0);

  let x = a + KRAJ_MIN + vahy[0]/suma*volno;
  for(let g=0; g<skupin; g++){
    for(let i=0;i<vel[g];i++){
      xs.push(x + rand(-5, 5));                   // drobný rozhoz, ať to není pravítko
      if(i < vel[g]-1) x += ROZESTUP_VE_SKUPINE;
    }
    x += MEZERA_MIN + vahy[g+1]/suma*volno;
  }
}

// POŘADÍ NESMÍ MĚNIT. `prestavLahve` přiřazuje pozice lahvím podle indexu
// (`xsPodle[police][L.i]`) a typ lahve se při přestavění nemění — index 0 je
// proto vždycky ta sklenice v okně a nikdy se nesmí přerovnat jinam.
// ŠÍŘKA KOMPOZICE. Byla 1,72 poloviny police, tedy ±533 — jenže kamera na
// telefonním poměru ukáže z police jen ±230. Skoro celá kompozice tak stála
// mimo obraz a v záběru zbyly dvě lahve u krajů; s oknem uprostřed pak police
// působila vybíleně. S 1,22 (±378) padne většina lahví do záběru a mezi okno
// a kraj se jich vejde víc.
const KOMPOZICE_SIR = 1.22;
function rozlozPolici(n){
  const W = POLICE_HW*KOMPOZICE_SIR;
  const c = rand(-OKNO_PAS, OKNO_PAS);
  const pul = rand(OKNO_MIN, OKNO_MAX)/2;
  const vlevo = { a: -W/2, b: c - pul }, vpravo = { a: c + pul, b: W/2 };

  const xs = [];
  // index 0 = SKLENICE V OKNĚ. Bez ní zůstal střed každé police prázdný a bar
  // vypadal jako vybílený zrovna tam, kam se hráč dívá. Sklenice je vysoká 52
  // proti kachniččiným 151, takže zakryje břicho a hlava s pistolí koukají
  // přes ni — to je přesně to „za sklenicí", o které šlo.
  xs.push(c + rand(-12, 12));

  // zbytek se dělí podle toho, kolik místa která strana má — jinak by se na
  // užší straně namačkaly na sebe
  const sirL = Math.max(0, vlevo.b - vlevo.a), sirP = Math.max(0, vpravo.b - vpravo.a);
  const zbytek = n - 1;
  let nL = Math.round(zbytek * sirL/(sirL + sirP || 1));
  // kus nejistoty, ať police nejsou souměrné
  if(zbytek > 1 && Math.random() < 0.5) nL += (Math.random() < 0.5 ? -1 : 1);
  nL = Math.max(0, Math.min(zbytek, nL));

  rozlozOblast(vlevo.a, vlevo.b, nL, xs);
  rozlozOblast(vpravo.a, vpravo.b, zbytek - nL, xs);
  return xs;
}

// SKLA[3] je sklenice. Index lahve na polici určuje typ NATRVALO (při
// přestavění se mění jen pozice), takže „nultá je vždycky sklenice" stačí
// zařídit jednou tady a v okně pak stojí sklenice i po přestavění.
const TYP_SKLENICE = 3;
function novaLahev(sek, police, i, xPozice, typVynuceny){
  const typ = SKLA[typVynuceny !== undefined ? typVynuceny : (Math.random()*SKLA.length)|0];
  const m = new THREE.Mesh(typ.geo, barevny(new THREE.MeshToonMaterial({
    color: typ.barva, gradientMap: toonGrad }), typ.barva));
  // model má počátek ve SPODKU (profil 0..1), fyzikální válec ve STŘEDU —
  // proto se mesh posouvá o půl výšky dolů proti tělesu
  m.scale.set(typ.w, typ.h, typ.w);
  const obrys = new THREE.Mesh(typ.geo, matObrysTelo);
  obrys.scale.setScalar(1.07);
  m.add(obrys);
  m.castShadow = true;          // obrys zůstává bez stínu, je o 7 % větší
  scene.add(m);

  const x = xPozice;
  const telo = new CANNON.Body({
    mass: 1.4,
    shape: new CANNON.Cylinder(typ.w*0.9, typ.w*0.9, typ.h, 10),
    position: new CANNON.Vec3(x, sek.zaklY + POLICE_Y[police] + typ.h/2, POLICE_Z + rand(-16, 16)),
    linearDamping: 0.12, angularDamping: 0.25,
    sleepSpeedLimit: 6, sleepTimeLimit: 0.4,
  });
  telo.quaternion.setFromEuler(0, Math.random()*Math.PI*2, 0);
  world.addBody(telo);

  // Zhruba třetina lahví v sobě má vodu do zásoby. Losuje se při stavbě police
  // i při každém přestavění, takže nové patro rozdá zásoby znovu.
  const L = { m, telo, typ, police, i, sek, hp: HP_LAHVE, mrtva: 0, trefena: false,
              voda: Math.random() < 0.32, zaklX: x };
  sek.lahve.push(L);
  return L;
}

// Postaví jednu sekci baru: stěna, tři desky, jejich kolize pro vodu i pro
// fyziku a plná police lahví.
function novaSekce(zaklY){
  const sek = { zaklY, slot: 0, skupina: new THREE.Group(), telesa: [], drevo: [], lahve: [] };
  scene.add(sek.skupina);

  const stena = new THREE.Mesh(new THREE.BoxGeometry(1500, SEKCE_V, 40), matStena);
  stena.position.set(0, SEKCE_V/2, POLICE_Z - 80);
  stena.receiveShadow = true;
  sek.skupina.add(stena);
  // Sokl pod základnou. Nad přízemím není podlaha a bez tohohle by bar končil
  // uprostřed obrazu a visel v prázdnu. Je O KUS HLOUB v ose Z než stěna, aby
  // se s ní v místě, kde se sekce překrývají, nepral o stejnou rovinu.
  const sokl = new THREE.Mesh(new THREE.BoxGeometry(1500, 420, 40), matStena);
  sokl.position.set(0, -210, POLICE_Z - 95);
  sokl.receiveShadow = true;
  sek.skupina.add(sokl);
  sek.drevo.push(pridejDrevo(0, SEKCE_V/2, POLICE_Z - 80, 750, SEKCE_V/2, 20));
  // zadní zábrana, ať lahve neutečou dozadu
  sek.telesa.push({ telo: new CANNON.Body({ type: CANNON.Body.STATIC,
    shape: new CANNON.Box(new CANNON.Vec3(POLICE_HW, SEKCE_V/2, 20)),
    position: new CANNON.Vec3(0, SEKCE_V/2, POLICE_Z - 95) }), lokY: SEKCE_V/2 });

  for(const y of POLICE_Y){
    const deska = new THREE.Mesh(new THREE.BoxGeometry(POLICE_HW*2, 18, POLICE_HL), matDrevo);
    deska.position.set(0, y - 9, POLICE_Z);
    // Deska stín VRHÁ, ale NECHYTÁ. Světlo je frontální, takže na její
    // vodorovnou plochu dopadá skoro po tečně — a to je přesně situace, kde
    // vzniká pruhování. Kamera se navíc dívá skoro vodorovně, takže je ta
    // plocha stejně vidět z boku a o nic nepřicházíme.
    deska.receiveShadow = false;
    deska.castShadow = true;      // bez toho stín lahve prosvítá pod polici
    sek.skupina.add(deska);
    const o = new THREE.Mesh(new THREE.BoxGeometry(POLICE_HW*2, 18, POLICE_HL), matObrysDrevo);
    o.scale.set(...lemDesky(POLICE_HW*2, 18, POLICE_HL)); o.position.copy(deska.position);
    sek.skupina.add(o);
    sek.drevo.push(pridejDrevo(0, y - 9, POLICE_Z, POLICE_HW, 9, POLICE_HL2));
    sek.telesa.push({ telo: new CANNON.Body({ type: CANNON.Body.STATIC,
      shape: new CANNON.Box(new CANNON.Vec3(POLICE_HW, 9, POLICE_HL2)),
      position: new CANNON.Vec3(0, y - 9, POLICE_Z) }), lokY: y - 9 });
  }
  for(const t of sek.telesa) world.addBody(t.telo);
  for(let p=0;p<POLIC;p++){
    const xs = rozlozPolici(LAHVI_NA_POLICI);
    for(let i=0;i<LAHVI_NA_POLICI;i++)
      lahve.push(novaLahev(sek, p, i, xs[i], i === 0 ? TYP_SKLENICE : undefined));
  }
  nastavSekci(sek, zaklY);
  return sek;
}

// Posun celé sekce. Musí se hýbat VŠÍM najednou: kresba, statická tělesa
// i kolizní kvádry pro vodu. Když se posune jen kresba, voda se začne
// zastavovat o police, které tam nejsou vidět.
function nastavSekci(sek, y){
  sek.zaklY = y;
  sek.skupina.position.y = y;
  for(const t of sek.telesa){
    t.telo.position.y = y + t.lokY;
    // Statickému tělesu si cannon spočítá AABB jednou a pak už ho nepřepočítává.
    // Bez tohohle příznaku by se police posunula jen opticky a lahve by po
    // prvním přejezdu propadly skrz ni.
    t.telo.aabbNeedsUpdate = true;
  }
  for(const kv of sek.drevo){ kv.min[1] = y + kv.lokY[0]; kv.max[1] = y + kv.lokY[1]; }
}

// Nové rozestavení lahví — sekce, která vyjede nahoru, musí vypadat jako jiný
// kus baru, ne jako ten, co hráč právě vyčistil.
function prestavLahve(sek){
  // Kompozice se losuje ZNOVU a pro každou polici zvlášť — jinak by vyjelo
  // stejné patro, jaké hráč právě vyčistil.
  const xsPodle = POLICE_Y.map(()=> rozlozPolici(LAHVI_NA_POLICI));
  for(const L of sek.lahve){
    L.hp = HP_LAHVE; L.mrtva = 0; L.pada = false; L.trefena = false;
    L.voda = Math.random() < 0.32; L.m.visible = true;
    L.zaklX = xsPodle[L.police][L.i];
    L.telo.position.set(L.zaklX, sek.zaklY + POLICE_Y[L.police] + L.typ.h/2, POLICE_Z + rand(-16, 16));

    L.telo.velocity.setZero(); L.telo.angularVelocity.setZero();
    L.telo.wakeUp();
  }
}

let skore = 0;

// ---- život ----------------------------------------------------------------
// Zatím JEN UKAZATEL: nic ho neubírá, protože hráč ještě nemá jak přijít
// k újmě. Je schválně vedený jako podíl 0..1, ne jako počet srdcí — na počet
// se dá kdykoli přejít krokováním, obráceně by se plynulý pruh musel předělat.
let zivot = 1;

}
function uberZivot(v){ nastavZivot(zivot - v); }

// Zásoba vody — druhý ukazatel, zatím taky jen kresba. Vedená stejně jako
// život (podíl 0..1), aby se oba daly obsluhovat týmž způsobem, až budou mít
// co ukazovat: voda ubývá stříkáním a sbírá se, život bere újmu.
let voda = 1;
const vodaEl = document.querySelector('#vodaRoh .vypln');

// Spotřeba je na posuvníku, protože správnou hodnotu pozná jedině hraní:
// je to poměr mezi tím, jak dlouho se stříká na kachničku, a kolik vody
// vydá lahev. Nula = nekonečná voda (na ladění všeho ostatního).
const SPOTREBA_VODY = () => +document.getElementById('spot3').value/100;
// Pod touhle hladinou začne proud slábnout tlakem. Ne skokem u nuly:
// zkracující se čůrek je jediné varování, které hráč uvidí, aniž by musel
// spustit oči z terčů.
// S 22 % ale proud dotékal DLOUHO — čtvrtina nádrže se odehrála v pomalu
// slábnoucím čůrku a hra v té době už byla jen dojezd. Slábnutí patří na
// poslední procenta: se 6 % a spotřebou 2 %/s to jsou tři vteřiny.
const TLAK_OD = 0.06;
// Konec hry se NEVÁŽE NA HLADINU, ale na dojetí zatmívání (viz krokTmy) —
// to je jediné místo, kde se rozhoduje, že je dohráno.

// ---- konec hry -------------------------------------------------------------
// Dojde-li voda, je konec. Hlídá se to na jednom místě v hlavní smyčce, ne
// v obsluze stříkání — voda může dojít i doběhem už vypuštěného proudu.
let konec = false;
function hlidejKonec(){
  // Konec padá až na konci zatmívání, ne na hladině vody. Zatmívání totiž
  // začíná ve chvíli, kdy proud UŽ NEMÁ ŠANCI na nic dosáhnout — od té chvíle
  // je to dojezd a nemá cenu ho protahovat.
  if(konec || umira < TMA_DOBA) return;
  konec = true;
  strika = false;
  kriz.classList.add('pryc');
  nastavVodu(0);            // zbytek pod prahem dorovnat, ať pruh sedí s hláškou
  document.getElementById('konecRoh').hidden = false;
}
// ZTMAVENÍ PŘI ZTRÁTĚ TLAKU. Řídí se hladinou vody, ne stříkáním — sucho je
// stav, ne akce, a hráč o něm má vědět i v pauze mezi proudy. Náběh se
// nedělá CSS přechodem, protože hodnota se přepisuje každý snímek a přechod
// by za ní jen zaostával; místo toho se skutečné krytí přitahuje k cíli,
// což plynule funguje v obou směrech (i při doplnění z lahve).
// Práh, pod kterým se hlásí docházející voda. Je hodně nad tlakovým prahem
// (6 %) schválně: varování má přijít v době, kdy se s tím ještě dá něco
// dělat, kdežto ztráta tlaku už je jen odpočet.
const VODA_MALO = 0.25;
let maloHlaseno = false;
const vodaMaloEl = document.getElementById('vodaMalo');
const vodaRohEl = document.getElementById('vodaRoh');
function hlidejMaloVody(){
  const malo = voda > 0 && voda <= VODA_MALO && !konec;
  vodaRohEl.classList.toggle('malo', malo);
  if(malo && !maloHlaseno){
    maloHlaseno = true;
    vodaMaloEl.classList.add('vidno');
    setTimeout(() => vodaMaloEl.classList.remove('vidno'), 1600);
  }
  // Doplnil-li si hráč zpátky, smí ho hra varovat znovu.
  if(!malo && voda > VODA_MALO*1.2) maloHlaseno = false;
  if(konec) vodaMaloEl.classList.remove('vidno');
}

const TMA_MAX = 0.5;
const TMA_OD = 0.02;      // pod tím už proud nedosáhne ani na nejbližší polici
const TMA_DOBA = 1.1;     // jak dlouho tma najíždí; na jejím konci je konec hry
let tma = 0;
let umira = 0;            // 0 = ještě se neumírá, jinak čas od spuštění tmy
const tmaEl = document.getElementById('tma');
function krokTmy(dt){
  // ZATMÍVÁNÍ JE JEDNOSMĚRNÉ A SPOUŠTÍ SE, AŽ KDYŽ JE PROUD K NIČEMU.
  // Dřív se řídilo hladinou vody, takže se stalo tohle: obraz začal tmavnout,
  // proud ještě dosáhl na lahev, hladina povyskočila a zatmívání se zrušilo.
  // Tma má být bod, ze kterého není návratu — proto se pod prahem TMA_OD
  // jednou spustí a odtud už jen běží čas.
  //
  // Práh 2 % je vybraný tak, aby proud opravdu neměl šanci: síla trysky je
  // pak 2/6 = 0,33, rychlost tedy 0,30 + 0,70·0,33 = 0,53 běžné — a protože
  // dostřik roste s DRUHOU MOCNINOU rychlosti, je z doletu 0,28. To nedosáhne
  // ani na nejbližší polici.
  if(!umira && voda <= TMA_OD && !konec) umira = 1e-6;
  if(umira) umira += dt;
  const cil = konec ? TMA_MAX : Math.min(1, umira/TMA_DOBA)*TMA_MAX;
  tma += (cil - tma)*Math.min(1, dt*5);
  if(tma < 0.002) tma = 0;
  tmaEl.style.opacity = tma.toFixed(3);
}

// Mince. Zatím jen počítadlo bez utrácení — jedna za sestřelenou kachničku,
// jedna za rozbitou lahev. Až bude za co utrácet, změní se sazba tady.
let mince = 0;
const minceEl = document.getElementById('minceCislo');

  mince += n;
  minceEl.textContent = mince;
}

// LET MINCÍ z mrtvé kachničky rovnou do pruhu s penězi.
//
// Po přímce a v jedné velikosti to vypadalo placatě, jako by se ikonka
// posouvala po skle. Prostorový dojem dělají dvě věci: OBLOUK (mince
// vyskočí a spadne do cíle) a MĚŘÍTKO, které nejdřív povyroste a u cíle se
// zase scvrkne — tak se chová věc, co letí k divákovi a pak od něj pryč.
//
// Animuje se po snímcích, ne CSS přechodem: přechod umí jen úsečku mezi
// dvěma stavy, kdežto oblouk potřebuje hodnotu v každém snímku.
// Připisují se AŽ PŘI DOLETU, po jedné — číslo v pruhu tak naskakuje
// v rytmu přilétajících mincí, ne skokem dopředu.
// CEKANI = jak dlouho mince levituje nad mrtvou kachničkou, než odletí.
// Bez téhle pauzy vyletěla ve stejném snímku, ve kterém kachnička padla, a
// splynula s peřím a korunkou — hráč viděl jen „něco cvrnklo do rohu".
// Půl vteřiny stačí, aby si jich všiml a spočítal je.
const MINCE_DOBA = 0.62, MINCE_ODSTUP = 0.075, MINCE_CEKANI = 0.55;
const MINCE_NASKOK = 0.13;           // jak rychle se mince vynoří
const MINCE_HOUP_A = 5, MINCE_HOUP_W = 5.2;   // houpání při levitaci
const letici = [];
const _promitnuto = new THREE.Vector3();
const _odkud = { x: 0, y: 0 };
function naObrazovku(x, y, z, out){
  _promitnuto.set(x, y, z).project(camera);
  out.x = ( _promitnuto.x*0.5 + 0.5)*innerWidth;
  out.y = (-_promitnuto.y*0.5 + 0.5)*innerHeight;
}

// Mince i vodní kapka letí stejnou dráhou do svého pruhu, liší se jen tím,
// co se klonuje, kam se letí a co se připíše při doletu. Tvarová pružnost je
// navíc jen u vody — mince je kus kovu, ta se deformovat nemá.
const LETY = {
  mince: { sablona: '#minceRoh .mince', cil: '#minceRoh .mince',
           trida: 'letMince', pruzna: false, dorazil: () => pripisMinci(1) },
  voda:  { sablona: '#vodaRoh .kapka',  cil: '#vodaRoh .kapka',
           trida: 'letVoda',  pruzna: true,  dorazil: () => nastavVodu(voda + VODA_ZA_KAPKU) },
};
// Kolik zásoby přinese jedna kapka z lahve. Lahve mají jen PŘILEPŠOVAT, ne
// být hlavním zdrojem — od toho budou truhly s pořádnou dávkou. S desetinou
// pokryla lahev skoro dvě vteřiny stříkání a zásobník se sám držel nahoře.
const VODA_ZA_KAPKU = 0.04;

function letMinci(pocet, wx, wy, wz){ letPredmet('mince', pocet, wx, wy, wz); }
function letVody(pocet, wx, wy, wz){ letPredmet('voda', pocet, wx, wy, wz); }

function letPredmet(typ, pocet, wx, wy, wz){
  if(pocet <= 0) return;
  const def = LETY[typ];
  const sablona = document.querySelector(def.sablona);
  const cil = document.querySelector(def.cil).getBoundingClientRect();
  naObrazovku(wx, wy, wz, _odkud);
  for(let i=0;i<pocet;i++){
    const el = sablona.cloneNode(true);
    el.removeAttribute('class');
    el.classList.add(def.trida);
    document.body.appendChild(el);
    // Všechny mince NASKOČÍ NARÁZ nad mrtvou kachničkou a chvíli tam levitují;
    // teprve odlet je rozestupem rozstřídaný, aby nesplynuly v jednu. Kdyby se
    // rozestup dal už na naskočení, hráč by nevěděl, kolik jich vlastně padlo —
    // viděl by jen mince odlétat po jedné.
    letici.push({ el, typ, pruzna: def.pruzna, dorazil: def.dorazil,
      t: 0, odlet: MINCE_CEKANI + i*MINCE_ODSTUP,
      faze: rand(0, Math.PI*2),
      x0: _odkud.x + rand(-16, 16), y0: _odkud.y + rand(-12, 12),
      x1: (cil.left + cil.right)/2, y1: (cil.top + cil.bottom)/2,
      vyska: rand(60, 120), px: 0, py: 0 });
  }
}

function krokLetMinci(dt){
  for(let i=letici.length-1; i>=0; i--){
    const m = letici[i];
    m.t += dt;
    const naskok = Math.min(1, m.t/MINCE_NASKOK);
    // Houpání běží pořád ze stejné fáze, takže při odletu nepřeskočí; během
    // letu se jen utlumí k nule podle `e`.
    const houp = Math.sin(m.t*MINCE_HOUP_W + m.faze)*MINCE_HOUP_A - 10*naskok;

    // 1) LEVITACE nad mrtvou kachničkou
    if(m.t < m.odlet){
      const s = (0.25 + 0.75*naskok)*(1 + 0.05*Math.sin(m.t*MINCE_HOUP_W + m.faze));
      m.el.style.transform =
        `translate(${m.x0.toFixed(1)}px, ${(m.y0 + houp).toFixed(1)}px) ` +
        `translate(-50%,-50%) scale(${s.toFixed(3)})`;
      // Poslední poloha se musí pamatovat i při levitaci, jinak by první
      // snímek letu spočítal rychlost z nuly na celou dráhu a kapka by
      // vystřelila do nesmyslného protažení.
      m.px = m.x0; m.py = m.y0 + houp;
      continue;
    }

    // 2) LET do pruhu s penězi
    const u = Math.min(1, (m.t - m.odlet)/MINCE_DOBA);
    const e = u*u*(3 - 2*u);                       // klidný rozjezd i dojezd
    const x = m.x0 + (m.x1 - m.x0)*e;
    const y = m.y0 + (m.y1 - m.y0)*e - Math.sin(Math.PI*e)*m.vyska + (1 - e)*houp;
    const s = (0.7 + Math.sin(Math.PI*u)*0.55) * (1 - 0.32*u);
    // TVAR PODLE POHYBU (jen voda). Kapka se natáhne po směru letu a zúží
    // napříč — čím rychleji letí, tím protáhlejší je. Bez toho je to jen
    // ikonka, co se veze po křivce; s tím to čte jako kus tekutiny.
    // Směr se bere z posunu MEZI SNÍMKY, ne z derivace křivky: zahrnuje tím
    // i houpání a zpomalení u cíle, tedy přesně to, co je vidět.
    let tvar = `scale(${s.toFixed(3)})`;
    if(m.pruzna){
      const vx = x - m.px, vy = y - m.py;
      const rych = Math.hypot(vx, vy)/Math.max(dt, 1e-4);      // px za sekundu
      const nat = Math.min(1, rych/1400);
      // špička kapky míří nahoru, proto +90°
      const uhel = Math.atan2(vy, vx)*180/Math.PI + 90;
      tvar = `rotate(${uhel.toFixed(1)}deg) ` +
             `scale(${(s*(1 - 0.30*nat)).toFixed(3)}, ${(s*(1 + 0.55*nat)).toFixed(3)})`;
    }
    m.px = x; m.py = y;
    m.el.style.transform =
      `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%,-50%) ${tvar}`;
    if(u > 0.88) m.el.style.opacity = ((1 - u)/0.12).toFixed(2);
    if(u >= 1){ m.el.remove(); letici.splice(i, 1); m.dorazil(); }
  }
}

const _q = new THREE.Quaternion(), _v = new THREE.Vector3();

function zasahyLahvi(dt){
  world.step(1/60, dt, 3);

  for(const L of lahve){
    // ROZBITÁ LAHEV SE UŽ NEVRACÍ. Dřív se po 2,2 s postavila zpátky na
    // původní místo, což znamenalo, že hráči doprostřed rozstřílené police
    // z ničeho nic naskočila nová lahev — přesně ten druh „objevilo se to
    // odnikud", který ve hře nemá co dělat. Nové sklo přijíždí jen s novým
    // patrem: `prestavLahve` při přejezdu sekce vrátí `mrtva` na nulu
    // a rozestaví police znovu.
    // `mrtva` je od téhle chvíle jen příznak, ne odpočet.
    if(L.mrtva > 0) continue;
    // mesh následuje těleso; posun o půl výšky kvůli počátku modelu ve spodku
    _q.set(L.telo.quaternion.x, L.telo.quaternion.y, L.telo.quaternion.z, L.telo.quaternion.w);
    L.m.quaternion.copy(_q);
    _v.set(0, -L.typ.h/2, 0).applyQuaternion(_q);
    L.m.position.set(L.telo.position.x + _v.x, L.telo.position.y + _v.y, L.telo.position.z + _v.z);

    // Rozbití o zem. Nad přízemím lahev propadne z obrazu — body se počítají
    // pořád (spadla z police), ale střepy se nekreslí, byly by mimo záběr.
    if(L.telo.position.y < podlahaY + 14){
      if(maPodlahu){
        rozprsk(L.m.position, new THREE.Vector3(0,1,0), new THREE.Vector3(0, 420, 0), 16);
        krouzek(L.m.position.x, 1.5, L.m.position.z, 'up', 40);
      }
      L.m.visible = false; L.mrtva = 1; pripisSkore(100);   // 1 = příznak „je pryč"
      L.telo.position.set(0, -4000, 0);       // uklidit mimo scénu
      L.telo.velocity.setZero(); L.telo.angularVelocity.setZero();
      continue;
    }

    // zásah proudem = skutečný impulz v bodě dopadu
    for(const u of uzly){
      const dx = u.p.x - L.telo.position.x;
      const dy = u.p.y - L.telo.position.y;
      const dz = u.p.z - L.telo.position.z;
      if(dx*dx + dz*dz > 44*44 || Math.abs(dy) > L.typ.h*0.6) continue;
      // Impulz musí odpovídat měřítku scény: hmotnost 1,4 a gravitace 1400
      // znamenají, že impulz 0,9 změní rychlost o 0,6 jednotky za sekundu —
      // tedy o nic. Laditelné posuvníkem, ať se dá najít, co se chová dobře.
      const smer = new CANNON.Vec3(u.v.x, u.v.y*0.25, u.v.z).unit();
      const bod = new CANNON.Vec3(u.p.x, u.p.y, u.p.z);
      L.telo.wakeUp();
      L.telo.applyImpulse(smer.scale(SILA_ZASAHU()), bod);
      // PRVNÍ ZÁSAH LAHVE NĚCO DÁ — ale VŽDY JEN JEDNU VĚC. Buď je v lahvi
      // voda a ta letí do zásobníku, nebo je prázdná a je za ni bod. Nikdy
      // obojí: jinak by lahev s vodou byla dvojnásobná odměna a hráč by
      // neměl důvod řešit, do které stříká.
      // Váže se to na PRVNÍ zásah, protože odměna patří za trefu, ne za
      // polévání. „+1" vyskočí nad lahví, tedy tam, kde se to stalo; těleso
      // má počátek ve STŘEDU, takže se přičítá půlka výšky a kousek navrch.
      if(!L.trefena){
        L.trefena = true;
        const stred = L.telo.position.y + L.typ.h*0.5;
        if(L.voda){
          L.voda = false;
          letVody(1, L.telo.position.x, stred, L.telo.position.z);
        } else {
          pripisSkore(1);
          pustPopup(L.telo.position.x, stred + 18, L.telo.position.z, 1, 'skoreMale');
        }
      }
      if(Math.random() < 0.4){
        const n = new THREE.Vector3(dx, 0, dz).normalize();
        rozprsk(u.p, n, u.v, 3 + (Math.random()*3|0));
      }
      break;
    }
  }
}

// se při pohybu ztratí a proud pak vypadá staticky. Pruhy jsou různě široké
// a nepravidelně rozmístěné, aby se vzor při opakování nepráskal do očí.
// Plátno textury vody je JEDNO a jen se překresluje. Barva vody je

const _cVoda = document.createElement('canvas');
_cVoda.width = 128; _cVoda.height = 8;

function kresliVodu(barva){
  // Textura je ŠIROKÁ a nízká: u TubeGeometry jde 'u' (osa X textury) podél
  // trubice, takže pruh musí být SVISLÝ — pak se na trubici namapuje jako
  // prstenec kolmý na tok. S vodorovnými pruhy to vypadalo jako pruhovaná
  // hadice, protože každý pruh běžel po délce.
  const c = _cVoda;
  const g = c.getContext('2d');
  g.fillStyle = barva;
  g.fillRect(0, 0, 128, 8);
  // ŠIROKÉ BÍLÉ SHLUKY — to, čím se voda kreslí v anime a kresleném filmu:
  // kromě tenkých linek po ní občas putuje výrazná bílá část, která proud
  // „doplňuje". Jsou jen dva na celou výšku textury, takže projdou zřídka
  // a jsou tím pádem vidět jako událost, ne jako vzor.
  // OSTRÉ okraje: plochý bílý střed a strmý spád jen na krajních 15 %.
  // S měkkým gradientem přes celou šířku se shluk rozmazal do mlhy a ztratil
  // se v barvě proudu — ostrá hrana je to, co ho dělá čitelným.
  for(const [x, w] of [[30, 12]]){
    const grd = g.createLinearGradient(x-w, 0, x+w, 0);
    grd.addColorStop(0.00, 'rgba(255,255,255,0)');
    grd.addColorStop(0.15, 'rgba(255,255,255,1)');
    grd.addColorStop(0.85, 'rgba(255,255,255,1)');
    grd.addColorStop(1.00, 'rgba(255,255,255,0)');
    g.fillStyle = grd;
    g.fillRect(x-w, 0, w*2, 8);
  }
  // tenké linky mezi nimi, aby proud nebyl jen dva bloky
  const pruhy = [[64,0.45],[76,0.3],[100,0.5],[112,0.35]];
  for(const [x, a] of pruhy){
    const w = 2 + (a > 0.7 ? 2 : 1);
    const grd = g.createLinearGradient(x-w, 0, x+w, 0);
    grd.addColorStop(0.00, 'rgba(255,255,255,0)');
    grd.addColorStop(0.22, 'rgba(238,250,255,' + a + ')');
    grd.addColorStop(0.78, 'rgba(238,250,255,' + a + ')');
    grd.addColorStop(1.00, 'rgba(255,255,255,0)');
    g.fillStyle = grd;
    g.fillRect(x-w, 0, w*2, 8);
  }
}

// Když hráč mírí jinam, staré kapky pokračují tam, kam byly vypuštěny, a proud
// se za letu ohne a odtrhne. Proto se tu z ústí vypouštějí uzly, které si dál
// letí samy, a trubice se generuje AŽ Z NICH.
const G = 1500;

// nejdřív vyjede tenký pramínek a teprve pak plný proud; při puštění naopak

// GENERACE odděluje jednotlivá stisknutí. Bez ní by se při novém stisknutí
// natáhla trubice od ústí až ke starému, ještě letícímu konci — proud by se

// Počáteční rychlost tak, aby uzel doletěl na cíl — stejný výpočet jako dřív,
// jen se teď použije JEDNOU při vypuštění, ne na celou dráhu každý snímek.
function rychlostNaCil(cilX, cilY, cilZ){
  const dx = cilX - USTI.x, dy = cilY - USTI.y, dz = cilZ - USTI.z;
  const vodorovne = Math.hypot(dx, dz) || 1;
  // Vyšší rychlost = kratší doba letu = plošší oblouk. Na daleké terče se
  // s pomalým proudem muselo mířit přes vysokou parabolu, což je špatně
  // odhadnutelné.
  const t = vodorovne / (+document.getElementById('sila').value);
  return new THREE.Vector3(dx/t, (dy + 0.5*G*t*t)/t, dz/t);
}

// Průsečík úsečky s kvádrem (slab metoda). Vrací poměr na úsečce, osu vstupní

// všechny mine. Kvádrů je pět (tři police + stěna), takže na to stačí lineární
// průchod — mřížka by se tu nezaplatila.
const _pred = new THREE.Vector3();
const _bod  = new THREE.Vector3();
const _nor  = new THREE.Vector3();
// pustKapku() čte {p, v} — půjčíme mu pořád tentýž objekt, ať se v herní
// smyčce nealokuje (hodnoty si okamžitě opíše do svého poolu)
const _kapkaU = { p: new THREE.Vector3(), v: new THREE.Vector3() };
const _p3 = [0,0,0], _d3 = [0,0,0];

function narazDoDreva(a, b){
  _p3[0] = a.x;      _p3[1] = a.y;      _p3[2] = a.z;
  _d3[0] = b.x - a.x; _d3[1] = b.y - a.y; _d3[2] = b.z - a.z;
  let nejT = 2, nejOsa = -1, nejZnam = 0, nejKv = null;
  for(const kv of DREVO){
    let t0 = 0, t1 = 1, osa = -1, znam = 0, mimo = false;
    for(let i=0;i<3;i++){
      if(Math.abs(_d3[i]) < 1e-9){
        if(_p3[i] < kv.min[i] || _p3[i] > kv.max[i]){ mimo = true; break; }
        continue;
      }
      let ta = (kv.min[i]-_p3[i])/_d3[i], tb = (kv.max[i]-_p3[i])/_d3[i], s = -1;
      if(ta > tb){ const q = ta; ta = tb; tb = q; s = 1; }
      if(ta > t0){ t0 = ta; osa = i; znam = s; }
      if(tb < t1) t1 = tb;
      if(t0 > t1){ mimo = true; break; }
    }
    if(mimo || osa < 0) continue;      // osa < 0 = úsečka začínala uvnitř
    if(t0 < nejT){ nejT = t0; nejOsa = osa; nejZnam = znam; nejKv = kv; }
  }
  return nejOsa < 0 ? null : { t: nejT, osa: nejOsa, znam: nejZnam, kv: nejKv };
}

// ---- mokré fleky -----------------------------------------------------------
// Stopa po vodě na svislých plochách. Bez ní bylo po deseti vteřinách polévání
// dřevo úplně stejné jako na začátku a proud nezanechával nic.

//      na každý flek — čtyřicet meshů by znamenalo čtyřicet draw callů, což je
//      přesně to, co na telefonu bolí. Cenou je, že se bod natáčí za kamerou,
//      takže fleky patří JEN NA SVISLÉ plochy (stěna, čelo police), kde to
//      splývá s rovinou. Na desku shora by ležel plakát ve vzduchu.
//   2. SLÉVÁNÍ. Nový zásah blízko živého fleku ten flek ZVĚTŠÍ a znovu namočí
//      místo aby přidal další. Proud vyrábí 90 uzlů za vteřinu — bez slévání
//      by pool zmizel za půl vteřiny a ze stěny by byl korálkový přehoz.
//   3. NÁHODNÝ ÚHEL v shaderu. Textura je jedna, takže bez natočení by byl
//      všude přesně týž flek a bylo by to vidět jako razítko.
const FLEKU_MAX = 40;

const flekVel = new Float32Array(FLEKU_MAX);

const fleky = [];
for(let i=0;i<FLEKU_MAX;i++) fleky.push({ ziva:false, x:0,y:0,z:0, mokro:0, uhel:0 });

// Nepravidelná MĚKKÁ skvrna. Napoprvé to byly malé kruhy s poměrně ostrým
// spádem a výsledek vypadal jako zásahy od kulometu — samostatné puntíky
// v řadě. Voda nedělá puntíky: nechává rozpité mokro s neurčitým okrajem.
// Proto velké plátno (128), krajní kruhy jen v desetinách krytí a spád
// natažený až k nule.
function texturaFleku(){
  const c = document.createElement('canvas');
  c.width = c.height = 128;

  const kruhy = [[64,64,46],[46,52,34],[82,50,32],[52,82,33],[80,80,30],
                 [64,40,26],[38,70,24],[90,66,25]];
  for(const [x,y,r] of kruhy){
    const gr = g.createRadialGradient(x, y, r*0.05, x, y, r);
    gr.addColorStop(0,    'rgba(255,255,255,0.95)');
    gr.addColorStop(0.55, 'rgba(255,255,255,0.86)');
    gr.addColorStop(0.85, 'rgba(255,255,255,0.40)');
    gr.addColorStop(1,    'rgba(255,255,255,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.generateMipmaps = false; t.minFilter = THREE.LinearFilter;
  return t;
}
const texFlek = texturaFleku();
const flekGeo = new THREE.BufferGeometry();
flekGeo.setAttribute('position', new THREE.BufferAttribute(flekPos, 3));
flekGeo.setAttribute('velikost', new THREE.BufferAttribute(flekVel, 1));
flekGeo.setAttribute('kryti',    new THREE.BufferAttribute(flekKryti, 1));
flekGeo.setAttribute('uhel',     new THREE.BufferAttribute(flekUhel, 1));

  transparent: true, depthWrite: false,

    attribute float velikost;
    attribute float kryti;
    attribute float uhel;
    uniform float mer;
    varying float vKryti;
    varying float vUhel;
    void main(){
      vKryti = kryti; vUhel = uhel;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);

      vec2 q = vec2(p.x*c - p.y*s, p.x*s + p.y*c) + 0.5;
      float a = texture2D(mapa, q).a * vKryti;
      if(a < 0.01) discard;

});
const flekMesh = new THREE.Points(flekGeo, matFlek);

const FLEK_SLITI = 95;          // jak blízko se zásah přilepí ke stávajícímu fleku
const FLEK_SCHNUTI = 5.0;       // z plného mokra do sucha
const FLEK_ZASAH = 0.014;       // kolik mokra přidá jeden uzel proudu
// PROČ JE STROP JEN 190. Flek leží na zadní stěně, jenže deska police stojí
// 135 jednotek PŘED ní — a co je před ním, to ho zakryje. Velký flek se pak
// o desku ořízne rovnou vodorovnou hranou a vypadá to, že se nedokreslil.
// Mezera mezi policemi je 185, takže s tímhle stropem se flek mezi ně vejde
// a k oříznutí dojde nanejvýš okrajem. Plochu dělá SLÉVÁNÍ, ne jeden obr.
const FLEK_MIN = 70, FLEK_MAX = 190;
const FLEK_ALFA = 0.34;
// Kolem kachničky se flek nedělá. Voda se o ni zastaví, takže na stěnu za ní
// nic nedoletí — a hlavně: flek je velký kruh na zdi, takže by kachničce
// vykoukl kolem těla a vypadalo by to, že stojí v kaluži na skle.
// POZOR: `KACH_R` se deklaruje až o tisíc řádků níž, takže se NESMÍ použít
// v konstantě na téhle úrovni — const v dočasné mrtvé zóně vyhodí
// ReferenceError při načítání modulu a hra se ani nespustí. Uvnitř funkce
// se vyhodnocuje až za běhu, tam je to v pořádku.
function blizkoKachny(x, y){
  const mez = KACH_R*1.35;
  for(const k of kachny){
    if(k.stav === 'volna') continue;
    const dx = k.skup.position.x - x, dy = (k.zaklY + k.stred) - y;
    if(Math.abs(dx) < mez && Math.abs(dy) < mez) return true;
  }
  return false;
}

function mokryFlek(x, y, z){
  // Během přejezdu se fleky dělat SMÍ — jedou dolů s barem jako všechno
  // ostatní a na konci přejezdu se stejně setřou. Dřív se tu vznik zakazoval,
  // protože fleky zůstávaly stát na místě a v novém patře se vynořily jako
  // cizí skvrny; to řeší posun v krokPostupu.
  if(blizkoKachny(x, y)) return;
  // 1) slít se sousedem — přibude mu mokro, žádný nový flek nevzniká
  for(const f of fleky){
    if(!f.ziva) continue;
    const dx = f.x - x, dy = f.y - y, dz = f.z - z;
    if(dx*dx + dy*dy + dz*dz < FLEK_SLITI*FLEK_SLITI){
      f.mokro = Math.min(1, f.mokro + FLEK_ZASAH);
      return;
    }
  }
  // 2) nový; když není místo, přepíše se ten nejsušší
  let cil = fleky.find(f => !f.ziva);
  if(!cil){
    cil = fleky[0];
    for(const f of fleky) if(f.mokro < cil.mokro) cil = f;
  }
  cil.ziva = true;
  cil.x = x; cil.y = y; cil.z = z;
  // Začíná sotva znatelně: hned po prvním uzlu tam nemá být louže.
  cil.mokro = 0.10;
  cil.uhel = rand(0, Math.PI*2);
}

// ---- odkapávání z polic ----------------------------------------------------
// Voda, která spadne na desku, z ní musí někam odtéct — jinak police vypadá,
// že se jí zásah netýkal. Kapky se pouštějí ze SPODNÍ PŘEDNÍ HRANY desky,
// tedy odtud, kam voda po desce steče a odkud v reálu odkapává.
//
// Nejde o částice na místě dopadu: mezi zásahem a kapkou má být prodleva
// (voda se musí posbírat), takže deska si drží „kolik toho ještě odkápne"
// a pouští to po jedné s odstupem. Zdroje se navíc SLÉVAJÍ po ose x, jinak
// by proud při 90 uzlech za vteřinu založil zdroj na každý zásah a z police
// by crčel vodopád.
const KAPACU_MAX = 16;
const kapace = [];
for(let i=0;i<KAPACU_MAX;i++) kapace.push({ ziva:false, x:0, y:0, z:0, zbyva:0, cas:0 });
const KAPAC_SLITI = 70;        // jak blízko po x se zásah přilepí ke zdroji
const KAPAC_ZBYVA_MAX = 12;    // strop, aby dlouhé polévání nedělalo nekonečno
const KAPAC_PRIDA = 0.10;      // kolik kapek přidá jeden zásah

function namocPolici(x, y, z){
  for(const k of kapace){
    if(!k.ziva) continue;
    if(Math.abs(k.x - x) < KAPAC_SLITI && Math.abs(k.y - y) < 30){
      k.zbyva = Math.min(KAPAC_ZBYVA_MAX, k.zbyva + KAPAC_PRIDA);
      return;
    }
  }
  let c = kapace.find(k => !k.ziva);
  if(!c){                                   // přepsat ten nejvysychlejší
    c = kapace[0];
    for(const k of kapace) if(k.zbyva < c.zbyva) c = k;
  }
  c.ziva = true; c.x = x; c.y = y; c.z = z;
  c.zbyva = 1; c.cas = rand(0.25, 0.7);     // první kapka až za chvíli
}

// Kapka se odlepí skoro bez rychlosti a zbytek udělá gravitace — proto to
// čte jako odkápnutí, ne jako výstřel.
function odkapni(k){
  _kapkaU.p.set(k.x + rand(-16, 16), k.y - 2, k.z);
  _kapkaU.v.set(0, -14, 0);
  pustKapku(_kapkaU, 7, 1);
}

function krokKapacu(dt){
  for(const k of kapace){
    if(!k.ziva) continue;
    k.cas -= dt;
    if(k.cas > 0) continue;
    // KOLIK VODY, TOLIK KAPEK. Odstup se řídí tím, jak je police mokrá:
    // sotva potřísněná odkápne jednou za vteřinu, pořádně politá čtyřikrát
    // častěji. Pevný odstup 0,4–1,2 s znamenal, že dlouhé polévání vypadalo
    // úplně stejně jako mimoletmý zásah — a to je přesně ta informace,
    // která hráči má z police kapat zpátky.
    const podil = Math.min(1, k.zbyva/KAPAC_ZBYVA_MAX);
    k.cas = (0.16 + 0.92*(1 - podil)) * rand(0.8, 1.3);
    k.zbyva -= 1;
    odkapni(k);
    // Z hodně mokré police padají chvílemi dvě naráz. Samotné zrychlení
    // odstupu se totiž u horní hranice přestane číst — oko sleduje počet
    // kapek ve vzduchu, ne jejich takt.
    if(podil > 0.65 && Math.random() < 0.5 && k.zbyva > 0){ k.zbyva -= 0.5; odkapni(k); }
    if(k.zbyva <= 0) k.ziva = false;
  }
}

// Setřít všechno naráz. Volá se při přejezdu na nové patro.
function smazFleky(){
  for(const f of fleky) f.ziva = false;
  flekGeo.setDrawRange(0, 0);
}

// Setřít fleky pod nově nasazenou kachničkou. `blizkoKachny` hlídá jen opačný
// směr — že flek nevznikne u stojící kachničky. Kachnička se ale objeví
// kdykoli, klidně přesně na mokrém místě, a pak jí to kouká kolem těla.
// Naměřeno: bez tohohle klesl odstup na 54 jednotek proti prahu 84.
function smazFlekyUKachny(x, y){
  const mez = KACH_R*1.35;
  let n = 0;
  for(const f of fleky){
    if(!f.ziva) continue;
    if(Math.abs(f.x - x) < mez && Math.abs(f.y - y) < mez){ f.ziva = false; n++; }
  }
  return n;
}

// VŠECHNO ŘÍDÍ JEDNO ČÍSLO — `mokro` (0..1). Zásah ho přidá, čas ubírá,
// a velikost i tmavost se z něj obě počítají. Tím je zaručeno, co uživatel
// chtěl: čím víc vody, tím větší A tmavší flek, a schne přesně opačně —
// couvá po téže křivce, po které narostl. Se dvěma nezávislými časovači
// (jeden na velikost, druhý na krytí) to nikdy nesedělo.
function krokFleku(dt){
  let n = 0;
  for(const f of fleky){
    if(!f.ziva) continue;
    f.mokro -= dt/FLEK_SCHNUTI;
    if(f.mokro <= 0){ f.ziva = false; continue; }
    // odmocnina: prvních pár kapek je znát víc než poslední, jinak by flek
    // dlouho nebyl vidět vůbec a pak by naskočil
    const m = Math.sqrt(f.mokro);
    flekPos[n*3] = f.x; flekPos[n*3+1] = f.y; flekPos[n*3+2] = f.z;
    flekVel[n] = FLEK_MIN + (FLEK_MAX - FLEK_MIN)*m;
    flekKryti[n] = FLEK_ALFA*m;
    flekUhel[n] = f.uhel;
    n++;
  }
  flekGeo.setDrawRange(0, n);
  flekGeo.attributes.position.needsUpdate = true;
  flekGeo.attributes.velikost.needsUpdate = true;
  flekGeo.attributes.kryti.needsUpdate = true;
  flekGeo.attributes.uhel.needsUpdate = true;
  return n;
}

// Zásah do dřeva vypadá stejně jako dopad na zem, jen se kroužek položí do
// roviny zasažené stěny — na desku shora, na čelo police a na zadní stěnu svisle.
function dopadNaDrevo(u, z){
  _bod.copy(_pred).lerp(u.p, z.t);
  _nor.set(z.osa === 0 ? z.znam : 0, z.osa === 1 ? z.znam : 0, z.osa === 2 ? z.znam : 0);
  _bod.addScaledVector(_nor, 1.5);     // odsadit od plochy, ať kroužek neproblikává
  // Prstenec jen u ČTVRTINY zásahů. Proud vyrábí 90 uzlů za vteřinu, takže
  // prstenec na každý z nich znamená čtyřicet kroužků naráz — plocha pak
  // vypadá jako terč, ne jako mokré místo. Rozstřik jde naopak z každého,
  // ten se má slévat.
  if(Math.random() < 0.14) krouzek(_bod.x, _bod.y, _bod.z, z.osa === 1 ? 'up' : 'celo', 20 + Math.random()*16);
  // Mokrá stopa JEN NA ZADNÍ STĚNĚ. Dvě podmínky, obě jsou potřeba:
  //   osa 2 = svislá plocha čelem ke kameře (na vodorovné desce by kruhový
  //     sprite ležel ve vzduchu, protože se natáčí za kamerou),
  //   _bod.z za rovinou polic = je to opravdu stěna, ne ČELO POLICE.
  // Ta druhá je ta podstatná: čelo police stojí 75 jednotek PŘED lahvemi,
  // takže flek na něm překryl lahve i sklenice stojící na polici — vypadalo
  // to, že mokro plave před nimi ve vzduchu.
  if(z.osa === 2 && _bod.z < POLICE_Z - 30) mokryFlek(_bod.x, _bod.y, _bod.z);
  // Namočená police pak odkapává. Deska je vysoká 18 jednotek, kdežto zadní
  // stěna je vysoká celá sekce — rozliší se to výškou kvádru, ne indexem.
  // Kapky pouštím ze spodní přední hrany, tedy `min[1]` a `max[2]`.
  if(z.kv && z.kv.max[1] - z.kv.min[1] < 40)
    namocPolici(_bod.x, z.kv.min[1], z.kv.max[2]);
  rozprsk(_bod, _nor, u.v, 3 + (Math.random()*3|0));
  // K mlze pár VELKÝCH kapek, co se od plochy odrazí. Sama mlha je u dopadu
  // málo — podlaha jich odjakživa pouští 3 až 6 a je to ono místo, kam se
  // hráč dívá. Odraz jde po ploše a trochu nahoru, ne zpátky proti proudu.
  if(Math.random() < 0.18){
    const v0 = u.v.length();
    _kapkaU.p.copy(_bod);
    _kapkaU.v.copy(u.v).addScaledVector(_nor, -u.v.dot(_nor)).normalize()   // po ploše
            .multiplyScalar(v0*(0.16 + Math.random()*0.16))
            .addScaledVector(_nor, v0*(0.06 + Math.random()*0.10));         // špetka od ní
    _kapkaU.v.y += 90 + Math.random()*160;
    pustKapku(_kapkaU);
  }
}

function krokProudu(dt, cil, strikaJe){
  // Posun uzlů po jejich vlastní dráze a hned na místě kolize. Uzel urazí za
  // snímek až 25 px, kdežto deska police je 18 px tenká — test na aktuální
  // poloze by proto většinu zásahů propásl tunelováním. Testuje se ÚSEČKA
  // z předchozí polohy do nové (slab metoda), stejně jako u rychlých těles.
  for(let i=uzly.length-1;i>=0;i--){
    const u = uzly[i];
    _pred.copy(u.p);
    u.t += dt;
    u.v.y -= G*dt;
    u.p.addScaledVector(u.v, dt);

    // Kachnička stojí PŘED policí, takže se testuje dřív než dřevo
    const kach = narazDoKachny(u.p);
    if(kach){ zasahKachny(kach, u); uzly.splice(i,1); continue; }

    const zasah = narazDoDreva(_pred, u.p);
    if(zasah){ dopadNaDrevo(u, zasah); uzly.splice(i,1); continue; }
    // dopad na podlahu — efekt a konec uzlu
    // Nad přízemím se voda nemá o co roztříštit — jen propadne z obrazu.
    if(u.p.y <= podlahaY + 4){
      if(maPodlahu) dopadNaZem(u);
      uzly.splice(i,1);
    }
  }
  while(uzly.length && uzly[0].t > ZIVOT) uzly.shift();

  // Občas se od proudu odtrhne kapka. Čím dál od ústí, tím spíš — voda na
  // doletu přestává držet pohromadě, takže se tříští právě tam.
  //
  // ALE pravděpodobnost nesmí viset na stáří uzlu CELÁ. Od chvíle, kdy proud
  // končí nárazem do dřeva, se uzly nedožijí ani poloviny životnosti (naměřeno:
  // max 0,40 s proti 0,93 s při střelbě do prázdna) a kapek kolem proudu zbyla
  // čtvrtina — 8 místo 30. Základ 0,55 drží kapky po celé délce, zbytek pořád
  // houstne k doletu.
  for(const u of uzly){
    // Rychlost i rozptyl jsou zpátky na původních hodnotách (0,85 a 260, tedy
