<!DOCTYPE html>
<html lang="cs">
<head>
  <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
  <title>Golden Ducks v48</title>
  <script type="text/javascript" src="./lib/gamee-js.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <link rel="stylesheet" href="./css/game.css?v=48">
</head>
<body onload="initGame()">
<canvas id="game-canvas"></canvas>
<div id="version-badge"><span class="game-name">Golden Ducks</span> <span class="ver-num">v48</span></div>
<div id="topbar">
  <span><span class="lbl">skóre </span><span id="score-val">0</span></span>
  <span><span class="lbl">čas </span><span id="time-val">60</span></span>
  <span id="water-wrap" title="zásoba vody"><span class="lbl">voda </span><span id="water-bar"><span id="water-fill"></span></span></span>
</div>
<button id="hud-toggle" aria-label="perf HUD">⚙</button>
<div id="perf-hud" hidden>
  <div class="pf-stats">
    <span>FPS: <b id="pf-fps">–</b></span>
    <span>min: <b id="pf-fpsmin">–</b></span>
    <span>ms/frame: <b id="pf-ms">–</b></span>
    <span>částic: <b id="pf-parts">0</b></span>
  </div>
  <label>max částic
    <div class="sl-row"><input type="range" id="sl-max" min="200" max="20000" step="100"><span class="sl-val" id="sl-max-val"></span></div>
  </label>
  <label>emise /s
    <div class="sl-row"><input type="range" id="sl-rate" min="50" max="3000" step="25"><span class="sl-val" id="sl-rate-val"></span></div>
  </label>
  <label>velikost
    <div class="sl-row"><input type="range" id="sl-size" min="1" max="10" step="0.5"><span class="sl-val" id="sl-size-val"></span></div>
  </label>
  <label>splash / zásah
    <div class="sl-row"><input type="range" id="sl-splash" min="0" max="30" step="1"><span class="sl-val" id="sl-splash-val"></span></div>
  </label>
  <label>citlivost míření
    <div class="sl-row"><input type="range" id="sl-gain" min="0.6" max="4" step="0.1"><span class="sl-val" id="sl-gain-val"></span></div>
  </label>
  <label>náběh trysky (s)
    <div class="sl-row"><input type="range" id="sl-ramp" min="0" max="1.5" step="0.05"><span class="sl-val" id="sl-ramp-val"></span></div>
  </label>
  <label>kapalina (částic)
    <div class="sl-row"><input type="range" id="sl-fluid" min="100" max="1600" step="50"><span class="sl-val" id="sl-fluid-val"></span></div>
  </label>
  <div class="cb-row">
    <label><input type="checkbox" id="cb-coll"> kolize</label>
    <label><input type="checkbox" id="cb-add"> glow</label>
    <label><input type="checkbox" id="cb-cartoon"> kreslený</label>
    <label><input type="checkbox" id="cb-auto"> auto-spray</label>
    <label><input type="checkbox" id="cb-rel"> rel. míření</label>
    <label><input type="checkbox" id="cb-special"> special mód</label>
  </div>
</div>
<div id="overlay" hidden>
  <div id="overlay-box">
    <h3 id="overlay-title">Konec kola</h3>
    <div class="ov-score-label">skóre</div>
    <div id="overlay-score">0</div>
    <p id="overlay-msg"></p>
    <button id="restart-btn">Hrát znovu</button>
  </div>
</div>
<script src="./js/fluid.js?v=48"></script>
<script src="./js/puzzle.js?v=48"></script>
<script src="./js/game.js?v=48"></script>
</body>
</html>
