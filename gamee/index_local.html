<!DOCTYPE html>
<html lang="cs">
<head>
  <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
  <title>Golden Ducks v97</title>
  <script type="text/javascript" src="./lib/gamee-js-stub.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <!-- Dev/Pages only: „Přidat na plochu" spustí hru fullscreen bez lišty prohlížeče.
       V prod index.html schválně není — Gamee iframe tyhle metas nepoužívá. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Golden Ducks">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0c1226">
  <link rel="stylesheet" href="./css/game.css">
</head>
<body onload="initGame()">
<canvas id="game-canvas"></canvas>
<div id="version-badge"><span class="game-name">Golden Ducks</span> <span class="ver-num">v97</span></div>
<div id="topbar">
  <span><span class="lbl">skóre </span><span id="score-val">0</span></span>
  <span><span class="lbl">čas </span><span id="time-val">60</span></span>
  <span id="water-wrap" title="zásoba vody"><span class="lbl">voda </span><span id="water-bar"><span id="water-fill"></span></span></span>
</div>
<button id="hud-toggle" aria-label="perf HUD">⚙</button>
<div id="perf-hud" hidden>
  <div class="pf-stats">
    <span>FPS: <b id="pf-fps">–</b></span>
    <span>min: <b id="pf-fpsmin">–</b></span>
    <span>ms/frame: <b id="pf-ms">–</b></span>
    <span>částic: <b id="pf-parts">0</b></span>
  </div>
  <label>max částic
    <div class="sl-row"><input type="range" id="sl-max" min="200" max="20000" step="100"><span class="sl-val" id="sl-max-val"></span></div>
  </label>
  <label>emise /s
    <div class="sl-row"><input type="range" id="sl-rate" min="50" max="3000" step="25"><span class="sl-val" id="sl-rate-val"></span></div>
  </label>
  <label>velikost
    <div class="sl-row"><input type="range" id="sl-size" min="1" max="10" step="0.5"><span class="sl-val" id="sl-size-val"></span></div>
  </label>
  <label>splash / zásah
    <div class="sl-row"><input type="range" id="sl-splash" min="0" max="30" step="1"><span class="sl-val" id="sl-splash-val"></span></div>
  </label>
  <label>citlivost míření
    <div class="sl-row"><input type="range" id="sl-gain" min="0.6" max="4" step="0.1"><span class="sl-val" id="sl-gain-val"></span></div>
  </label>
  <label>náběh trysky (s)
    <div class="sl-row"><input type="range" id="sl-ramp" min="0" max="1.5" step="0.05"><span class="sl-val" id="sl-ramp-val"></span></div>
  </label>
  <label>kapalina (částic)
    <div class="sl-row"><input type="range" id="sl-fluid" min="100" max="9000" step="100"><span class="sl-val" id="sl-fluid-val"></span></div>
  </label>
  <label>vzdálenost objektu
    <div class="sl-row"><input type="range" id="sl-objz" min="700" max="960" step="10"><span class="sl-val" id="sl-objz-val"></span></div>
  </label>
  <label>rychlost proudu (nižší = delší oblouk)
    <div class="sl-row"><input type="range" id="sl-jet" min="600" max="1800" step="50"><span class="sl-val" id="sl-jet-val"></span></div>
  </label>
  <label>napuštění válce (s přesného stříkání)
    <div class="sl-row"><input type="range" id="sl-fill" min="4" max="40" step="1"><span class="sl-val" id="sl-fill-val"></span></div>
  </label>
  <label>velikost kapek (px)
    <div class="sl-row"><input type="range" id="sl-drop" min="3" max="18" step="0.5"><span class="sl-val" id="sl-drop-val"></span></div>
  </label>
  <label>voda — jádro částice
    <div class="sl-row"><input type="range" id="sl-glpoint" min="5" max="18" step="0.5"><span class="sl-val" id="sl-glpoint-val"></span></div>
  </label>
  <label>voda — práh hladiny
    <div class="sl-row"><input type="range" id="sl-glthresh" min="0.12" max="0.60" step="0.01"><span class="sl-val" id="sl-glthresh-val"></span></div>
  </label>
  <label>voda — sytost
    <div class="sl-row"><input type="range" id="sl-gltint" min="0" max="1" step="0.05"><span class="sl-val" id="sl-gltint-val"></span></div>
  </label>
  <label>voda — bílá čepička
    <div class="sl-row"><input type="range" id="sl-glcap" min="0.02" max="0.60" step="0.02"><span class="sl-val" id="sl-glcap-val"></span></div>
  </label>
  <label>voda — barva
    <div class="sl-row"><input type="color" id="cl-water"><span class="sl-val" id="cl-water-val"></span></div>
  </label>
  <div class="cb-row">
    <label><input type="checkbox" id="cb-coll"> kolize</label>
    <label><input type="checkbox" id="cb-add"> glow</label>
    <label><input type="checkbox" id="cb-cartoon"> kreslený</label>
    <label><input type="checkbox" id="cb-auto"> auto-spray</label>
    <label><input type="checkbox" id="cb-rel"> rel. míření</label>
    <label><input type="checkbox" id="cb-special"> special mód</label>
    <label><input type="checkbox" id="cb-lf"> LiquidFun</label>
    <label><input type="checkbox" id="cb-gl"> shader voda</label>
  </div>
  <div class="hud-btns">
    <span class="hud-note">úroveň</span>
    <button data-level="1" type="button">1 · kachnička</button>
    <button data-level="2" type="button">2 · pyramida</button>
  </div>
  <div class="hud-btns">
    <button id="tune-reset" type="button">↺ výchozí hodnoty</button>
    <span class="hud-note">nastavení se ukládá samo</span>
  </div>
</div>
<div id="start-overlay" hidden>
  <div id="start-box">
    <h3>Golden Ducks</h3>
    <p class="start-hint">vyber mód</p>
    <div class="mode-grid">
      <button class="mode-btn" data-mode="ducks">
        <span class="mb-icon">🎯</span>
        <span class="mb-name">Střelnice</span>
        <span class="mb-desc">Sestřel co nejvíc kachniček, než dojde voda a čas</span>
      </button>
      <button class="mode-btn" data-mode="puzzle">
        <span class="mb-icon">🧩</span>
        <span class="mb-name">Puzzle</span>
        <span class="mb-desc">Napusť válec vodou a vyplav kachničku ven</span>
      </button>
    </div>
  </div>
</div>
<div id="overlay" hidden>
  <div id="overlay-box">
    <h3 id="overlay-title">Konec kola</h3>
    <div class="ov-score-label">skóre</div>
    <div id="overlay-score">0</div>
    <p id="overlay-msg"></p>
    <button id="restart-btn">Hrát znovu</button>
    <button id="switch-btn" class="ov-alt">Zkusit puzzle</button>
  </div>
</div>
<script>
// dev cache-bust — vždy čerstvý game.js
(function(){
  const t = new URLSearchParams(location.search).get('t') || Date.now();
  document.write('<scr' + 'ipt src="./lib/entry.js" data-box2d-dir="./lib"><\/scr' + 'ipt>');
  document.write('<scr' + 'ipt src="./js/fluid.js?t=' + encodeURIComponent(t) + '"><\/scr' + 'ipt>');
  document.write('<scr' + 'ipt src="./js/fluid_lf.js?t=' + encodeURIComponent(t) + '"><\/scr' + 'ipt>');
  document.write('<scr' + 'ipt src="./js/fluid_gl.js?t=' + encodeURIComponent(t) + '"><\/scr' + 'ipt>');
  document.write('<scr' + 'ipt src="./js/puzzle.js?t=' + encodeURIComponent(t) + '"><\/scr' + 'ipt>');
  document.write('<scr' + 'ipt src="./js/level2.js?t=' + encodeURIComponent(t) + '"><\/scr' + 'ipt>');
  document.write('<scr' + 'ipt src="./js/game.js?t=' + encodeURIComponent(t) + '"><\/scr' + 'ipt>');
})();
</script>
</body>
</html>
